        <div class="btn-row">
          <button class="btn btn-outline" id="btnClosePreview">關閉</button>
          <a class="btn btn-primary primary-weight" id="btnOpenPreviewNewTab" href="#" target="_blank" rel="noopener" style="text-decoration:none; text-align:center;">在新分頁開啟</a>
        </div>
      </div>
    </div>
  `;
}

export function mountBookingsView(container, ctx) {
  const { tripId, memberId, trip, members } = ctx;
  const cleanups = [];

  /**
   * 機票/住宿的編輯要先驗證 PIN 才能進入——如果這趟旅程還沒設定過 PIN，
   * 就直接放行（等主揪去旅程設定頁設定後才會開始要求驗證）。
   * @param {Function} onSuccess
   */
  function requireBookingsPin(onSuccess) {
    const pinHash = trip.security?.bookingsPinHash;
    if (!pinHash) {
      onSuccess();
      return;
    }
    openPinVerify({
      title: "輸入 PIN 碼",
      subtitle: "編輯機票／住宿資訊需要驗證",
      checkPin: async (value) => (await hashPin(value)) === pinHash,
      onSuccess,
    });
  }

  /* ---------- 子分頁切換 ---------- */
  container.querySelectorAll(".subtab").forEach((tab) => {
    tab.addEventListener("click", () => {
      container.querySelectorAll(".subtab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      container.querySelectorAll(".booking-panel").forEach((p) => p.classList.remove("active"));
      container.querySelector(`#panel-${tab.dataset.tab}`).classList.add("active");
    });
  });

  /* ---------- 機票 ---------- */
  const countdownEl = container.querySelector("#flightCountdown");
  const today = localISODate(new Date());
  if (trip.startDate && today < trip.startDate) {
    const n = daysBetween(today, trip.startDate);
    countdownEl.innerHTML = `<div class="flight-countdown"><div><div class="fc-num">${n}</div><div class="fc-label">天後出發</div></div><i class="fa-solid fa-plane-departure"></i></div>`;
  } else if (trip.endDate && today <= trip.endDate) {
    const n = daysBetween(today, trip.endDate);
    countdownEl.innerHTML = `<div class="flight-countdown post-trip"><div><div class="fc-num">${n}</div><div class="fc-label">天後返程回國</div></div><i class="fa-solid fa-plane-arrival"></i></div>`;
  } else {
    countdownEl.innerHTML = "";
  }

  let editingFlightId = null;
  let flightDir = "outbound";
  const flightSheet = container.querySelector("#flightSheetOverlay");
  container.querySelectorAll("#flightDirPicker .dir-opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      flightDir = opt.dataset.dir;
      container.querySelectorAll("#flightDirPicker .dir-opt").forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
    });
  });

  function openAddFlight() {
    editingFlightId = null;
    container.querySelector("#flightSheetTitle").textContent = "新增機票";
    container.querySelector("#btnDeleteFlight").style.display = "none";
    flightDir = "outbound";
    container.querySelectorAll("#flightDirPicker .dir-opt").forEach((o, i) => o.classList.toggle("selected", i === 0));
    ["fFlightDate", "fAirline", "fFlightNumber", "fDepCode", "fDepCity", "fDepTime", "fArrCode", "fArrCity", "fArrTime", "fDuration", "fAircraft", "fBaggage"].forEach(
      (id) => (container.querySelector(`#${id}`).value = "")
    );
    flightSheet.classList.add("show");
  }
  function openEditFlight(f) {
    editingFlightId = f.id;
    container.querySelector("#flightSheetTitle").textContent = "編輯機票";
    container.querySelector("#btnDeleteFlight").style.display = "block";
    flightDir = f.direction || "outbound";
    container.querySelectorAll("#flightDirPicker .dir-opt").forEach((o) => o.classList.toggle("selected", o.dataset.dir === flightDir));
    container.querySelector("#fFlightDate").value = f.date || "";
    container.querySelector("#fAirline").value = f.airline || "";
    container.querySelector("#fFlightNumber").value = f.flightNumber || "";
    container.querySelector("#fDepCode").value = f.departure?.airportCode || "";
    container.querySelector("#fDepCity").value = f.departure?.cityName || "";
    container.querySelector("#fDepTime").value = f.departure?.time || "";
    container.querySelector("#fArrCode").value = f.arrival?.airportCode || "";
    container.querySelector("#fArrCity").value = f.arrival?.cityName || "";
    container.querySelector("#fArrTime").value = f.arrival?.time || "";
    container.querySelector("#fDuration").value = f.duration || "";
    container.querySelector("#fAircraft").value = f.aircraft || "";
    container.querySelector("#fBaggage").value = f.baggage || "";
    flightSheet.classList.add("show");
  }
  container.querySelector("#btnAddFlight").addEventListener("click", openAddFlight);
  container.querySelector("#btnCancelFlight").addEventListener("click", () => flightSheet.classList.remove("show"));
  flightSheet.addEventListener("click", (e) => { if (e.target === flightSheet) flightSheet.classList.remove("show"); });

  // 機場代碼打完 3 碼自動帶出城市，省得每次都要手動打城市名稱；
  // 只有城市欄位還空著的時候才會自動帶入，使用者自己手動改過的城市名稱不會被蓋掉。
  function wireAirportCodeAutofill(codeInputId, cityInputId) {
    const codeInput = container.querySelector(`#${codeInputId}`);
    const cityInput = container.querySelector(`#${cityInputId}`);
    codeInput.addEventListener("input", () => {
      const code = codeInput.value.trim().toUpperCase();
      if (codeInput.value !== code) codeInput.value = code;
      if (code.length === 3 && AIRPORT_CITY_MAP[code] && !cityInput.value.trim()) {
        cityInput.value = AIRPORT_CITY_MAP[code];
      }
    });
  }
  wireAirportCodeAutofill("fDepCode", "fDepCity");
  wireAirportCodeAutofill("fArrCode", "fArrCity");

  container.querySelector("#btnDeleteFlight").addEventListener("click", async () => {
    if (!editingFlightId) return;
    if (!confirm("確定要刪除這筆機票嗎？")) return;
    await deleteFlight(tripId, editingFlightId);
    flightSheet.classList.remove("show");
  });
  container.querySelector("#btnSaveFlight").addEventListener("click", async () => {
    const payload = {
      direction: flightDir,
      date: container.querySelector("#fFlightDate").value,
      airline: container.querySelector("#fAirline").value.trim(),
      flightNumber: container.querySelector("#fFlightNumber").value.trim(),
      departure: {
        airportCode: container.querySelector("#fDepCode").value.trim().toUpperCase(),
        cityName: container.querySelector("#fDepCity").value.trim(),
        time: container.querySelector("#fDepTime").value,
      },
      arrival: {
        airportCode: container.querySelector("#fArrCode").value.trim().toUpperCase(),
        cityName: container.querySelector("#fArrCity").value.trim(),
        time: container.querySelector("#fArrTime").value,
      },
      duration: container.querySelector("#fDuration").value.trim(),
      aircraft: container.querySelector("#fAircraft").value.trim(),
      baggage: container.querySelector("#fBaggage").value.trim(),
    };
    if (editingFlightId) await updateFlight(tripId, editingFlightId, payload);
    else await createFlight(tripId, payload);
    flightSheet.classList.remove("show");
  });

  const flightsListEl = container.querySelector("#flightsList");
  cleanups.push(
    listenFlights(tripId, (flights) => {
      const sorted = [...flights].sort((a, b) => (a.direction === "outbound" ? -1 : 1));
      flightsListEl.innerHTML = sorted
        .map((f) => {
          const isReturn = f.direction === "return";
          const planeIcon = isReturn ? "fa-plane-arrival" : "fa-plane-departure";
          return `
            <div class="boarding-pass-v2" data-flight-id="${f.id}">
              <div class="bp2-head">
                <span class="bp2-airline">${f.airline || "（未填航空公司）"}</span>
                <span class="bp2-editbadge"><i class="fa-solid fa-lock"></i>編輯</span>
              </div>
              <div class="bp2-flightnum">${f.flightNumber || "--"}</div>
              <div class="bp2-route">
                <div class="bp2-side">
                  <div class="bp2-code">${f.departure?.airportCode || "--"}</div>
                  <div class="bp2-time">${f.departure?.time || "--:--"}</div>
                  ${f.departure?.cityName ? `<span class="bp2-city-pill dep">${f.departure.cityName}</span>` : ""}
                </div>
                <div class="bp2-mid">
                  ${f.duration ? `<div class="bp2-duration">${f.duration}</div>` : ""}
                  <div class="bp2-line-row">
                    <span class="bp2-dash-seg"></span>
                    <span class="bp2-plane-badge"><i class="fa-solid ${planeIcon}"></i></span>
                    <span class="bp2-dash-seg"></span>
                  </div>
                  <div class="bp2-date">${f.date || ""}</div>
                </div>
                <div class="bp2-side">
                  <div class="bp2-code">${f.arrival?.airportCode || "--"}</div>
                  <div class="bp2-time">${f.arrival?.time || "--:--"}</div>
                  ${f.arrival?.cityName ? `<span class="bp2-city-pill arr">${f.arrival.cityName}</span>` : ""}
                </div>
              </div>
              ${
                f.baggage || f.aircraft
                  ? `<div class="bp2-info-row">
                      ${f.baggage ? `<div class="bp2-info"><span class="bp2-info-label"><i class="fa-solid fa-suitcase"></i> BAGGAGE</span><b>${f.baggage}</b></div>` : ""}
                      ${f.baggage && f.aircraft ? `<div class="bp2-info-divider"></div>` : ""}
                      ${f.aircraft ? `<div class="bp2-info"><span class="bp2-info-label"><i class="fa-solid fa-plane"></i> AIRCRAFT</span><b>${f.aircraft}</b></div>` : ""}
                    </div>`
                  : ""
              }
            </div>
          `;
        })
        .join("") || `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">還沒有機票資料</p>`;

      flightsListEl.querySelectorAll(".boarding-pass-v2").forEach((card) => {
        card.addEventListener("click", () => {
          const f = flights.find((x) => x.id === card.dataset.flightId);
          requireBookingsPin(() => openEditFlight(f));
        });
      });
    })
  );

  /* ---------- 住宿 ---------- */
  const hotelSheet = container.querySelector("#hotelSheetOverlay");
  let editingHotelId = null;
  let hotelDocUrl = null;
  let hotelCoverUrl = null;
  let hotelCoverPosition = { x: 50, y: 50 };
  let hotelLocVerified = false;
  let hotelVerifiedLocation = null; // { formattedAddress, lat, lon }，驗證成功後存下來，儲存時直接用這份

  const coverEditor = container.querySelector("#coverPositionEditor");
  const hotelPhotoInput = container.querySelector("#fHotelPhoto");

  function applyCoverEditorBg(url) {
    coverEditor.style.backgroundImage = `url('${url}')`;
    coverEditor.style.backgroundPosition = `${hotelCoverPosition.x}% ${hotelCoverPosition.y}%`;
    coverEditor.style.display = "block";
  }
  function hideCoverEditor() {
    coverEditor.style.display = "none";
    coverEditor.style.backgroundImage = "";
  }
  function parsePosition(str) {
    if (!str) return { x: 50, y: 50 };
    const [x, y] = str.split(" ").map((v) => parseFloat(v));
    return { x: isNaN(x) ? 50 : x, y: isNaN(y) ? 50 : y };
  }

  hotelPhotoInput.addEventListener("change", () => {
    const file = hotelPhotoInput.files[0];
    if (!file) return;
    hotelCoverPosition = { x: 50, y: 50 };
    const objectUrl = URL.createObjectURL(file);
    applyCoverEditorBg(objectUrl);
  });

  let coverDragging = false;
  let coverDragStart = { x: 0, y: 0 };
  let coverDragStartPos = { x: 50, y: 50 };
  coverEditor.style.touchAction = "none";
  coverEditor.addEventListener("pointerdown", (e) => {
    if (coverEditor.style.display === "none") return;
    coverDragging = true;
    coverEditor.classList.add("dragging");
    coverEditor.setPointerCapture(e.pointerId);
    coverDragStart = { x: e.clientX, y: e.clientY };
    coverDragStartPos = { ...hotelCoverPosition };
  });
  coverEditor.addEventListener("pointermove", (e) => {
    if (!coverDragging) return;
    const rect = coverEditor.getBoundingClientRect();
    const dx = e.clientX - coverDragStart.x;
    const dy = e.clientY - coverDragStart.y;
    const newX = Math.min(100, Math.max(0, coverDragStartPos.x - (dx / rect.width) * 100));
    const newY = Math.min(100, Math.max(0, coverDragStartPos.y - (dy / rect.height) * 100));
    hotelCoverPosition = { x: newX, y: newY };
    coverEditor.style.backgroundPosition = `${newX}% ${newY}%`;
  });
  function endCoverDrag(e) {
    if (!coverDragging) return;
    coverDragging = false;
    coverEditor.classList.remove("dragging");
    try { coverEditor.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  coverEditor.addEventListener("pointerup", endCoverDrag);
  coverEditor.addEventListener("pointercancel", endCoverDrag);

  const hotelAddrInput = container.querySelector("#fHotelAddress");
  const hotelVerifyStatus = container.querySelector("#hotelVerifyStatus");
  const hotelSaveBtn = container.querySelector("#btnSaveHotel");
  wireMapsLinkButton(container.querySelector("#fHotelMapsUrl"), container.querySelector("#btnOpenHotelMaps"), container.querySelector("#hotelMapsNameHint"));

  function updateHotelSaveBtn() {
    hotelSaveBtn.disabled = !hotelLocVerified;
    hotelSaveBtn.textContent = hotelLocVerified ? "儲存" : "先驗證地址";
  }
  hotelAddrInput.addEventListener("input", () => {
    hotelLocVerified = false;
    hotelVerifiedLocation = null;
    hotelVerifyStatus.innerHTML = "";
    hotelVerifyStatus.className = "verify-status";
    updateHotelSaveBtn();
  });
  container.querySelector("#btnVerifyHotelLoc").addEventListener("click", async () => {
    const loc = hotelAddrInput.value.trim();
    if (!loc) {
      hotelVerifyStatus.className = "verify-status fail";
      hotelVerifyStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 請先輸入地址`;
      return;
    }
    hotelVerifyStatus.className = "verify-status loading";
    hotelVerifyStatus.innerHTML = `<div class="spinner"></div> 正在比對地圖位置…（地址比較複雜的話可能要重試幾次，會多花幾秒）`;
    try {
      const result = await verifyLocation(loc);
      if (!result) {
        hotelLocVerified = false;
        hotelVerifiedLocation = null;
        hotelVerifyStatus.className = "verify-status fail";
        hotelVerifyStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 找不到這個地點，請換個寫法試試（例如加上城市名）`;
        updateHotelSaveBtn();
        return;
      }
      hotelLocVerified = true;
      hotelVerifiedLocation = result;
      hotelVerifyStatus.className = result.approximate ? "verify-status approx" : "verify-status ok";
      hotelVerifyStatus.innerHTML = result.approximate
        ? `<i class="fa-solid fa-triangle-exclamation"></i> 只找到大概位置：${result.formattedAddress}（門牌等級的細節這個免費地圖資料庫沒收錄，建議之後手動核對地圖）`
        : `<i class="fa-solid fa-circle-check"></i> 已驗證：${result.formattedAddress}`;
      updateHotelSaveBtn();
    } catch (err) {
      console.error("[住宿地址驗證失敗]", err);
      hotelLocVerified = false;
      hotelVerifiedLocation = null;
      hotelVerifyStatus.className = "verify-status fail";
      hotelVerifyStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 驗證失敗，請檢查網路連線`;
      updateHotelSaveBtn();
    }
  });

  function renderHotelSplitCheckboxes(containerEl, checkedIds) {
    containerEl.innerHTML = members
      .map(
        (m) => `
          <div class="split-member-row">
            <div class="split-check ${checkedIds.includes(m.id) ? "" : "unchecked"}" data-member-id="${m.id}"><i class="fa-solid fa-check"></i></div>
            <span class="split-name">${avatarInlinePrefix(m)}${m.name}</span>
          </div>
        `
      )
      .join("");
    containerEl.querySelectorAll(".split-check").forEach((chk) => {
      chk.addEventListener("click", () => chk.classList.toggle("unchecked"));
    });
  }
  function getCheckedIds(containerEl) {
    return [...containerEl.querySelectorAll(".split-check:not(.unchecked)")].map((el) => el.dataset.memberId);
  }

  function openAddHotel() {
    editingHotelId = null;
    hotelDocUrl = null;
    hotelCoverUrl = null;
    hotelCoverPosition = { x: 50, y: 50 };
    hotelLocVerified = false;
    hotelVerifiedLocation = null;
    hotelVerifyStatus.innerHTML = "";
    hotelVerifyStatus.className = "verify-status";
    container.querySelector("#hotelSheetTitle").textContent = "新增住宿";
    container.querySelector("#btnDeleteHotel").style.display = "none";
    ["fHotelName", "fCheckinDate", "fCheckoutDate", "fHotelAddress", "fHotelMapsUrl", "fHotelTotal"].forEach((id) => (container.querySelector(`#${id}`).value = ""));
    container.querySelector("#fHotelMapsUrl").dispatchEvent(new Event("input"));
    container.querySelector("#fCheckinTime").value = "15:00";
    container.querySelector("#fCheckoutTime").value = "11:00";
    hotelPhotoInput.value = "";
    container.querySelector("#fHotelDoc").value = "";
    hideCoverEditor();
    container.querySelector("#hotelPhotoPreview").style.display = "none";
    container.querySelector("#hotelDocPreview").style.display = "none";
    renderHotelSplitCheckboxes(container.querySelector("#hotelSplitMembers"), members.map((m) => m.id));
    updateHotelSaveBtn();
    hotelSheet.classList.add("show");
  }
  function openEditHotel(h) {
    editingHotelId = h.id;
    hotelDocUrl = h.documentUrls?.[0] || null;
    hotelCoverUrl = h.coverPhotoUrl || null;
    hotelCoverPosition = parsePosition(h.coverPhotoPosition);
    hotelLocVerified = true;
    // 舊資料可能是改版前存的、沒有 lat/lon；沿用既有 formattedAddress 當底，使用者沒改地址欄位就不會被清空
    hotelVerifiedLocation = h.location?.lat != null
      ? { formattedAddress: h.location.formattedAddress, lat: h.location.lat, lon: h.location.lon }
      : { formattedAddress: h.location?.formattedAddress || "" };
    hotelVerifyStatus.className = "verify-status ok";
    hotelVerifyStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 地址已驗證`;
    container.querySelector("#hotelSheetTitle").textContent = "編輯住宿";
    container.querySelector("#btnDeleteHotel").style.display = "block";
    container.querySelector("#fHotelName").value = h.name || "";
    container.querySelector("#fCheckinDate").value = h.checkIn?.date || "";
    container.querySelector("#fCheckinTime").value = h.checkIn?.time || "15:00";
    container.querySelector("#fCheckoutDate").value = h.checkOut?.date || "";
    container.querySelector("#fCheckoutTime").value = h.checkOut?.time || "11:00";
    container.querySelector("#fHotelAddress").value = h.location?.formattedAddress || "";
    container.querySelector("#fHotelMapsUrl").value = h.location?.googleMapsUrl || "";
    container.querySelector("#fHotelMapsUrl").dispatchEvent(new Event("input"));
    container.querySelector("#fHotelTotal").value = h.totalCost || "";
    hotelPhotoInput.value = "";
    container.querySelector("#fHotelDoc").value = "";
    const photoPreview = container.querySelector("#hotelPhotoPreview");
    if (hotelCoverUrl) {
      applyCoverEditorBg(hotelCoverUrl);
      photoPreview.style.display = "flex";
      photoPreview.innerHTML = `<span>已上傳封面照片，可在上方拖曳調整顯示位置（選新檔案會取代）</span>`;
    } else {
      hideCoverEditor();
      photoPreview.style.display = "none";
    }
    const docPreview = container.querySelector("#hotelDocPreview");
    if (hotelDocUrl) {
      docPreview.style.display = "flex";
      docPreview.innerHTML = `<i class="fa-solid fa-file"></i><span class="preview-link" id="hotelDocPreviewLink">目前已上傳憑證，點此預覽（選新檔案會取代）</span>`;
      container.querySelector("#hotelDocPreviewLink").addEventListener("click", () => {
        openDocPreview({ displayName: "住宿憑證", fileType: guessFileType(hotelDocUrl), fileUrl: hotelDocUrl });
      });
    } else {
      docPreview.style.display = "none";
    }
    renderHotelSplitCheckboxes(container.querySelector("#hotelSplitMembers"), h.splitMemberIds || members.map((m) => m.id));
    updateHotelSaveBtn();
    hotelSheet.classList.add("show");
  }
  container.querySelector("#btnAddHotel").addEventListener("click", openAddHotel);
  container.querySelector("#btnCancelHotel").addEventListener("click", () => hotelSheet.classList.remove("show"));
  hotelSheet.addEventListener("click", (e) => { if (e.target === hotelSheet) hotelSheet.classList.remove("show"); });
  container.querySelector("#btnDeleteHotel").addEventListener("click", async () => {
    if (!editingHotelId) return;
    if (!confirm("確定要刪除這筆住宿嗎？")) return;
    await deleteHotel(tripId, editingHotelId);
    hotelSheet.classList.remove("show");
  });
  container.querySelector("#btnSaveHotel").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = "上傳中...";
    try {
      const photoFile = hotelPhotoInput.files[0];
      if (photoFile) {
        console.log("[住宿] 上傳封面照片", photoFile.name);
        hotelCoverUrl = await uploadFile(`trips/${tripId}/hotels/${Date.now()}-${photoFile.name}`, photoFile);
        console.log("[住宿] 封面照片上傳完成", hotelCoverUrl);
      }
      const docFile = container.querySelector("#fHotelDoc").files[0];
      if (docFile) {
        console.log("[住宿] 上傳憑證", docFile.name);
        hotelDocUrl = await uploadFile(`trips/${tripId}/hotels/${Date.now()}-${docFile.name}`, docFile);
        console.log("[住宿] 憑證上傳完成", hotelDocUrl);
      }
      const payload = {
        name: container.querySelector("#fHotelName").value.trim(),
        coverPhotoUrl: hotelCoverUrl || "",
        coverPhotoPosition: `${hotelCoverPosition.x}% ${hotelCoverPosition.y}%`,
        checkIn: { date: container.querySelector("#fCheckinDate").value, time: container.querySelector("#fCheckinTime").value },
        checkOut: { date: container.querySelector("#fCheckoutDate").value, time: container.querySelector("#fCheckoutTime").value },
        location: withMapsUrl(
          hotelVerifiedLocation || { formattedAddress: container.querySelector("#fHotelAddress").value.trim() },
          container.querySelector("#fHotelMapsUrl").value
        ),
        totalCost: Number(container.querySelector("#fHotelTotal").value) || 0,
        splitMemberIds: getCheckedIds(container.querySelector("#hotelSplitMembers")),
        documentUrls: hotelDocUrl ? [hotelDocUrl] : [],
      };
      console.log("[住宿] 準備寫入 Firestore", payload);
      if (editingHotelId) await updateHotel(tripId, editingHotelId, payload);
      else await createHotel(tripId, payload);
      console.log("[住宿] 儲存完成");
      hotelSheet.classList.remove("show");
    } catch (err) {
      console.error("[儲存住宿失敗]", err);
      alert(
        "儲存失敗：" + (err.message || err.code || "未知錯誤") +
        (err.code === "storage/unauthorized"
          ? "\n\n這代表 Firebase Storage 的安全規則還沒開放上傳，請到 Firebase Console → Storage → Rules 調整規則。"
          : "")
      );
    } finally {
      btn.disabled = false;
      updateHotelSaveBtn();
    }
  });

  const hotelsListEl = container.querySelector("#hotelsList");
  cleanups.push(
    listenHotels(tripId, (hotels) => {
      hotelsListEl.innerHTML = hotels
        .map((h) => {
          const checkedCount = (h.splitMemberIds || []).length || 1;
          const perPerson = Math.round((h.totalCost || 0) / checkedCount);
          return `
            <div class="hotel-card" data-hotel-id="${h.id}">
              <div class="hotel-photo" style="${h.coverPhotoUrl ? `background-image:url('${h.coverPhotoUrl}');background-position:${h.coverPhotoPosition || "center"};` : ""}">
                ${h.coverPhotoUrl ? "" : '<i class="fa-solid fa-hotel"></i>'}
                <span class="hotel-lock"><i class="fa-solid fa-lock"></i>編輯</span>
              </div>
              <div class="hotel-body">
                <div class="hotel-name">${h.name || "（未命名）"}</div>
                <div class="hotel-row"><span>Check-in</span><b>${h.checkIn?.date || ""} ${h.checkIn?.time || ""}</b></div>
                <div class="hotel-row"><span>Check-out</span><b>${h.checkOut?.date || ""} ${h.checkOut?.time || ""}</b></div>
                ${h.location?.formattedAddress ? `<div class="hotel-address"><i class="fa-solid fa-location-dot"></i>${h.location.formattedAddress}</div>` : ""}
                <div class="split-box"><span class="sb-label">每人分攤（${checkedCount}人）</span><span class="sb-value">NT$ ${perPerson.toLocaleString()}</span></div>
              </div>
            </div>
          `;
        })
        .join("") || `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">還沒有住宿資料</p>`;

      hotelsListEl.querySelectorAll(".hotel-card").forEach((card) => {
        card.addEventListener("click", () => {
          const h = hotels.find((x) => x.id === card.dataset.hotelId);
          requireBookingsPin(() => openEditHotel(h));
        });
      });
    })
  );

  /* ---------- 租車 ---------- */
  const carSheet = container.querySelector("#carSheetOverlay");
  let editingCarId = null;
  let carDocUrl = null;
  let carPickupVerified = false;
  let carDropoffVerified = false;
  let carPickupVerifiedLocation = null; // { formattedAddress, lat, lon }
  let carDropoffVerifiedLocation = null;

  const pickupLocInput = container.querySelector("#fPickupLoc");
  const dropoffLocInput = container.querySelector("#fDropoffLoc");
  const pickupVerifyStatus = container.querySelector("#pickupVerifyStatus");
  const dropoffVerifyStatus = container.querySelector("#dropoffVerifyStatus");
  const carSaveBtn = container.querySelector("#btnSaveCar");
  wireMapsLinkButton(container.querySelector("#fPickupMapsUrl"), container.querySelector("#btnOpenPickupMaps"), container.querySelector("#pickupMapsNameHint"));
  wireMapsLinkButton(container.querySelector("#fDropoffMapsUrl"), container.querySelector("#btnOpenDropoffMaps"), container.querySelector("#dropoffMapsNameHint"));

  function updateCarSaveBtn() {
    const ok = carPickupVerified && carDropoffVerified;
    carSaveBtn.disabled = !ok;
    carSaveBtn.textContent = ok ? "儲存" : "先驗證地點";
  }
  function wireLocVerify(input, statusEl, setVerified, setLocation) {
    input.addEventListener("input", () => {
      setVerified(false);
      setLocation(null);
      statusEl.innerHTML = "";
      statusEl.className = "verify-status";
      updateCarSaveBtn();
    });
  }
  wireLocVerify(pickupLocInput, pickupVerifyStatus, (v) => (carPickupVerified = v), (l) => (carPickupVerifiedLocation = l));
  wireLocVerify(dropoffLocInput, dropoffVerifyStatus, (v) => (carDropoffVerified = v), (l) => (carDropoffVerifiedLocation = l));

  async function verifyLoc(input, statusEl, setVerified, setLocation) {
    const loc = input.value.trim();
    if (!loc) {
      statusEl.className = "verify-status fail";
      statusEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 請先輸入地點`;
      return;
    }
    statusEl.className = "verify-status loading";
    statusEl.innerHTML = `<div class="spinner"></div> 正在比對地圖位置…（地址比較複雜的話可能要重試幾次，會多花幾秒）`;
    try {
      const result = await verifyLocation(loc);
      if (!result) {
        setVerified(false);
        setLocation(null);
        statusEl.className = "verify-status fail";
        statusEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 找不到這個地點，請換個寫法試試`;
        updateCarSaveBtn();
        return;
      }
      setVerified(true);
      setLocation(result);
      statusEl.className = result.approximate ? "verify-status approx" : "verify-status ok";
      statusEl.innerHTML = result.approximate
        ? `<i class="fa-solid fa-triangle-exclamation"></i> 只找到大概位置：${result.formattedAddress}（門牌等級的細節這個免費地圖資料庫沒收錄，建議之後手動核對地圖）`
        : `<i class="fa-solid fa-circle-check"></i> 已驗證：${result.formattedAddress}`;
      updateCarSaveBtn();
    } catch (err) {
      console.error("[租車地點驗證失敗]", err);
      setVerified(false);
      setLocation(null);
      statusEl.className = "verify-status fail";
      statusEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 驗證失敗，請檢查網路連線`;
      updateCarSaveBtn();
    }
  }
  container.querySelector("#btnVerifyPickupLoc").addEventListener("click", () =>
    verifyLoc(pickupLocInput, pickupVerifyStatus, (v) => (carPickupVerified = v), (l) => (carPickupVerifiedLocation = l))
  );
  container.querySelector("#btnVerifyDropoffLoc").addEventListener("click", () =>
    verifyLoc(dropoffLocInput, dropoffVerifyStatus, (v) => (carDropoffVerified = v), (l) => (carDropoffVerifiedLocation = l))
  );

  container.querySelector("#fCarCost").addEventListener("input", (e) => {
    const show = Number(e.target.value) > 0;
    container.querySelector("#carSplitWrap").style.display = show ? "block" : "none";
    if (show && !container.querySelector("#carSplitMembers").children.length) {
      renderHotelSplitCheckboxes(container.querySelector("#carSplitMembers"), members.map((m) => m.id));
    }
  });

  function openAddCar() {
    editingCarId = null;
    carDocUrl = null;
    carPickupVerified = false;
    carDropoffVerified = false;
    carPickupVerifiedLocation = null;
    carDropoffVerifiedLocation = null;
    pickupVerifyStatus.innerHTML = "";
    pickupVerifyStatus.className = "verify-status";
    dropoffVerifyStatus.innerHTML = "";
    dropoffVerifyStatus.className = "verify-status";
    container.querySelector("#carSheetTitle").textContent = "新增租車";
    container.querySelector("#btnDeleteCar").style.display = "none";
    ["fCarName", "fPickupDate", "fPickupTime", "fPickupLoc", "fPickupMapsUrl", "fDropoffDate", "fDropoffTime", "fDropoffLoc", "fDropoffMapsUrl", "fCarCost"].forEach(
      (id) => (container.querySelector(`#${id}`).value = "")
    );
    container.querySelector("#fPickupMapsUrl").dispatchEvent(new Event("input"));
    container.querySelector("#fDropoffMapsUrl").dispatchEvent(new Event("input"));
    container.querySelector("#fCarDoc").value = "";
    container.querySelector("#carDocPreview").style.display = "none";
    container.querySelector("#carSplitWrap").style.display = "none";
    updateCarSaveBtn();
    carSheet.classList.add("show");
  }
  function openEditCar(c) {
    editingCarId = c.id;
    carDocUrl = c.documentUrls?.[0] || null;
    carPickupVerified = true;
    carDropoffVerified = true;
    // 舊資料可能沒有 lat/lon；沿用既有 formattedAddress 當底，使用者沒改欄位就不會被清空
    carPickupVerifiedLocation = c.pickup?.location?.lat != null
      ? { formattedAddress: c.pickup.location.formattedAddress, lat: c.pickup.location.lat, lon: c.pickup.location.lon }
      : { formattedAddress: c.pickup?.location?.formattedAddress || "" };
    carDropoffVerifiedLocation = c.dropoff?.location?.lat != null
      ? { formattedAddress: c.dropoff.location.formattedAddress, lat: c.dropoff.location.lat, lon: c.dropoff.location.lon }
      : { formattedAddress: c.dropoff?.location?.formattedAddress || "" };
    pickupVerifyStatus.className = "verify-status ok";
    pickupVerifyStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 已驗證`;
    dropoffVerifyStatus.className = "verify-status ok";
    dropoffVerifyStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 已驗證`;
    container.querySelector("#carSheetTitle").textContent = "編輯租車";
    container.querySelector("#btnDeleteCar").style.display = "block";
    container.querySelector("#fCarName").value = c.vendorAndModel || "";
    container.querySelector("#fPickupDate").value = c.pickup?.date || "";
    container.querySelector("#fPickupTime").value = c.pickup?.time || "";
    container.querySelector("#fPickupLoc").value = c.pickup?.location?.formattedAddress || "";
    container.querySelector("#fPickupMapsUrl").value = c.pickup?.location?.googleMapsUrl || "";
    container.querySelector("#fPickupMapsUrl").dispatchEvent(new Event("input"));
    container.querySelector("#fDropoffDate").value = c.dropoff?.date || "";
    container.querySelector("#fDropoffTime").value = c.dropoff?.time || "";
    container.querySelector("#fDropoffLoc").value = c.dropoff?.location?.formattedAddress || "";
    container.querySelector("#fDropoffMapsUrl").value = c.dropoff?.location?.googleMapsUrl || "";
    container.querySelector("#fDropoffMapsUrl").dispatchEvent(new Event("input"));
    container.querySelector("#fCarCost").value = c.totalCost || "";
    container.querySelector("#fCarDoc").value = "";
    const carDocPreview = container.querySelector("#carDocPreview");
    if (carDocUrl) {
      carDocPreview.style.display = "flex";
      carDocPreview.innerHTML = `<i class="fa-solid fa-file"></i><span class="preview-link" id="carDocPreviewLink">目前已上傳憑證，點此預覽（選新檔案會取代）</span>`;
      container.querySelector("#carDocPreviewLink").addEventListener("click", () => {
        openDocPreview({ displayName: "租車憑證", fileType: guessFileType(carDocUrl), fileUrl: carDocUrl });
      });
    } else {
      carDocPreview.style.display = "none";
    }
    const showSplit = (c.totalCost || 0) > 0;
    container.querySelector("#carSplitWrap").style.display = showSplit ? "block" : "none";
    if (showSplit) renderHotelSplitCheckboxes(container.querySelector("#carSplitMembers"), c.splitMemberIds || members.map((m) => m.id));
    updateCarSaveBtn();
    carSheet.classList.add("show");
  }
  container.querySelector("#btnAddCar").addEventListener("click", openAddCar);
  container.querySelector("#btnCancelCar").addEventListener("click", () => carSheet.classList.remove("show"));
  carSheet.addEventListener("click", (e) => { if (e.target === carSheet) carSheet.classList.remove("show"); });
  container.querySelector("#btnDeleteCar").addEventListener("click", async () => {
    if (!editingCarId) return;
    if (!confirm("確定要刪除這筆租車紀錄嗎？")) return;
    await deleteCarRental(tripId, editingCarId);
    carSheet.classList.remove("show");
  });
  container.querySelector("#btnSaveCar").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = "上傳中...";
    try {
      const docFile = container.querySelector("#fCarDoc").files[0];
      if (docFile) carDocUrl = await uploadFile(`trips/${tripId}/carRentals/${Date.now()}-${docFile.name}`, docFile);

      const cost = Number(container.querySelector("#fCarCost").value) || 0;
      const payload = {
        vendorAndModel: container.querySelector("#fCarName").value.trim(),
        pickup: {
          date: container.querySelector("#fPickupDate").value,
          time: container.querySelector("#fPickupTime").value,
          location: withMapsUrl(
            carPickupVerifiedLocation || { formattedAddress: container.querySelector("#fPickupLoc").value.trim() },
            container.querySelector("#fPickupMapsUrl").value
          ),
        },
        dropoff: {
          date: container.querySelector("#fDropoffDate").value,
          time: container.querySelector("#fDropoffTime").value,
          location: withMapsUrl(
            carDropoffVerifiedLocation || { formattedAddress: container.querySelector("#fDropoffLoc").value.trim() },
            container.querySelector("#fDropoffMapsUrl").value
          ),
        },
        totalCost: cost,
        splitMemberIds: cost > 0 ? getCheckedIds(container.querySelector("#carSplitMembers")) : [],
        documentUrls: carDocUrl ? [carDocUrl] : [],
      };
      if (editingCarId) await updateCarRental(tripId, editingCarId, payload);
      else await createCarRental(tripId, payload);
      carSheet.classList.remove("show");
    } catch (err) {
      console.error("[儲存租車失敗]", err);
      alert(
        "儲存失敗：" + (err.message || err.code || "未知錯誤") +
        (err.code === "storage/unauthorized"
          ? "\n\n這代表 Firebase Storage 的安全規則還沒開放上傳，請到 Firebase Console → Storage → Rules 調整規則。"
          : "")
      );
    } finally {
      btn.disabled = false;
      updateCarSaveBtn();
    }
  });

  const carsListEl = container.querySelector("#carsList");
  cleanups.push(
    listenCarRentals(tripId, (cars) => {
      carsListEl.innerHTML = cars
        .map(
          (c) => `
            <div class="car-card" data-car-id="${c.id}">
              <div class="car-top"><div class="car-icon"><i class="fa-solid fa-car"></i></div><div><div class="car-name">${c.vendorAndModel || "（未命名）"}</div></div></div>
              <div class="car-timeline">
                <div class="car-point"><div class="cp-label">取車</div><div class="cp-time">${c.pickup?.date || ""} ${c.pickup?.time || ""}</div><div class="cp-loc"><i class="fa-solid fa-location-dot"></i>${c.pickup?.location?.formattedAddress || ""}</div></div>
                <div class="car-point"><div class="cp-label">還車</div><div class="cp-time">${c.dropoff?.date || ""} ${c.dropoff?.time || ""}</div><div class="cp-loc"><i class="fa-solid fa-location-dot"></i>${c.dropoff?.location?.formattedAddress || ""}</div></div>
              </div>
            </div>
          `
        )
        .join("") || `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">還沒有租車資料</p>`;

      carsListEl.querySelectorAll(".car-card").forEach((card) => {
        card.addEventListener("click", () => {
          const c = cars.find((x) => x.id === card.dataset.carId);
          openEditCar(c);
        });
      });
    })
  );

  /* ---------- 憑證 ---------- */
  const docSheet = container.querySelector("#docSheetOverlay");
  container.querySelector("#btnAddDoc").addEventListener("click", () => {
    container.querySelector("#fDocFile").value = "";
    container.querySelector("#fDocName").value = "";
    container.querySelectorAll("#docCatPicker .cat-chip").forEach((c, i) => c.classList.toggle("selected", i === 0));
    docSheet.classList.add("show");
  });
  container.querySelector("#btnCancelDoc").addEventListener("click", () => docSheet.classList.remove("show"));
  docSheet.addEventListener("click", (e) => { if (e.target === docSheet) docSheet.classList.remove("show"); });
  container.querySelector("#fDocFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (file && !container.querySelector("#fDocName").value) {
      container.querySelector("#fDocName").value = file.name.replace(/\.[^.]+$/, "");
    }
  });
  container.querySelectorAll("#docCatPicker .cat-chip").forEach((chip) => {
    chip.addEventListener("click", () => {
      container.querySelectorAll("#docCatPicker .cat-chip").forEach((c) => c.classList.remove("selected"));
      chip.classList.add("selected");
    });
  });
  container.querySelector("#btnSaveDoc").addEventListener("click", async (e) => {
    const file = container.querySelector("#fDocFile").files[0];
    if (!file) {
      alert("請先選擇檔案");
      return;
    }
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = "上傳中...";
    try {
      const fileUrl = await uploadFile(`trips/${tripId}/documents/${Date.now()}-${file.name}`, file);
      const category = container.querySelector("#docCatPicker .cat-chip.selected")?.dataset.cat || "其他";
      await createDocument(tripId, {
        fileUrl,
        fileType: file.type === "application/pdf" ? "pdf" : "image",
        displayName: container.querySelector("#fDocName").value.trim() || file.name,
        category,
        fileSizeBytes: file.size,
        uploadedBy: memberId,
      });
      docSheet.classList.remove("show");
    } catch (err) {
      console.error("[上傳憑證失敗]", err);
      alert(
        "上傳失敗：" + (err.message || err.code || "未知錯誤") +
        (err.code === "storage/unauthorized"
          ? "\n\n這代表 Firebase Storage 的安全規則還沒開放上傳，請到 Firebase Console → Storage → Rules 調整規則。"
          : "")
      );
    } finally {
      btn.disabled = false;
      btn.textContent = "上傳";
    }
  });

  const docsListEl = container.querySelector("#docsList");
  const docPreviewOverlay = container.querySelector("#docPreviewOverlay");
  function openDocPreview(d) {
    container.querySelector("#docPreviewTitle").textContent = d.displayName;
    const body = container.querySelector("#docPreviewBody");
    if (d.fileType === "pdf") {
      body.innerHTML = `<iframe src="${d.fileUrl}" style="width:100%; height:60vh; border:none; border-radius:14px; background:var(--white);"></iframe>`;
    } else {
      body.innerHTML = `<img src="${d.fileUrl}" alt="${d.displayName}" style="max-width:100%; max-height:60vh; border-radius:14px; box-shadow:var(--shadow-md);">`;
    }
    container.querySelector("#btnOpenPreviewNewTab").href = d.fileUrl;
    docPreviewOverlay.classList.add("show");
  }
  container.querySelector("#btnClosePreview").addEventListener("click", () => docPreviewOverlay.classList.remove("show"));
  docPreviewOverlay.addEventListener("click", (e) => { if (e.target === docPreviewOverlay) docPreviewOverlay.classList.remove("show"); });

  cleanups.push(
    listenDocuments(tripId, (docs) => {
      docsListEl.innerHTML = docs
        .map(
          (d) => `
            <div class="doc-item" data-preview-id="${d.id}">
              <div class="doc-icon ${d.fileType}"><i class="fa-solid ${fileIcon(d.fileType)}"></i></div>
              <div class="doc-info"><div class="doc-name">${d.displayName}</div><div class="doc-sub">${formatBytes(d.fileSizeBytes)} · ${d.category || ""}</div></div>
              <i class="fa-solid fa-eye doc-download" data-preview-trigger="${d.id}" title="預覽"></i>
              <i class="fa-solid fa-trash doc-download" data-doc-id="${d.id}" style="margin-left:8px;" title="刪除"></i>
            </div>
          `
        )
        .join("") || `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">還沒有上傳任何憑證</p>`;

      docsListEl.querySelectorAll(".doc-item").forEach((row) => {
        row.addEventListener("click", (e) => {
          if (e.target.closest("[data-doc-id]")) return; // 刪除按鈕另外處理
          const d = docs.find((x) => x.id === row.dataset.previewId);
          openDocPreview(d);
        });
      });
      docsListEl.querySelectorAll("[data-doc-id]").forEach((btn) => {
        btn.addEventListener("click", async (e) => {
          e.stopPropagation();
          if (!confirm("確定要刪除這份憑證嗎？")) return;
          await deleteDocument(tripId, btn.dataset.docId);
        });
      });
    })
  );

  return () => cleanups.forEach((fn) => fn());
}

        <input type="date" class="text-input" id="fExpenseDate">

        <label class="field-label">項目名稱</label>
        <input type="text" class="text-input" id="fExpenseTitle" placeholder="例如：湯咖哩 GARAKU">

        <label class="field-label">類別</label>
        <div class="cat-picker" id="expenseCatPicker">
          ${Object.entries(EXPENSE_CATEGORY_META).map(([key, m]) => `<div class="cat-opt" data-cat="${key}"><i class="fa-solid ${m.icon}"></i>${m.label}</div>`).join("")}
        </div>

        <label class="field-label">誰付的錢</label>
        <div class="payer-row" id="payerRow"></div>

        <label class="field-label">分攤對象</label>
        <div class="split-row" id="expenseSplitRow"></div>
        <p class="split-note">預設全員均分，點選可取消排除</p>

        <div class="btn-row">
          <button class="btn btn-danger-outline" id="btnDeleteExpense" style="display:none;">刪除</button>
          <button class="btn btn-outline" id="btnCancelExpense">取消</button>
          <button class="btn btn-primary primary-weight" id="btnSaveExpense">儲存記帳</button>
        </div>
      </div>
    </div>

    <!-- 結算截圖預覽 -->
    <div class="sheet-overlay" id="shareOverlay">
      <div class="sheet" style="text-align:center;">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title">結算截圖預覽</h3>
        <div id="shareCard" style="background:var(--white); border-radius:20px; padding:20px; box-shadow:var(--shadow-md); text-align:left; margin-bottom:16px;"></div>
        <div class="btn-row">
          <button class="btn btn-outline" id="btnCloseShare">取消</button>
          <button class="btn btn-primary primary-weight" id="btnDownloadShare"><i class="fa-solid fa-download"></i> 儲存圖片</button>
        </div>
      </div>
    </div>

    <!-- 設定/修改個人 PIN -->
    <div class="sheet-overlay" id="personalPinSetSheetOverlay">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title" id="personalPinSetTitle">設定個人 PIN</h3>
        <p class="field-hint" style="margin-top:-10px;">設定 4 位數字，只有你自己用這組密碼查看自己的花費明細</p>
        <div class="pin-input-row">
          <input type="text" maxlength="1" inputmode="numeric" class="pin-digit" id="myPinDigit0">
          <input type="text" maxlength="1" inputmode="numeric" class="pin-digit" id="myPinDigit1">
          <input type="text" maxlength="1" inputmode="numeric" class="pin-digit" id="myPinDigit2">
          <input type="text" maxlength="1" inputmode="numeric" class="pin-digit" id="myPinDigit3">
        </div>
        <div class="btn-row">
          <button class="btn btn-outline" id="btnCancelMyPinSet">取消</button>
          <button class="btn btn-primary primary-weight" id="btnSaveMyPinSet">儲存</button>
        </div>
      </div>
    </div>

    <!-- 我的花費明細 -->
    <div class="sheet-overlay" id="myExpenseSheetOverlay">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <h3 class="sheet-title">我的花費明細</h3>
        <div class="mes-hero" id="myExpenseHero"></div>
        <div class="mes-cat-breakdown" id="myExpenseCategoryBreakdown"></div>
        <div class="my-expense-stats" id="myExpenseStats"></div>
        <div id="myExpenseList"></div>
        <p class="section-note">「我的份」是這筆帳依分攤對象平均下來，你自己要付的金額，跟是不是你付的錢無關</p>
        <div class="btn-row">
          <button class="btn btn-outline" id="btnChangeMyPin">變更 PIN</button>
          <button class="btn btn-primary primary-weight" id="btnCloseMyExpense">關閉</button>
        </div>
      </div>
    </div>
  `;
}

export function mountExpenseView(container, ctx) {
  const { tripId, memberId, trip, members } = ctx;
  const cleanups = [];
  let expenses = [];
  let enabledCurrencies = [...(trip.currencies?.enabled || [])];
  let ratesAreLive = false;

  // 一進分頁就先抓一次即時匯率，抓到之前先用內建保底值頂著。
  fetchExchangeRates().then((rates) => {
    liveRates = rates;
    ratesAreLive = true;
  });

  const memberById = (id) => members.find((m) => m.id === id);

  /* ---------- 子分頁切換 ---------- */
  container.querySelectorAll(".subtab").forEach((tab) => {
    tab.addEventListener("click", () => {
      container.querySelectorAll(".subtab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      container.querySelectorAll(".booking-panel").forEach((p) => p.classList.remove("active"));
      container.querySelector(`#panel-${tab.dataset.tab}`).classList.add("active");
    });
  });

  /* ---------- 明細渲染 ---------- */
  function renderDashboardAndList() {
    const totalTWD = expenses.reduce((s, e) => s + (e.amountTWD || 0), 0);
    const foreignTotals = {};
    expenses.forEach((e) => {
      if (e.currency && e.currency !== "TWD") {
        foreignTotals[e.currency] = (foreignTotals[e.currency] || 0) + (e.amount || 0);
      }
    });

    const dashCard = container.querySelector("#dashCard");
    dashCard.innerHTML = `
      <div class="dash-total-label">總支出（台幣）</div>
      <div class="dash-total">NT$ ${totalTWD.toLocaleString()}</div>
      <div class="dash-fx-row">
        ${Object.entries(foreignTotals).map(([cur, amt]) => `<div class="dash-fx-chip">${CURRENCY_CATALOG[cur]?.split(" ")[0] || ""} ${amt.toLocaleString()} ${cur}</div>`).join("")}
        <div class="dash-fx-chip">匯率參考即時資料（Frankfurter）</div>
      </div>
      <div class="dash-per-person">
        ${members.map((m) => {
          const paid = expenses.filter((e) => e.paidBy === m.id).reduce((s, e) => s + (e.amountTWD || 0), 0);
          return `<div class="dpp-item"><div class="dpp-name">${avatarInlinePrefix(m)}${m.name}</div><div class="dpp-val">NT$ ${paid.toLocaleString()}</div></div>`;
        }).join("")}
      </div>
    `;

    const listEl = container.querySelector("#expenseList");
    const sorted = [...expenses].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const groups = {};
    sorted.forEach((e) => {
      (groups[e.date || "未填日期"] = groups[e.date || "未填日期"] || []).push(e);
    });

    listEl.innerHTML = Object.entries(groups)
      .map(([date, items]) => {
        const rows = items
          .map((e) => {
            const meta = EXPENSE_CATEGORY_META[e.category] || EXPENSE_CATEGORY_META.other;
            const payer = memberById(e.paidBy);
            const splitLabel =
              e.splitAmong?.length === 1 && e.splitAmong[0] === e.paidBy
                ? "只算他自己"
                : `${e.splitAmong?.length || 0}人分攤`;
            return `
              <div class="exp-item" data-expense-id="${e.id}">
                <div class="exp-icon" style="background:var(${meta.cssVar});"><i class="fa-solid ${meta.icon}"></i></div>
                <div class="exp-info"><div class="exp-title">${e.title || "（未命名）"}</div><div class="exp-sub">${payer ? avatarInlinePrefix(payer) + payer.name : "？"} 付 · ${splitLabel}</div></div>
                <div class="exp-amount"><div class="ea-main">NT$ ${(e.amountTWD || 0).toLocaleString()}</div>${e.currency !== "TWD" ? `<div class="ea-sub">${e.amount?.toLocaleString()} ${e.currency}</div>` : ""}</div>
              </div>
            `;
          })
          .join("");
        return `<div class="day-group-label">${date}</div>${rows}`;
      })
      .join("") || `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">還沒有記帳資料</p>`;

    listEl.querySelectorAll(".exp-item").forEach((row) => {
      row.addEventListener("click", () => {
        const e = expenses.find((x) => x.id === row.dataset.expenseId);
        openEditExpense(e);
      });
    });
  }

  /* ---------- 新增/編輯記帳 sheet ---------- */
  const sheet = container.querySelector("#expenseSheetOverlay");
  const currencyRow = container.querySelector("#currencyRow");
  const currencyPicker = container.querySelector("#currencyPicker");
  const cpList = container.querySelector("#cpList");
  const amountNumEl = container.querySelector("#amountNum");
  const fxNoteEl = container.querySelector("#fxNote");
  const deleteBtn = container.querySelector("#btnDeleteExpense");

  let editingExpenseId = null;
  let amountStr = "0";
  let currentCurrency = "TWD";
  let selectedCategory = "food";
  let selectedPayer = memberId;

  function renderCurrencyChips() {
    currencyRow.querySelectorAll(".cur-chip:not(.locked):not(.add-chip)").forEach((el) => el.remove());
    const addBtn = container.querySelector("#btnAddCurrency");
    enabledCurrencies.forEach((code) => {
      const chip = document.createElement("div");
      chip.className = "cur-chip";
      chip.id = "cur" + code;
      chip.dataset.currency = code;
      chip.innerHTML = `${CURRENCY_CATALOG[code] || code}<span class="cur-remove" data-remove-currency="${code}">×</span>`;
      currencyRow.insertBefore(chip, addBtn);
    });
    currencyRow.querySelectorAll(".cur-chip[data-currency]").forEach((chip) => {
      chip.addEventListener("click", (e) => {
        if (e.target.closest(".cur-remove")) return;
        setCurrency(chip.dataset.currency);
      });
    });
    currencyRow.querySelectorAll("[data-remove-currency]").forEach((btn) => {
      btn.addEventListener("click", (e) => handleRemoveCurrencyTap(e, btn));
    });
    renderCurrencyPickerList();
  }
  function renderCurrencyPickerList() {
    cpList.innerHTML = Object.entries(CURRENCY_CATALOG)
      .filter(([code]) => !enabledCurrencies.includes(code))
      .map(([code, label]) => `<div class="cp-opt" data-add-currency="${code}">${label} ${code}</div>`)
      .join("");
    cpList.querySelectorAll("[data-add-currency]").forEach((opt) => {
      opt.addEventListener("click", async () => {
        const code = opt.dataset.addCurrency;
        enabledCurrencies.push(code);
        await updateTrip(tripId, { "currencies.enabled": enabledCurrencies });
        renderCurrencyChips();
      });
    });
  }
  const pendingRemove = {};
  function handleRemoveCurrencyTap(e, btn) {
    e.stopPropagation();
    const code = btn.dataset.removeCurrency;
    if (pendingRemove[code]) {
      clearTimeout(pendingRemove[code]);
      delete pendingRemove[code];
      removeCurrency(code);
      return;
    }
    btn.classList.add("confirming");
    btn.textContent = "確定?";
    pendingRemove[code] = setTimeout(() => {
      btn.classList.remove("confirming");
      btn.textContent = "×";
      delete pendingRemove[code];
    }, 2000);
  }
  async function removeCurrency(code) {
    enabledCurrencies = enabledCurrencies.filter((c) => c !== code);
    await updateTrip(tripId, { "currencies.enabled": enabledCurrencies });
    if (currentCurrency === code) setCurrency("TWD");
    renderCurrencyChips();
  }
  function setCurrency(code) {
    currentCurrency = code;
    currencyRow.querySelectorAll(".cur-chip").forEach((chip) => {
      if (chip.classList.contains("add-chip")) return;
      chip.classList.toggle("selected", (chip.dataset.currency || "TWD") === code);
    });
    renderAmount();
  }
  function renderAmount() {
    const prefix = currentCurrency === "TWD" ? "NT$ " : (CURRENCY_CATALOG[currentCurrency] || "").split(" ")[0] + " ";
    amountNumEl.textContent = prefix + Number(amountStr).toLocaleString();
    if (currentCurrency !== "TWD") {
      const rate = liveRates[currentCurrency] || 1;
      const twd = Math.round(Number(amountStr) / rate);
      fxNoteEl.style.display = "block";
      fxNoteEl.textContent = `≈ NT$ ${twd.toLocaleString()}（${ratesAreLive ? "即時匯率" : "估算匯率，讀取中或離線"}）`;
    } else {
      fxNoteEl.style.display = "none";
    }
  }
  container.querySelectorAll(".keypad .key").forEach((btn) => {
    btn.addEventListener("click", () => {
      const k = btn.dataset.key;
      if (k === "del") amountStr = amountStr.length > 1 ? amountStr.slice(0, -1) : "0";
      else {
        amountStr = amountStr === "0" ? k : amountStr + k;
        if (amountStr.length > 7) amountStr = amountStr.slice(0, 7);
      }
      renderAmount();
    });
  });
  container.querySelector("#btnAddCurrency").addEventListener("click", () => currencyPicker.classList.add("show"));
  container.querySelector("#btnCloseCurrencyPicker").addEventListener("click", () => currencyPicker.classList.remove("show"));

  function renderPayerAndSplitRows(splitAmongIds) {
    const payerRow = container.querySelector("#payerRow");
    payerRow.innerHTML = members
      .map((m) => `<div class="payer-opt ${m.id === selectedPayer ? "selected" : ""}" data-member-id="${m.id}"><div class="p-avatar" style="${avatarBoxStyle(m)}">${avatarBoxContent(m)}</div><div class="p-name">${m.name}</div></div>`)
      .join("");
    payerRow.querySelectorAll(".payer-opt").forEach((opt) => {
      opt.addEventListener("click", () => {
        selectedPayer = opt.dataset.memberId;
        payerRow.querySelectorAll(".payer-opt").forEach((o) => o.classList.remove("selected"));
        opt.classList.add("selected");
      });
    });

    const splitRow = container.querySelector("#expenseSplitRow");
    const checked = splitAmongIds || members.map((m) => m.id);
    splitRow.innerHTML = members
      .map((m) => `<div class="split-opt ${checked.includes(m.id) ? "selected" : ""}" data-member-id="${m.id}">${avatarInlinePrefix(m)}${m.name}</div>`)
      .join("");
    splitRow.querySelectorAll(".split-opt").forEach((opt) => {
      opt.addEventListener("click", () => opt.classList.toggle("selected"));
    });
  }
  function getSelectedSplit() {
    return [...container.querySelectorAll("#expenseSplitRow .split-opt.selected")].map((el) => el.dataset.memberId);
  }

  container.querySelectorAll("#expenseCatPicker .cat-opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      selectedCategory = opt.dataset.cat;
      container.querySelectorAll("#expenseCatPicker .cat-opt").forEach((o) => {
        o.classList.remove("selected");
        o.style.background = "";
        o.style.color = "";
      });
      opt.classList.add("selected");
      opt.style.background = `var(${EXPENSE_CATEGORY_META[selectedCategory].cssVar})`;
      opt.style.color = "var(--white)";
    });
  });

  function todayOrTripStart() {
    const today = localISODate(new Date());
    if (trip.startDate && trip.endDate && today >= trip.startDate && today <= trip.endDate) return today;
    return trip.startDate || today;
  }

  function openAddExpense() {
    editingExpenseId = null;
    amountStr = "0";
    currentCurrency = "TWD";
    selectedCategory = "food";
    selectedPayer = memberId;
    container.querySelector("#expenseSheetTitle").textContent = "新增記帳";
    deleteBtn.style.display = "none";
    container.querySelector("#fExpenseDate").value = todayOrTripStart();
    container.querySelector("#fExpenseTitle").value = "";
    renderCurrencyChips();
    setCurrency("TWD");
    container.querySelectorAll("#expenseCatPicker .cat-opt").forEach((o) => {
      o.classList.remove("selected");
      o.style.background = "";
      o.style.color = "";
    });
    const foodOpt = container.querySelector('#expenseCatPicker .cat-opt[data-cat="food"]');
    foodOpt.classList.add("selected");
    foodOpt.style.background = `var(${EXPENSE_CATEGORY_META.food.cssVar})`;
    foodOpt.style.color = "var(--white)";
    renderPayerAndSplitRows(null);
    sheet.classList.add("show");
  }
  function openEditExpense(e) {
    editingExpenseId = e.id;
    amountStr = String(e.amount || 0);
    currentCurrency = e.currency || "TWD";
    selectedCategory = e.category || "food";
    selectedPayer = e.paidBy;
    container.querySelector("#expenseSheetTitle").textContent = "編輯記帳";
    deleteBtn.style.display = "block";
    container.querySelector("#fExpenseDate").value = e.date || todayOrTripStart();
    container.querySelector("#fExpenseTitle").value = e.title || "";
    renderCurrencyChips();
    setCurrency(currentCurrency);
    container.querySelectorAll("#expenseCatPicker .cat-opt").forEach((o) => {
      o.classList.remove("selected");
      o.style.background = "";
      o.style.color = "";
    });
    const catOpt = container.querySelector(`#expenseCatPicker .cat-opt[data-cat="${selectedCategory}"]`);
    if (catOpt) {
      catOpt.classList.add("selected");
      catOpt.style.background = `var(${EXPENSE_CATEGORY_META[selectedCategory].cssVar})`;
      catOpt.style.color = "var(--white)";
    }
    renderPayerAndSplitRows(e.splitAmong);
    sheet.classList.add("show");
  }
  container.querySelector("#btnAddExpense").addEventListener("click", openAddExpense);
  container.querySelector("#btnCancelExpense").addEventListener("click", () => sheet.classList.remove("show"));
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.classList.remove("show"); });
  deleteBtn.addEventListener("click", async () => {
    if (!editingExpenseId) return;
    if (!confirm("確定要刪除這筆記帳嗎？")) return;
    await deleteExpense(tripId, editingExpenseId);
    sheet.classList.remove("show");
  });
  container.querySelector("#btnSaveExpense").addEventListener("click", async () => {
    const title = container.querySelector("#fExpenseTitle").value.trim();
    if (!title) {
      container.querySelector("#fExpenseTitle").focus();
      return;
    }
    const splitAmong = getSelectedSplit();
    if (!splitAmong.length) {
      alert("請至少選擇一位分攤對象");
      return;
    }
    const amount = Number(amountStr) || 0;
    const rate = currentCurrency === "TWD" ? null : liveRates[currentCurrency] || 1;
    const amountTWD = currentCurrency === "TWD" ? amount : Math.round(amount / rate);
    const payload = {
      title,
      category: selectedCategory,
      amount,
      currency: currentCurrency,
      estimatedRate: rate,
      amountTWD,
      paidBy: selectedPayer,
      splitAmong,
      date: container.querySelector("#fExpenseDate").value,
    };
    try {
      if (editingExpenseId) await updateExpense(tripId, editingExpenseId, payload);
      else await createExpense(tripId, payload);
      sheet.classList.remove("show");
    } catch (err) {
      console.error("[儲存記帳失敗]", err);
      alert("儲存失敗：" + (err.message || err.code || "未知錯誤"));
    }
  });

  /* ---------- 結算 ---------- */
  function computeSettlement() {
    const net = {};
    members.forEach((m) => (net[m.id] = 0));
    expenses.forEach((e) => {
      if (net[e.paidBy] !== undefined) net[e.paidBy] += e.amountTWD || 0;
      const share = (e.amountTWD || 0) / (e.splitAmong?.length || 1);
      (e.splitAmong || []).forEach((id) => {
        if (net[id] !== undefined) net[id] -= share;
      });
    });
    const creditors = [];
    const debtors = [];
    Object.entries(net).forEach(([id, val]) => {
      const rounded = Math.round(val);
      if (rounded > 0) creditors.push({ id, amount: rounded });
      else if (rounded < 0) debtors.push({ id, amount: -rounded });
    });
    creditors.sort((a, b) => b.amount - a.amount);
    debtors.sort((a, b) => b.amount - a.amount);
    const transactions = [];
    let ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length) {
      const c = creditors[ci];
      const d = debtors[di];
      const amt = Math.min(c.amount, d.amount);
      if (amt > 0) transactions.push({ from: d.id, to: c.id, amount: amt });
      c.amount -= amt;
      d.amount -= amt;
      if (c.amount === 0) ci++;
      if (d.amount === 0) di++;
    }
    return { net, transactions };
  }

  function renderSettlement() {
    const { net, transactions } = computeSettlement();
    const summaryEl = container.querySelector("#settleSummary");
    summaryEl.innerHTML = `
      <div class="settle-summary">
        ${members
          .map((m) => {
            const val = Math.round(net[m.id] || 0);
            const cls = val >= 0 ? "positive" : "negative";
            const sign = val >= 0 ? "+" : "-";
            const myPinBtn = m.id === memberId
              ? `<div class="sp-mypin-btn" data-mypin-trigger="1"><i class="fa-solid fa-lock"></i>我的明細</div>`
              : "";
            return `<div class="settle-person"><div class="sp-avatar" style="${avatarBoxStyle(m)}">${avatarBoxContent(m)}</div><div class="sp-name">${m.name}</div><div class="sp-val ${cls}">${sign}NT$ ${Math.abs(val).toLocaleString()}</div>${myPinBtn}</div>`;
          })
          .join("")}
      </div>
    `;
    const flowsEl = container.querySelector("#settleFlows");
    flowsEl.innerHTML =
      transactions
        .map((t) => {
          const from = memberById(t.from);
          const to = memberById(t.to);
          return `<div class="settle-flow"><div class="sf-avatar" style="${avatarBoxStyle(from)}">${avatarBoxContent(from)}</div><div class="sf-text">${from?.name || ""} 應付給 <b>${to?.name || ""}</b></div><span class="sf-amount">NT$ ${t.amount.toLocaleString()}</span></div>`;
        })
        .join("") || `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">目前帳務已經打平，不需要結算</p>`;

    const trigger = summaryEl.querySelector("[data-mypin-trigger]");
    if (trigger) trigger.addEventListener("click", handleMyExpenseTrigger);
  }

  /* ---------- 個人 PIN 查看花費明細 ---------- */
  const me = () => memberById(memberId);

  function handleMyExpenseTrigger() {
    const meMember = me();
    if (!meMember) return;
    if (!meMember.personalPinHash) {
      openPersonalPinSetSheet({ isFirstTime: true });
      return;
    }
    openPinVerify({
      title: "輸入你的個人 PIN",
      subtitle: "查看你的花費明細",
      checkPin: async (value) => (await hashPin(value)) === meMember.personalPinHash,
      onSuccess: () => openMyExpenseSheet(),
      onForgot: () => handleForgotPersonalPin(),
      forgotLabel: "忘記密碼？用旅程共用 PIN 重置",
    });
  }

  function handleForgotPersonalPin() {
    const tripPinHash = trip.security?.bookingsPinHash;
    if (!tripPinHash) {
      alert("這趟旅程還沒有設定共用 PIN，請請主揪先到旅程設定頁設定共用 PIN，才能用它來重置你的個人 PIN。");
      return;
    }
    openPinVerify({
      title: "輸入旅程共用 PIN",
      subtitle: "驗證通過後可以重新設定你的個人 PIN",
      checkPin: async (value) => (await hashPin(value)) === tripPinHash,
      onSuccess: () => openPersonalPinSetSheet({ isFirstTime: false }),
    });
  }

  const personalPinSheet = container.querySelector("#personalPinSetSheetOverlay");
  const myPinDigits = [0, 1, 2, 3].map((i) => container.querySelector(`#myPinDigit${i}`));
  myPinDigits.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      if (input.value && i < 3) myPinDigits[i + 1].focus();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && i > 0) myPinDigits[i - 1].focus();
    });
  });
  function openPersonalPinSetSheet({ isFirstTime }) {
    myPinDigits.forEach((d) => (d.value = ""));
    container.querySelector("#personalPinSetTitle").textContent = isFirstTime ? "設定個人 PIN" : "重新設定個人 PIN";
    personalPinSheet.classList.add("show");
    myPinDigits[0].focus();
  }
  container.querySelector("#btnCancelMyPinSet").addEventListener("click", () => personalPinSheet.classList.remove("show"));
  personalPinSheet.addEventListener("click", (e) => { if (e.target === personalPinSheet) personalPinSheet.classList.remove("show"); });
  container.querySelector("#btnSaveMyPinSet").addEventListener("click", async () => {
    const pin = myPinDigits.map((d) => d.value).join("");
    if (pin.length !== 4) {
      alert("請輸入完整 4 位數字");
      return;
    }
    const pinHash = await hashPin(pin);
    await updateMember(tripId, memberId, { personalPinHash: pinHash });
    const meMember = me();
    if (meMember) meMember.personalPinHash = pinHash; // 本地先同步一份，畫面才不會等 Firestore 回推才更新
    personalPinSheet.classList.remove("show");
    openMyExpenseSheet();
  });

  const myExpenseSheet = container.querySelector("#myExpenseSheetOverlay");
  function openMyExpenseSheet() {
    const meMember = me();
    const myExpenses = expenses.filter((e) => e.paidBy === memberId || (e.splitAmong || []).includes(memberId));
    const totalPaid = expenses.filter((e) => e.paidBy === memberId).reduce((s, e) => s + (e.amountTWD || 0), 0);
    const totalShare = myExpenses.reduce((s, e) => {
      if (!(e.splitAmong || []).includes(memberId)) return s;
      return s + (e.amountTWD || 0) / (e.splitAmong?.length || 1);
    }, 0);
    const net = Math.round(totalPaid - totalShare);
    const netCls = net >= 0 ? "positive" : "negative";
    const netSign = net >= 0 ? "+" : "-";

    // 「屬於個人」的總花費＝我的分攤總額（跟是不是我付的錢無關，是這趟旅程真正該算在我頭上的成本）
    container.querySelector("#myExpenseHero").innerHTML = `
      <div class="mes-hero-label">這趟旅程屬於你個人的總花費</div>
      <div class="mes-hero-val">NT$ ${Math.round(totalShare).toLocaleString()}</div>
      <div class="mes-hero-sub">依每筆帳的分攤對象平均下來，算在你頭上的金額</div>
    `;

    // 類別占比：只算「我的份」，不是整筆帳的金額，才會是真的屬於個人的占比
    const categoryTotals = {};
    myExpenses.forEach((e) => {
      if (!(e.splitAmong || []).includes(memberId)) return;
      const myShare = (e.amountTWD || 0) / (e.splitAmong?.length || 1);
      const cat = e.category && EXPENSE_CATEGORY_META[e.category] ? e.category : "other";
      categoryTotals[cat] = (categoryTotals[cat] || 0) + myShare;
    });
    const catRows = Object.entries(categoryTotals)
      .sort((a, b) => b[1] - a[1])
      .map(([cat, amt]) => {
        const meta = EXPENSE_CATEGORY_META[cat] || EXPENSE_CATEGORY_META.other;
        const pct = totalShare > 0 ? Math.round((amt / totalShare) * 100) : 0;
        return `
          <div class="mcb-row">
            <div class="mcb-row-top">
              <div class="mcb-row-label"><i class="fa-solid ${meta.icon}" style="color:var(${meta.cssVar});"></i>${meta.label}</div>
              <div class="mcb-row-amt">NT$ ${Math.round(amt).toLocaleString()} · ${pct}%</div>
            </div>
            <div class="mcb-bar-track"><div class="mcb-bar-fill" style="width:${pct}%;background:var(${meta.cssVar});"></div></div>
          </div>
        `;
      })
      .join("");
    container.querySelector("#myExpenseCategoryBreakdown").innerHTML = catRows
      ? `<div class="mcb-title">類別占比（屬於個人的部分）</div>${catRows}`
      : "";

    container.querySelector("#myExpenseStats").innerHTML = `
      <div class="mes-item"><div class="mes-label">我付了</div><div class="mes-val">NT$ ${Math.round(totalPaid).toLocaleString()}</div></div>
      <div class="mes-item"><div class="mes-label">淨額</div><div class="mes-val ${netCls}">${netSign}NT$ ${Math.abs(net).toLocaleString()}</div></div>
    `;

    const sorted = [...myExpenses].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    const groups = {};
    sorted.forEach((e) => {
      (groups[e.date || "未填日期"] = groups[e.date || "未填日期"] || []).push(e);
    });
    container.querySelector("#myExpenseList").innerHTML = Object.entries(groups)
      .map(([date, items]) => {
        const rows = items
          .map((e) => {
            const meta = EXPENSE_CATEGORY_META[e.category] || EXPENSE_CATEGORY_META.other;
            const payer = memberById(e.paidBy);
            const isPayer = e.paidBy === memberId;
            const myShare = (e.splitAmong || []).includes(memberId) ? (e.amountTWD || 0) / (e.splitAmong?.length || 1) : 0;
            return `
              <div class="exp-item ${isPayer ? "is-mine" : ""}">
                <div class="exp-icon" style="background:var(${meta.cssVar});"><i class="fa-solid ${meta.icon}"></i></div>
                <div class="exp-info">
                  <div class="exp-title">${e.title || "（未命名）"}</div>
                  <div class="exp-sub">${payer ? avatarInlinePrefix(payer) + payer.name : "？"} 付${isPayer ? "（你自己）" : ""}</div>
                  ${myShare > 0 ? `<div class="exp-share-tag">我的份：NT$ ${Math.round(myShare).toLocaleString()}</div>` : `<div class="exp-share-tag">不在你的分攤範圍內</div>`}
                </div>
                <div class="exp-amount"><div class="ea-main">NT$ ${(e.amountTWD || 0).toLocaleString()}</div></div>
              </div>
            `;
          })
          .join("");
        return `<div class="day-group-label">${date}</div>${rows}`;
      })
      .join("") || `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">你目前沒有相關的記帳紀錄</p>`;

    myExpenseSheet.classList.add("show");
  }
  container.querySelector("#btnCloseMyExpense").addEventListener("click", () => myExpenseSheet.classList.remove("show"));
  myExpenseSheet.addEventListener("click", (e) => { if (e.target === myExpenseSheet) myExpenseSheet.classList.remove("show"); });
  container.querySelector("#btnChangeMyPin").addEventListener("click", () => {
    myExpenseSheet.classList.remove("show");
    // 變更 PIN 也走「先驗證旅程共用 PIN」這條路，跟忘記密碼共用同一個安全門檻
    handleForgotPersonalPin();
  });

  const shareOverlay = container.querySelector("#shareOverlay");
  container.querySelector("#btnShareSettle").addEventListener("click", () => {
    const { transactions } = computeSettlement();
    const card = container.querySelector("#shareCard");
    card.innerHTML = `
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:4px;">
        <span style="font-size:18px;">${trip.coverType === "photo" ? "🏝️" : trip.coverValue}</span>
        <span style="font-weight:500; font-size:14px;">${trip.name} · 結算</span>
      </div>
      <div style="font-size:10.5px; color:var(--ink-soft); margin-bottom:14px;">${trip.startDate} - ${trip.endDate}</div>
      <div style="border-top:1px dashed var(--sage-light); padding-top:12px;">
        ${transactions
          .map((t) => {
            const from = memberById(t.from);
            const to = memberById(t.to);
            return `<div style="display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12.5px;"><span>${avatarInlinePrefix(from)}${from?.name || ""}</span><span style="color:var(--sage-dark);">→</span><span>${avatarInlinePrefix(to)}${to?.name || ""}</span><span style="margin-left:auto; font-family:var(--font-heading); font-weight:700; color:var(--earth-dark);">NT$ ${t.amount.toLocaleString()}</span></div>`;
          })
          .join("") || `<p style="font-size:12px;color:var(--ink-soft);">帳務已打平</p>`}
      </div>
      <div style="font-size:9.5px; color:var(--ink-soft); text-align:right; margin-top:12px;">由 Send Trip Pay App 產生</div>
    `;
    shareOverlay.classList.add("show");
  });
  container.querySelector("#btnCloseShare").addEventListener("click", () => shareOverlay.classList.remove("show"));
  shareOverlay.addEventListener("click", (e) => { if (e.target === shareOverlay) shareOverlay.classList.remove("show"); });
  container.querySelector("#btnDownloadShare").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    if (!window.html2canvas) {
      alert("截圖套件載入失敗，請確認網路連線正常後重新整理再試一次。");
      return;
    }
    const card = container.querySelector("#shareCard");
    btn.disabled = true;
    btn.textContent = "產生圖片中...";
    try {
      const canvas = await window.html2canvas(card, { backgroundColor: "#FFFDF8", scale: 2 });
      const link = document.createElement("a");
      link.download = `${trip.name}-結算.png`;
      link.href = canvas.toDataURL("image/png");
      link.click();
    } catch (err) {
      console.error("[結算截圖失敗]", err);
      alert("產生圖片失敗，你可以先用手機/電腦的螢幕截圖功能存下這張卡片。");
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-download"></i> 儲存圖片`;
    }
  });

  /* ---------- 即時監聽 ---------- */
  const unsubscribe = listenExpenses(
    tripId,
    (data) => {
      expenses = data;
      renderDashboardAndList();
      renderSettlement();
    },
    (error) => {
      container.querySelector("#expenseList").innerHTML = `
        <div style="background:var(--warn-bg); border:2px solid var(--warn); border-radius:16px; padding:14px; font-size:12.5px; color:var(--ink);">
          <b>記帳讀取失敗</b><br>
          最常見原因：Firestore 這個查詢需要建立索引。請按 F12 打開瀏覽器 Console，
          找到紅色錯誤訊息裡的連結，點下去建立索引，再重新整理頁面。<br>
          <span style="color:var(--ink-soft);">錯誤代碼：${error.code || "unknown"}</span>
        </div>
      `;
    }
  );
  cleanups.push(unsubscribe);

  return () => cleanups.forEach((fn) => fn());
}

    <div class="sheet-overlay" id="postSheetOverlay">

        <h3 class="sheet-title" id="postSheetTitle">新增日誌</h3>

        <div class="auto-chip-row">
          <div class="auto-chip" id="authorChip"></div>
          <div class="auto-chip" id="dateChip"><i class="fa-solid fa-calendar"></i><span id="dateChipText"></span><i class="fa-solid fa-pen" style="font-size:9px; margin-left:4px; opacity:0.6;"></i></div>
        </div>
        <div id="dateEditRow" style="display:none; justify-content:center; margin:-10px 0 16px;">
