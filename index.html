export function mountJournalView(container, ctx) {
  const { tripId, memberId, trip, members } = ctx;
  const cleanups = [];
  const memberById = (id) => members.find((m) => m.id === id);
  const me = memberById(memberId);

  const feedEl = container.querySelector("#journalFeed");
  const sheet = container.querySelector("#postSheetOverlay");
  const dateChipText = container.querySelector("#dateChipText");
  const dateEditRow = container.querySelector("#dateEditRow");
  const dateEditInput = container.querySelector("#dateEditInput");
  const photoInput = container.querySelector("#postPhotoInput");
  const photoPreview = container.querySelector("#postPhotoPreview");
  const captionInput = container.querySelector("#postCaption");
  const deleteBtn = container.querySelector("#btnDeletePost");

  let editingPostId = null;
  let existingPhotoUrls = []; // 編輯時已存在、使用者沒動過的照片
  let selectedNewFiles = [];  // 這次新選的檔案（尚未上傳）
  let currentDate = "";

  function dayLabel(dateStr) {
    if (!dateStr || !trip.startDate) return dateStr || "";
    const idx = Math.round((new Date(dateStr) - new Date(trip.startDate)) / 86400000) + 1;
    return idx >= 1 ? `${dateStr} · Day ${idx}` : dateStr;
  }
  function todayOrTripStart() {
    const today = localISODate(new Date());
    if (trip.startDate && trip.endDate && today >= trip.startDate && today <= trip.endDate) return today;
    return trip.startDate || today;
  }

  function photosGridClass(n) {
    if (n <= 1) return "n1";
    if (n === 2) return "n2";
    if (n === 3) return "n3";
    return "n4";
  }

  function renderFeed(posts) {
    const sorted = [...posts].sort((a, b) => {
      if (a.date !== b.date) return (b.date || "").localeCompare(a.date || "");
      const at = a.createdAt?.seconds || 0;
      const bt = b.createdAt?.seconds || 0;
      return bt - at;
    });

    let lastDate = null;
    const parts = [];
    sorted.forEach((p) => {
      if (p.date !== lastDate) {
        parts.push(`<div class="day-group-label"><i class="fa-solid fa-camera-retro"></i> ${dayLabel(p.date)}</div>`);
        lastDate = p.date;
      }
      const author = memberById(p.authorId);
      const time = p.createdAt?.seconds ? new Date(p.createdAt.seconds * 1000).toTimeString().slice(0, 5) : "";
      const photos = p.photoUrls || [];
      const gridClass = photosGridClass(photos.length);
      const shown = photos.slice(0, gridClass === "n3" ? 3 : gridClass === "n4" ? 4 : photos.length);
      const extra = photos.length - shown.length;

      const photosHtml = photos.length
        ? `<div class="post-photos ${gridClass}">
            ${shown
              .map((url, i) => {
                const isLast = i === shown.length - 1 && extra > 0;
                return `<div class="ph ${gridClass === "n3" && i === 0 ? "ph-0" : ""} ${isLast ? "more-overlay" : ""}" ${isLast ? `data-more="+${extra}"` : ""} data-photo-index="${i}" style="background-image:url('${url}');background-size:cover;background-position:center;"></div>`;
              })
              .join("")}
          </div>`
        : "";

      parts.push(`
        <div class="post-card" data-post-id="${p.id}">
          <div class="post-head">
            <div class="post-avatar" style="${avatarBoxStyle(author)}">${avatarBoxContent(author)}</div>
            <div><div class="post-author">${author?.name || "（已離開的成員）"}</div><div class="post-time">${time}</div></div>
          </div>
          ${photosHtml}
          ${p.caption ? `<div class="post-caption" style="${photos.length ? "" : "padding-top:0;"}">${p.caption}</div>` : ""}
        </div>
      `);
    });

    feedEl.innerHTML = parts.join("") || `<p style="text-align:center;color:var(--ink-soft);padding:30px 0;font-size:13px;">還沒有人寫日誌，第一篇讓你來吧</p>`;

    feedEl.querySelectorAll(".post-card").forEach((card) => {
      card.addEventListener("click", () => {
        const p = posts.find((x) => x.id === card.dataset.postId);
        if (p.authorId !== memberId) {
          alert("只能編輯自己發布的日誌");
          return;
        }
        openEditPost(p);
      });
      card.querySelectorAll(".ph[data-photo-index]").forEach((tile) => {
        tile.addEventListener("click", (e) => {
          e.stopPropagation();
          const p = posts.find((x) => x.id === card.dataset.postId);
          openLightbox(p.photoUrls || [], Number(tile.dataset.photoIndex));
        });
      });
    });
  }

  function renderPhotoPreviewGrid() {
    const existingItems = existingPhotoUrls.map((url, i) => ({ type: "existing", url, index: i }));
    const newItems = selectedNewFiles.map((file, i) => ({ type: "new", file, index: i, objectUrl: URL.createObjectURL(file) }));
    const all = [...existingItems, ...newItems];

    photoPreview.innerHTML = all
      .map(
        (item) => `
          <div class="photo-slot" data-type="${item.type}" data-index="${item.index}">
            <div class="ph-fill" style="background-image:url('${item.type === "existing" ? item.url : item.objectUrl}');background-size:cover;background-position:center;"></div>
            <div class="photo-remove"><i class="fa-solid fa-xmark"></i></div>
          </div>
        `
      )
      .join("");

    photoPreview.querySelectorAll(".photo-slot").forEach((slot, idx) => {
      slot.querySelector(".ph-fill").addEventListener("click", () => {
        const urls = all.map((item) => (item.type === "existing" ? item.url : item.objectUrl));
        openLightbox(urls, idx);
      });
      slot.querySelector(".photo-remove").addEventListener("click", () => {
        const type = slot.dataset.type;
        const idx2 = Number(slot.dataset.index);
        if (type === "existing") existingPhotoUrls.splice(idx2, 1);
        else selectedNewFiles.splice(idx2, 1);
        renderPhotoPreviewGrid();
      });
    });
  }

  photoInput.addEventListener("change", () => {
    selectedNewFiles = selectedNewFiles.concat(Array.from(photoInput.files));
    photoInput.value = "";
    renderPhotoPreviewGrid();
  });

  function openDateEdit() {
    dateEditInput.value = currentDate;
    dateEditRow.style.display = "flex";
  }
  container.querySelector("#dateChip").addEventListener("click", openDateEdit);
  dateEditInput.addEventListener("change", () => {
    currentDate = dateEditInput.value;
    dateChipText.textContent = dayLabel(currentDate) + "（已更新，儲存後生效）";
    dateEditRow.style.display = "none";
  });

  function openAddPost() {
    editingPostId = null;
    existingPhotoUrls = [];
    selectedNewFiles = [];
    currentDate = todayOrTripStart();
    container.querySelector("#postSheetTitle").textContent = "新增日誌";
    deleteBtn.style.display = "none";
    container.querySelector("#authorChip").innerHTML = `<i class="fa-solid fa-user"></i>${avatarInlinePrefix(me)}${me?.name || ""}`;
    dateChipText.textContent = dayLabel(currentDate);
    dateEditRow.style.display = "none";
    captionInput.value = "";
    renderPhotoPreviewGrid();
    sheet.classList.add("show");
  }
  function openEditPost(p) {
    editingPostId = p.id;
    existingPhotoUrls = [...(p.photoUrls || [])];
    selectedNewFiles = [];
    currentDate = p.date;
    container.querySelector("#postSheetTitle").textContent = "編輯日誌";
    deleteBtn.style.display = "block";
    const author = memberById(p.authorId);
    container.querySelector("#authorChip").innerHTML = `<i class="fa-solid fa-user"></i>${avatarInlinePrefix(author)}${author?.name || ""}`;
    dateChipText.textContent = dayLabel(currentDate);
    dateEditRow.style.display = "none";
    captionInput.value = p.caption || "";
    renderPhotoPreviewGrid();
    sheet.classList.add("show");
  }
  container.querySelector("#btnAddPost").addEventListener("click", openAddPost);
  container.querySelector("#btnCancelPost").addEventListener("click", () => sheet.classList.remove("show"));
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.classList.remove("show"); });
  deleteBtn.addEventListener("click", async () => {
    if (!editingPostId) return;
    if (!confirm("確定要刪除這篇日誌嗎？")) return;
    await deleteJournalPost(tripId, editingPostId);
    sheet.classList.remove("show");
  });

  container.querySelector("#btnSavePost").addEventListener("click", async (e) => {
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = selectedNewFiles.length ? "上傳中..." : "發布中...";
    try {
      const uploadedUrls = [];
      for (const file of selectedNewFiles) {
        const url = await uploadFile(`trips/${tripId}/journal/${Date.now()}-${file.name}`, file);
        uploadedUrls.push(url);
      }
      const photoUrls = [...existingPhotoUrls, ...uploadedUrls];
      const payload = {
        date: currentDate,
        caption: captionInput.value.trim(),
        photoUrls,
      };
      if (editingPostId) {
        await updateJournalPost(tripId, editingPostId, payload);
      } else {
        await createJournalPost(tripId, { ...payload, authorId: memberId });
      }
      sheet.classList.remove("show");
    } catch (err) {
      console.error("[儲存日誌失敗]", err);
      alert("儲存失敗：" + (err.message || err.code || "未知錯誤"));
    } finally {
      btn.disabled = false;
      btn.textContent = "發布";
    }
  });

  const unsubscribe = listenJournalPosts(
    tripId,
    (posts) => renderFeed(posts),
    (error) => {
      feedEl.innerHTML = `
        <div style="background:var(--warn-bg); border:2px solid var(--warn); border-radius:16px; padding:14px; font-size:12.5px; color:var(--ink);">
          <b>日誌讀取失敗</b><br>
          最常見原因：Firestore 這個查詢需要建立索引。請按 F12 打開瀏覽器 Console，
          找到紅色錯誤訊息裡的連結，點下去建立索引，再重新整理頁面。<br>
          <span style="color:var(--ink-soft);">錯誤代碼：${error.code || "unknown"}</span>
        </div>
      `;
    }
  );
  cleanups.push(unsubscribe);

  return () => cleanups.forEach((fn) => fn());
}
// views/planning.js
// 準備分頁：待辦／行李／想去／購物 四個大分類 + 成員篩選 tab。
// 核心邏輯：指派給「全體」時，是把當下所有成員的 id 寫進 assigneeIds（寫死的快照，

const TYPE_META = {
  todo: { label: "待辦", icon: "fa-list-check" },
  packing: { label: "行李", icon: "fa-suitcase" },
  wishlist: { label: "想去", icon: "fa-heart" },
  shopping: { label: "購物", icon: "fa-cart-shopping" },
};

export function renderPlanningView() {
  return `
    <div class="planning-view">
      <div class="cat-tabs" id="planCatTabs">

export function mountPlanningView(container, ctx) {
  const { tripId, memberId, trip, members } = ctx;
  const cleanups = [];
  const memberById = (id) => members.find((m) => m.id === id);

  let allItems = [];
  let activeType = "todo";
  let activePerson = "all";
  let editingItemId = null;
  let selectedAssignees = []; // 目前挑選中的指派對象 id 陣列（單一情境：全體 或 一人）
  let existingPhotoUrls = [];
  let selectedNewFiles = [];

  /* ---------- Tabs ---------- */
  container.querySelectorAll("#planCatTabs .cat-tab").forEach((tab) => {
    tab.addEventListener("click", () => {
      activeType = tab.dataset.type;
      container.querySelectorAll("#planCatTabs .cat-tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      renderList();
    });
  });

  const personTabsEl = container.querySelector("#planPersonTabs");
  function renderPersonTabs() {
    personTabsEl.innerHTML =
      `<div class="person-tab ${activePerson === "all" ? "active" : ""}" data-person="all"><i class="fa-solid fa-users"></i>全部</div>` +
      members
        .map((m) => `<div class="person-tab ${activePerson === m.id ? "active" : ""}" data-person="${m.id}"><div class="pt-avatar" style="${avatarBoxStyle(m)}">${avatarBoxContent(m)}</div>${m.name}</div>`)
        .join("");
    personTabsEl.querySelectorAll(".person-tab").forEach((tab) => {
      tab.addEventListener("click", () => {
        activePerson = tab.dataset.person;
        personTabsEl.querySelectorAll(".person-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        renderList();
      });
    });
  }

  /* ---------- 列表渲染 ---------- */
  const listEl = container.querySelector("#planItemList");
  function renderList() {
    const items = allItems.filter((it) => it.type === activeType && (activePerson === "all" || (it.assigneeIds || []).includes(activePerson)));

    if (!items.length) {
      listEl.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">這裡還沒有項目</p>`;
      return;
    }

    listEl.innerHTML = items
      .map((it) => {
        const assigneeNames = (it.assigneeIds || []).map((id) => memberById(id)?.name).filter(Boolean);
        const total = it.assigneeIds?.length || 0;
        const doneCount = (it.completedBy || []).length;
        const complete = total > 0 && doneCount === total;
        const hasExtra = !!(it.content || (it.photoUrls && it.photoUrls.length));
        return `
          <div class="item-card" data-item-id="${it.id}">
            <div class="ic-tags">${assigneeNames.map((n) => `<span class="ic-tag">${n}</span>`).join("")}</div>
            <div class="ic-main" data-open-detail="${it.id}">
              <div class="ic-counter ${complete ? "complete" : ""}">${doneCount}/${total}</div>
              <div class="ic-title">${it.title || "（未命名）"} ${hasExtra ? `<i class="fa-solid ${it.photoUrls?.length ? "fa-image" : "fa-note-sticky"} ic-more-icon" title="有更多內容"></i>` : ""}</div>
            </div>
            <div class="ic-people">
              ${(it.assigneeIds || [])
                .map((id) => {
                  const m = memberById(id);
                  const done = (it.completedBy || []).includes(id);
                  return `<div class="ic-person-chip ${done ? "done" : ""} ${id === memberId ? "me" : ""}" data-item-id="${it.id}" data-member-id="${id}">${done ? '<i class="fa-solid fa-check"></i>' : ""}${m?.name || "?"}</div>`;
                })
                .join("")}
            </div>
          </div>
        `;
      })
      .join("");

    listEl.querySelectorAll("[data-open-detail]").forEach((el) => {
      el.addEventListener("click", () => {
        const it = allItems.find((x) => x.id === el.dataset.openDetail);
        openEditSheet(it);
      });
    });
    listEl.querySelectorAll(".ic-person-chip").forEach((chip) => {
      chip.addEventListener("click", async () => {
        const chipMemberId = chip.dataset.memberId;
        if (chipMemberId !== memberId) {
          alert("只能標記自己的完成狀態");
          return;
        }
        const it = allItems.find((x) => x.id === chip.dataset.itemId);
        const currentlyDone = (it.completedBy || []).includes(memberId);
        await togglePlanningCompletion(tripId, it.id, memberId, !currentlyDone);
      });
    });
  }

  /* ---------- 指派對象選擇器 ---------- */
  const assigneeChip = container.querySelector("#planAssigneeChip");
  const assigneeChipText = container.querySelector("#planAssigneeChipText");
  const assigneePicker = container.querySelector("#planAssigneePicker");

  function assigneesToLabel(ids) {
    if (ids.length === members.length) return "全體";
    return ids.map((id) => memberById(id)?.name).filter(Boolean).join("、") || "（尚未選擇）";
  }
  function renderAssigneePicker() {
    assigneePicker.innerHTML =
      `<div class="assignee-opt ${selectedAssignees.length === members.length ? "selected" : ""}" data-assignee="all"><i class="fa-solid fa-users"></i>全體</div>` +
      members
        .map((m) => `<div class="assignee-opt ${selectedAssignees.length === 1 && selectedAssignees[0] === m.id ? "selected" : ""}" data-assignee="${m.id}">${avatarInlinePrefix(m)}${m.name}</div>`)
        .join("");
    assigneePicker.querySelectorAll(".assignee-opt").forEach((opt) => {
      opt.addEventListener("click", () => {
        selectedAssignees = opt.dataset.assignee === "all" ? members.map((m) => m.id) : [opt.dataset.assignee];
        assigneeChipText.textContent = assigneesToLabel(selectedAssignees);
        renderAssigneePicker();
        assigneePicker.style.display = "none";
      });
    });
  }
  assigneeChip.addEventListener("click", () => {
    assigneePicker.style.display = assigneePicker.style.display === "none" ? "flex" : "none";
  });

  /* ---------- 照片 ---------- */
  const photoInput = container.querySelector("#planPhotoInput");
  const photoPreview = container.querySelector("#planPhotoPreview");
  function renderPhotoPreview() {
    const existingItems = existingPhotoUrls.map((url, i) => ({ type: "existing", url, index: i }));
    const newItems = selectedNewFiles.map((file, i) => ({ type: "new", file, index: i, objectUrl: URL.createObjectURL(file) }));
    photoPreview.innerHTML = [...existingItems, ...newItems]
      .map(
        (item) => `
          <div class="photo-slot" data-type="${item.type}" data-index="${item.index}">
            <div class="ph-fill" style="background-image:url('${item.type === "existing" ? item.url : item.objectUrl}');background-size:cover;background-position:center;"></div>
            <div class="photo-remove"><i class="fa-solid fa-xmark"></i></div>
          </div>
        `
      )
      .join("");
    const combined = [...existingItems, ...newItems];
    photoPreview.querySelectorAll(".photo-slot").forEach((slot, idx) => {
      slot.querySelector(".ph-fill").addEventListener("click", () => {
        const urls = combined.map((item) => (item.type === "existing" ? item.url : item.objectUrl));
        openLightbox(urls, idx);
      });
      slot.querySelector(".photo-remove").addEventListener("click", () => {
        const type = slot.dataset.type;
        const idx2 = Number(slot.dataset.index);
        if (type === "existing") existingPhotoUrls.splice(idx2, 1);
        else selectedNewFiles.splice(idx2, 1);
        renderPhotoPreview();
      });
    });
  }
  photoInput.addEventListener("change", () => {
    selectedNewFiles = selectedNewFiles.concat(Array.from(photoInput.files));
    photoInput.value = "";
    renderPhotoPreview();
  });

  /* ---------- 新增/編輯 sheet ---------- */
  const sheet = container.querySelector("#planSheetOverlay");
  const deleteBtn = container.querySelector("#btnDeletePlanItem");

  function openAddSheet() {
    editingItemId = null;
    existingPhotoUrls = [];
    selectedNewFiles = [];
    selectedAssignees = activePerson === "all" ? members.map((m) => m.id) : [activePerson];
    container.querySelector("#planSheetTitle").textContent = `新增${TYPE_META[activeType].label}`;
    deleteBtn.style.display = "none";
    assigneeChipText.textContent = assigneesToLabel(selectedAssignees);
    assigneePicker.style.display = "none";
    renderAssigneePicker();
    container.querySelector("#planTitle").value = "";
    container.querySelector("#planContent").value = "";
    renderPhotoPreview();
    sheet.classList.add("show");
  }
  function openEditSheet(it) {
    editingItemId = it.id;
    existingPhotoUrls = [...(it.photoUrls || [])];
    selectedNewFiles = [];
    selectedAssignees = [...(it.assigneeIds || [])];
    container.querySelector("#planSheetTitle").textContent = `編輯${TYPE_META[it.type].label}`;
    deleteBtn.style.display = "block";
    assigneeChipText.textContent = assigneesToLabel(selectedAssignees);
    assigneePicker.style.display = "none";
    renderAssigneePicker();
    container.querySelector("#planTitle").value = it.title || "";
    container.querySelector("#planContent").value = it.content || "";
    renderPhotoPreview();
    sheet.classList.add("show");
  }
  container.querySelector("#btnAddPlanItem").addEventListener("click", openAddSheet);
  container.querySelector("#btnCancelPlanItem").addEventListener("click", () => sheet.classList.remove("show"));
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.classList.remove("show"); });
  deleteBtn.addEventListener("click", async () => {
    if (!editingItemId) return;
    if (!confirm("確定要刪除這個項目嗎？")) return;
    await deletePlanningItem(tripId, editingItemId);
    sheet.classList.remove("show");
  });

  container.querySelector("#btnSavePlanItem").addEventListener("click", async (e) => {
    const title = container.querySelector("#planTitle").value.trim();
    if (!title) {
      container.querySelector("#planTitle").focus();
      return;
    }
    if (!selectedAssignees.length) {
      alert("請選擇指派對象");
      return;
    }
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = selectedNewFiles.length ? "上傳中..." : "儲存中...";
    try {
      const uploadedUrls = [];
      for (const file of selectedNewFiles) {
        const url = await uploadFile(`trips/${tripId}/planning/${Date.now()}-${file.name}`, file);
        uploadedUrls.push(url);
      }
      const photoUrls = [...existingPhotoUrls, ...uploadedUrls];
      const payload = {
        title,
        content: container.querySelector("#planContent").value.trim(),
        photoUrls,
        assigneeIds: selectedAssignees,
      };
      if (editingItemId) {
        await updatePlanningItem(tripId, editingItemId, payload);
      } else {
        await createPlanningItem(tripId, { ...payload, type: activeType, createdBy: memberId });
      }
      sheet.classList.remove("show");
    } catch (err) {
      console.error("[儲存項目失敗]", err);
      alert("儲存失敗：" + (err.message || err.code || "未知錯誤"));
    } finally {
      btn.disabled = false;
      btn.textContent = "儲存";
    }
  });

  /* ---------- 即時監聽 ---------- */
  renderPersonTabs();
  const unsubscribe = listenPlanningItems(
    tripId,
    (items) => {
      allItems = items;
      renderList();
    },
    (error) => {
      listEl.innerHTML = `
        <div style="background:var(--warn-bg); border:2px solid var(--warn); border-radius:16px; padding:14px; font-size:12.5px; color:var(--ink);">
          <b>讀取失敗</b><br>
          最常見原因：Firestore 這個查詢需要建立索引。請按 F12 打開瀏覽器 Console，
          找到紅色錯誤訊息裡的連結，點下去建立索引，再重新整理頁面。<br>
          <span style="color:var(--ink-soft);">錯誤代碼：${error.code || "unknown"}</span>
        </div>
      `;
    }
  );
  cleanups.push(unsubscribe);

  return () => cleanups.forEach((fn) => fn());
}

export function mountMembersView(container, ctx) {
  const { tripId, isHost, members } = ctx;
  const { uid } = getState();

  const listEl = container.querySelector("#memberList");
  const addBtn = container.querySelector("#btnAddMember");
  const circleBtn = container.querySelector("#btnAddFromCircle");
  addBtn.style.display = isHost ? "flex" : "none";
  circleBtn.style.display = isHost ? "flex" : "none";

  const circlePicker = container.querySelector("#circlePickerOverlay");
  const circlePickerList = container.querySelector("#circlePickerList");
  circleBtn.addEventListener("click", async () => {
    circlePickerList.innerHTML = `<div class="spinner"></div>`;
    circlePicker.classList.add("show");
    let friends = [];
    try {
      friends = await new Promise((resolve, reject) => {
        const unsub = listenFriends(
          uid,
          (data) => { unsub(); resolve(data); },
          (err) => { unsub(); reject(err); }
        );
      });
    } catch (err) {
      circlePickerList.innerHTML = `<p style="text-align:center;color:var(--warn);padding:20px 0;">讀取朋友圈失敗，請檢查網路連線</p>`;
      return;
    }
    const alreadyInIds = new Set(members.flatMap((m) => m.boundUids || []));
    if (!friends.length) {
      circlePickerList.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;">你的泰迪宇宙還沒有朋友，先去「我的旅程」列表右上角新增朋友吧</p>`;
      return;
    }
    circlePickerList.innerHTML = friends
      .map((f) => {
        const already = alreadyInIds.has(f.linkedUid);
        return `
          <div class="member-card ${already ? "" : "circle-pick-opt"}" data-friend-id="${f.id}" style="${already ? "opacity:0.5;" : "cursor:pointer;"}">
            <div class="m-avatar" style="background:var(--sage-light);">${f.avatarValue}</div>
            <div class="m-info">
              <div class="m-name">${f.name}</div>
              <div class="m-sub">${already ? "已經在這趟旅程裡" : f.status === "active" ? "已啟用" : "尚未設定密碼"}</div>
            </div>
          </div>

      .join("");
    circlePickerList.querySelectorAll(".circle-pick-opt").forEach((el) => {

          });

          circlePicker.classList.remove("show");

          el.style.opacity = "1";
        }
      });
    });
  });
  container.querySelector("#btnCloseCirclePicker").addEventListener("click", () => circlePicker.classList.remove("show"));
  circlePicker.addEventListener("click", (e) => { if (e.target === circlePicker) circlePicker.classList.remove("show"); });

  function renderList() {

      .map(
        (m) => `
          <div class="member-card" data-member-id="${m.id}">

              ${avatarBoxContent(m)}
              ${m.isHost ? `<span class="host-star"><i class="fa-solid fa-crown"></i></span>` : ""}
            </div>
            <div class="m-info">
              <div class="m-name">${m.name}</div>

            </div>
            <i class="fa-solid fa-pen m-edit-icon"></i>
          </div>
        `
      )
      .join("");

    listEl.querySelectorAll(".member-card").forEach((card) => {
      card.addEventListener("click", () => {
        const m = members.find((x) => x.id === card.dataset.memberId);
        openEditSheet(m);
      });

  /* ---------- 編輯/新增面板 ---------- */
  const sheet = container.querySelector("#memberSheetOverlay");
  const nameInput = container.querySelector("#memberNameInput");
  const avatarPreview = container.querySelector("#editAvatarPreview");
  const tabLibrary = container.querySelector("#tabLibrary");
  const tabUpload = container.querySelector("#tabUpload");
  const libraryPanel = container.querySelector("#libraryPanel");
  const uploadPanel = container.querySelector("#uploadPanel");
  const photoInput = container.querySelector("#memberPhotoInput");
  const photoPreviewEl = container.querySelector("#memberPhotoPreview");
  const removeBtn = container.querySelector("#btnRemoveMember");

  let editingMemberId = null;
  let avatarSource = "library"; // 'library' | 'upload'
  let selectedEmoji = MEMBER_AVATAR_LIBRARY[0];
  let selectedPhotoFile = null;
  let existingAvatarUrl = null; // 編輯時原本的上傳照片（沒選新檔案就沿用）
  let avatarPosition = { x: 50, y: 50 };

  function parsePosition(str) {
    if (!str) return { x: 50, y: 50 };
    const [x, y] = str.split(" ").map((v) => parseFloat(v));
    return { x: isNaN(x) ? 50 : x, y: isNaN(y) ? 50 : y };
  }

  function switchAvatarSource(source) {
    avatarSource = source;
    tabLibrary.classList.toggle("active", source === "library");
    tabUpload.classList.toggle("active", source === "upload");
    libraryPanel.classList.toggle("hidden", source !== "library");
    uploadPanel.classList.toggle("show", source === "upload");
  }
  tabLibrary.addEventListener("click", () => switchAvatarSource("library"));
  tabUpload.addEventListener("click", () => switchAvatarSource("upload"));

  function setAvatarPreview() {
    const previewEmoji = container.querySelector("#previewEmoji");
    const dragHint = container.querySelector("#avatarDragHint");
    if (avatarSource === "upload" && (selectedPhotoFile || existingAvatarUrl)) {
      const url = selectedPhotoFile ? URL.createObjectURL(selectedPhotoFile) : existingAvatarUrl;
      avatarPreview.style.backgroundImage = `url('${url}')`;
      avatarPreview.style.backgroundSize = "cover";
      avatarPreview.style.backgroundPosition = `${avatarPosition.x}% ${avatarPosition.y}%`;
      previewEmoji.textContent = "";
      dragHint.style.display = "block";
      avatarPreview.classList.add("draggable");
    } else {
      avatarPreview.style.backgroundImage = "";
      previewEmoji.textContent = selectedEmoji;
      dragHint.style.display = "none";
      avatarPreview.classList.remove("draggable");
    }
  }

  /* 拖曳調整頭像顯示位置（跟住宿封面照片用同一套 Pointer Events 手法） */
  let avatarDragging = false;
  let avatarDragStart = { x: 0, y: 0 };
  let avatarDragStartPos = { x: 50, y: 50 };
  avatarPreview.style.touchAction = "none";
  avatarPreview.addEventListener("pointerdown", (e) => {
    if (!avatarPreview.classList.contains("draggable")) return;
    avatarDragging = true;
    avatarPreview.classList.add("dragging");
    avatarPreview.setPointerCapture(e.pointerId);
    avatarDragStart = { x: e.clientX, y: e.clientY };
    avatarDragStartPos = { ...avatarPosition };
  });
  avatarPreview.addEventListener("pointermove", (e) => {
    if (!avatarDragging) return;
    const rect = avatarPreview.getBoundingClientRect();
    const dx = e.clientX - avatarDragStart.x;
    const dy = e.clientY - avatarDragStart.y;
    const newX = Math.min(100, Math.max(0, avatarDragStartPos.x - (dx / rect.width) * 100));
    const newY = Math.min(100, Math.max(0, avatarDragStartPos.y - (dy / rect.height) * 100));
    avatarPosition = { x: newX, y: newY };
    avatarPreview.style.backgroundPosition = `${newX}% ${newY}%`;
  });
  function endAvatarDrag(e) {
    if (!avatarDragging) return;
    avatarDragging = false;
    avatarPreview.classList.remove("dragging");
    try { avatarPreview.releasePointerCapture(e.pointerId); } catch (_) {}
  }
  avatarPreview.addEventListener("pointerup", endAvatarDrag);
  avatarPreview.addEventListener("pointercancel", endAvatarDrag);

  container.querySelector("#libGrid").querySelectorAll(".a-opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      selectedEmoji = opt.dataset.emoji;
      container.querySelectorAll("#libGrid .a-opt").forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
      setAvatarPreview();
    });
  });
  photoInput.addEventListener("change", () => {
    selectedPhotoFile = photoInput.files[0] || null;
    if (selectedPhotoFile) {
      avatarPosition = { x: 50, y: 50 };
      photoPreviewEl.style.display = "block";
      photoPreviewEl.innerHTML = `<div style="font-size:11px;color:var(--ink-soft);">已選擇：${selectedPhotoFile.name}</div>`;
      setAvatarPreview();
    }
  });

  function openAddSheet() {
    editingMemberId = null;
    existingAvatarUrl = null;
    selectedPhotoFile = null;
    selectedEmoji = MEMBER_AVATAR_LIBRARY[0];
    avatarPosition = { x: 50, y: 50 };
    container.querySelector("#memberSheetTitle").textContent = "新增旅伴";
    nameInput.value = "";
    photoInput.value = "";
    photoPreviewEl.style.display = "none";
    removeBtn.style.display = "none";
    switchAvatarSource("library");
    container.querySelectorAll("#libGrid .a-opt").forEach((o, i) => o.classList.toggle("selected", i === 0));
    setAvatarPreview();
    sheet.classList.add("show");
  }
  function openEditSheet(m) {
    editingMemberId = m.id;
    existingAvatarUrl = m.avatarType === "upload" ? m.avatarValue : null;
    selectedPhotoFile = null;
    selectedEmoji = m.avatarType === "library" ? m.avatarValue : MEMBER_AVATAR_LIBRARY[0];
    avatarPosition = m.avatarType === "upload" ? parsePosition(m.avatarPosition) : { x: 50, y: 50 };
    container.querySelector("#memberSheetTitle").textContent = m.isHost ? "編輯我的資訊" : "編輯旅伴";
    nameInput.value = m.name || "";
    photoInput.value = "";
    photoPreviewEl.style.display = "none";
    removeBtn.style.display = !m.isHost && isHost ? "block" : "none";
    switchAvatarSource(m.avatarType === "upload" ? "upload" : "library");
    container.querySelectorAll("#libGrid .a-opt").forEach((o) => o.classList.toggle("selected", o.dataset.emoji === selectedEmoji));
    setAvatarPreview();
    sheet.classList.add("show");
  }
  addBtn.addEventListener("click", openAddSheet);
  container.querySelector("#btnCancelMember").addEventListener("click", () => sheet.classList.remove("show"));
  sheet.addEventListener("click", (e) => { if (e.target === sheet) sheet.classList.remove("show"); });

  removeBtn.addEventListener("click", async () => {
    if (!editingMemberId) return;
    if (!confirm("確定要把這位旅伴移出行程嗎？他過去的記帳/待辦紀錄仍會保留。")) return;
    await removeMember(tripId, editingMemberId);
    sheet.classList.remove("show");
  });

  container.querySelector("#btnSaveMember").addEventListener("click", async (e) => {
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      return;
    }
    const btn = e.currentTarget;
    btn.disabled = true;
    btn.textContent = selectedPhotoFile ? "上傳中..." : "儲存中...";
    try {
      let avatarType = avatarSource;
      let avatarValue = avatarSource === "library" ? selectedEmoji : existingAvatarUrl;
      if (avatarSource === "upload" && selectedPhotoFile) {
        avatarValue = await uploadFile(`trips/${tripId}/members/${Date.now()}-${selectedPhotoFile.name}`, selectedPhotoFile);
      }
      if (avatarSource === "upload" && !avatarValue) {
        alert("請選擇一張照片，或改用圖庫頭像");
        return;
      }
      const payload = { name, avatarType, avatarValue, avatarPosition: `${avatarPosition.x}% ${avatarPosition.y}%` };
      if (editingMemberId) {
        await updateMember(tripId, editingMemberId, payload);
      } else {
        await createMember(tripId, { ...payload, isHost: false, boundUids: [] });
      }
      sheet.classList.remove("show");
    } catch (err) {
      console.error("[儲存成員失敗]", err);
      alert("儲存失敗：" + (err.message || err.code || "未知錯誤"));
    } finally {
      btn.disabled = false;
      btn.textContent = "儲存";
    }
  });

  renderList();
  return null; // 這個分頁沒有即時監聽（成員資料由 router.js 的 listenMembers 統一提供），不需要清理函式
}

export async function mountIdentityView(container) {

    return;
  }

  const trip = await getTrip(currentTripId);
  container.querySelector("#identityTripName").textContent = trip
    ? `歡迎加入「${trip.name}」！`
    : "找不到這趟旅程";

  const members = await getMembersOnce(currentTripId);
  const grid = container.querySelector("#existingMembers");
  grid.innerHTML = members
    .map(
      (m) => `
        <button class="member-pick" data-member-id="${m.id}">

        </button>

  grid.querySelectorAll("[data-member-id]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const memberId = btn.dataset.memberId;
      btn.disabled = true;
      await claimMember(currentTripId, memberId, uid);
      setBoundMemberId(currentTripId, memberId);
      setState({ currentMemberId: memberId });
      gotoRoute("#/app/schedule", currentTripId);
    });
  });

  // 頭像選擇（新成員表單）
  let selectedAvatar = AVATAR_LIBRARY[0];
  const avatarPicker = container.querySelector("#avatarPicker");
  avatarPicker.querySelectorAll(".avatar-opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      avatarPicker.querySelectorAll(".avatar-opt").forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
      selectedAvatar = opt.dataset.emoji;
    });
  });

  container.querySelector("#btnJoinNew").addEventListener("click", async () => {
    const nameInput = container.querySelector("#newMemberName");
    const name = nameInput.value.trim();
    if (!name) {
      nameInput.focus();
      nameInput.style.borderColor = "var(--danger)";
      return;
    }
    const memberId = await createMember(currentTripId, {
      name,
      avatarValue: selectedAvatar,
      isHost: false,
      boundUids: [uid],
    });
    setBoundMemberId(currentTripId, memberId);
    setState({ currentMemberId: memberId });
    gotoRoute("#/app/schedule", currentTripId);
  });
}

    gotoRoute("#/circle", null);

}

  const inviteLinkText = container.querySelector("#friendInviteLinkText");

  /* ---------- 帳號升級提示（匿名帳號 → email+密碼正式帳號） ----------
   * 這是為了解決 iOS「加入主畫面」給的是全新匿名身份、看不到泰迪宇宙資料的問題。
   * 升級後 uid 不變，是「同一個人」多了一種登入方式，不是換帳號、不用搬資料。 */
  const upgradeCard = container.querySelector("#accountUpgradeCard");

  if (isAnonymous) {
    upgradeCard.className = "account-upgrade-card";
    upgradeCard.innerHTML = `
      <div><b>還沒設定登入帳號</b><br>設定後才能在手機加入主畫面等獨立環境裡看到這份朋友圈</div>

  }
  container.querySelector("#btnCancelUpgrade").addEventListener("click", () => upgradeSheet.classList.remove("show"));
  upgradeSheet.addEventListener("click", (e) => { if (e.target === upgradeSheet) upgradeSheet.classList.remove("show"); });
  container.querySelector("#btnConfirmUpgrade").addEventListener("click", async () => {
    const email = container.querySelector("#upgradeEmail").value.trim();
    const password = container.querySelector("#upgradePassword").value;
    const errorEl = container.querySelector("#upgradeError");
    errorEl.style.display = "none";

      errorEl.textContent = "信箱要填、密碼至少 6 碼";
      errorEl.style.display = "block";
      return;
    }
    const btn = container.querySelector("#btnConfirmUpgrade");
    btn.disabled = true;
    btn.textContent = "設定中…";
    try {
      await upgradeToEmailAccount(email, password);
      upgradeSheet.classList.remove("show");
      alert("設定完成！之後在任何裝置都可以用這組信箱密碼登入（走「泰迪宇宙」朋友點的那種登入畫面）。");
      upgradeCard.className = "account-upgrade-card is-ok";
      upgradeCard.innerHTML = `<div><b>已設定登入帳號</b><br>${email}</div>`;
    } catch (err) {
      console.error("[帳號升級失敗]", err);
      if (err.code === "auth/email-already-in-use") {
        errorEl.textContent = "這個信箱已經被用過了，換一個試試。";
      } else if (err.code === "auth/weak-password") {
        errorEl.textContent = "密碼太簡單，換一組再試試。";
      } else {
        errorEl.textContent = "設定失敗，請檢查網路連線後再試一次。";
      }
      errorEl.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.textContent = "設定完成";
    }
  });

  let friends = [];
  let editingFriendId = null;
  let selectedAvatar = AVATAR_EMOJI_LIBRARY[0];

  function renderList() {
    listEl.innerHTML = friends.length
      ? friends.map(friendCardHtml).join("")
      : `<p style="text-align:center;color:var(--ink-soft);padding:30px 0;">還沒有朋友，點下面「新增朋友」開始建立你的泰迪宇宙吧</p>`;
    listEl.querySelectorAll(".friend-card").forEach((card) => {
      card.addEventListener("click", () => openEditFriend(card.dataset.friendId));
    });
  }

  const unsubscribe = listenFriends(
    uid,
    (data) => {
      friends = data;
      renderList();
    },
    (error) => {
      listEl.innerHTML = `
        <div style="background:var(--warn-bg); border:2px solid var(--warn); border-radius:16px; padding:14px; font-size:12.5px; color:var(--ink);">
          <b>朋友圈讀取失敗</b><br>
          請按 F12 打開瀏覽器 Console，找到紅色錯誤訊息裡的索引建立連結，點下去建立後重新整理。<br>
          <span style="font-size:11px;color:var(--ink-soft);">錯誤代碼：${error.code || "unknown"}</span>
        </div>
      `;
    }
  );

  avatarGrid.querySelectorAll(".a-opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      avatarGrid.querySelectorAll(".a-opt").forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
      selectedAvatar = opt.dataset.emoji;
    });
  });

  function openAddFriend() {
    editingFriendId = null;
    container.querySelector("#friendSheetTitle").textContent = "新增朋友";
    emailInput.value = "";
    emailInput.disabled = false;
    nameInput.value = "";
    selectedAvatar = AVATAR_EMOJI_LIBRARY[0];
    avatarGrid.querySelectorAll(".a-opt").forEach((o) => o.classList.toggle("selected", o.dataset.emoji === selectedAvatar));
    container.querySelector("#btnRemoveFriend").style.display = "none";
    container.querySelector("#btnRegenLink").style.display = "none";
    friendSheet.classList.add("show");
  }

  function openEditFriend(friendId) {
    const f = friends.find((x) => x.id === friendId);
    if (!f) return;
    editingFriendId = friendId;
    container.querySelector("#friendSheetTitle").textContent = "編輯朋友";
    emailInput.value = f.email;
    emailInput.disabled = true; // email 綁定了帳號，建立後不能改
    nameInput.value = f.name;
    selectedAvatar = f.avatarValue;
    avatarGrid.querySelectorAll(".a-opt").forEach((o) => o.classList.toggle("selected", o.dataset.emoji === selectedAvatar));
    container.querySelector("#btnRemoveFriend").style.display = "block";
    container.querySelector("#btnRegenLink").style.display = f.status === "pending" ? "block" : "none";
    friendSheet.classList.add("show");
  }

  container.querySelector("#btnRegenLink").addEventListener("click", async () => {
    const f = friends.find((x) => x.id === editingFriendId);
    if (!f) return;
    const btn = container.querySelector("#btnRegenLink");
    btn.disabled = true;
    btn.textContent = "產生中…";
    try {
      const newToken = await regenerateFriendToken(uid, f.id, f.email, f.token);
      friendSheet.classList.remove("show");
      const link = `${window.location.origin}${window.location.pathname}?friendClaim=1&fh=${uid}&fid=${f.id}&email=${encodeURIComponent(f.email)}&token=${newToken}`;
      inviteLinkText.textContent = link;
      inviteSheet.classList.add("show");
    } catch (err) {
      console.error("[重新產生邀請連結失敗]", err);
      alert("產生失敗，請檢查網路連線後再試一次。");
    } finally {
      btn.disabled = false;
      btn.innerHTML = `<i class="fa-solid fa-rotate"></i> 重新產生邀請連結`;
    }
  });

  container.querySelector("#btnAddFriend").addEventListener("click", openAddFriend);
  container.querySelector("#btnCancelFriend").addEventListener("click", () => friendSheet.classList.remove("show"));
  friendSheet.addEventListener("click", (e) => { if (e.target === friendSheet) friendSheet.classList.remove("show"); });

  container.querySelector("#btnSaveFriend").addEventListener("click", async () => {
    const email = emailInput.value.trim();
    const name = nameInput.value.trim();
    if (!email || !name) {
      alert("Email 跟名字都要填喔");
      return;
    }
    const saveBtn = container.querySelector("#btnSaveFriend");
    saveBtn.disabled = true;
    saveBtn.textContent = "處理中…";
    try {
      if (editingFriendId) {
        await updateFriend(uid, editingFriendId, { name, avatarValue: selectedAvatar });
        friendSheet.classList.remove("show");
      } else {
        const { friendId, token } = await createFriend(uid, { email, name, avatarValue: selectedAvatar });
        friendSheet.classList.remove("show");
        const link = `${window.location.origin}${window.location.pathname}?friendClaim=1&fh=${uid}&fid=${friendId}&email=${encodeURIComponent(email)}&token=${token}`;
        inviteLinkText.textContent = link;
        inviteSheet.classList.add("show");
      }
    } catch (err) {
      console.error("[新增/編輯朋友失敗]", err);
      if (err.code === "auth/email-already-in-use") {
        alert("這個 email 已經被用過了（可能已經是別人朋友圈裡的帳號），換一個 email 試試。");
      } else {
        alert("儲存失敗，請檢查網路連線後再試一次。");
      }
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = "儲存";
    }
  });

  container.querySelector("#btnRemoveFriend").addEventListener("click", async () => {
    if (!editingFriendId) return;
    if (!confirm("確定要把她從朋友圈移除嗎？她原本已經加入的旅程不會受影響，只是之後開新旅程不會再看到她。")) return;
    await deleteFriend(uid, editingFriendId);
    friendSheet.classList.remove("show");
  });

  container.querySelector("#btnCloseFriendInvite").addEventListener("click", () => inviteSheet.classList.remove("show"));
  container.querySelector("#btnCopyFriendInvite").addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(inviteLinkText.textContent);
      alert("已複製，貼給她吧！");
    } catch {
      alert("複製失敗，麻煩手動選取上面的連結文字複製。");
    }
  });

  container.querySelector("#btnCircleBack").addEventListener("click", () => {
    gotoRoute("#/trips", null);
  });

  return () => unsubscribe();
}

// views/claim.js
// 朋友點開「泰迪宇宙」邀請連結後看到的畫面：用一次性權杖登入一次、
// 自己設定正式密碼。如果不是透過連結進來（沒有 pendingClaim），
// 就顯示一般的「用信箱密碼登入」表單——這是給已經設定過密碼的人，
// 換裝置或換瀏覽器時，重新登入回自己帳號用的入口。
export function renderClaimView() {
  const { pendingClaim } = getState();
  if (pendingClaim) {
    return `
      <div class="identity-view">
        <h1>設定你的密碼</h1>
        <p class="sub">這是你第一次使用，設定一組自己的密碼之後，以後在任何裝置上都可以用信箱＋這組密碼登入。</p>
        <label class="field-label" style="text-align:left;">新密碼 <span style="font-weight:400;color:var(--ink-soft);">· 至少 6 碼</span></label>
        <input type="password" class="text-input" id="claimNewPassword" placeholder="設定密碼">
        <label class="field-label" style="text-align:left;">再輸入一次</label>
        <input type="password" class="text-input" id="claimConfirmPassword" placeholder="確認密碼">
        <div id="claimError" style="color:var(--warn); font-size:12.5px; margin-bottom:10px; display:none;"></div>
        <button class="btn btn-primary primary-weight" id="btnClaimSubmit" style="width:100%;">設定完成，開始使用</button>
      </div>
    `;
  }
  return `
    <div class="identity-view">
      <h1>登入</h1>
      <p class="sub">用主揪幫你設定的信箱和你自己的密碼登入</p>
      <label class="field-label" style="text-align:left;">Email</label>
      <input type="email" class="text-input" id="loginEmail" placeholder="你的信箱" autocomplete="username">
      <label class="field-label" style="text-align:left;">密碼</label>
      <input type="password" class="text-input" id="loginPassword" placeholder="密碼" autocomplete="current-password">
      <div id="claimError" style="color:var(--warn); font-size:12.5px; margin-bottom:10px; display:none;"></div>
      <button class="btn btn-primary primary-weight" id="btnLoginSubmit" style="width:100%;">登入</button>
    </div>
  `;
}

export async function mountClaimView(container) {
  const { pendingClaim } = getState();
  const errorEl = container.querySelector("#claimError");

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }

  if (pendingClaim) {
    container.querySelector("#btnClaimSubmit").addEventListener("click", async () => {
      const pw = container.querySelector("#claimNewPassword").value;
      const confirmPw = container.querySelector("#claimConfirmPassword").value;
      errorEl.style.display = "none";
      if (pw.length < 6) {
        showError("密碼至少要 6 碼");
        return;
      }
      if (pw !== confirmPw) {
        showError("兩次輸入的密碼不一樣");
        return;
      }
      const btn = container.querySelector("#btnClaimSubmit");
      btn.disabled = true;
      btn.textContent = "處理中…";
      try {
        await claimFriendAccount(pendingClaim.email, pendingClaim.token, pw);
        await markFriendActive(pendingClaim.hostUid, pendingClaim.friendId);
        setState({ uid: auth.currentUser.uid, pendingClaim: null });
        alert("設定完成！之後可以直接用這組信箱密碼登入。");
        gotoRoute("#/trips", null);
      } catch (err) {
        console.error("[認領帳號失敗]", err);
        if (err.code === "auth/invalid-credential" || err.code === "auth/wrong-password") {
          showError("這條連結已經用過、或已經失效了。如果你之前已經設定過密碼，請改用登入頁用信箱密碼登入；不然麻煩請主揪重新發一次邀請連結。");
        } else {
          showError("設定失敗，請檢查網路連線後再試一次。");
        }
        btn.disabled = false;
        btn.textContent = "設定完成，開始使用";
      }
    });
  } else {
    container.querySelector("#btnLoginSubmit").addEventListener("click", async () => {
      const email = container.querySelector("#loginEmail").value.trim();
      const password = container.querySelector("#loginPassword").value;
      errorEl.style.display = "none";
      if (!email || !password) {
        showError("信箱跟密碼都要填");
        return;
      }
      const btn = container.querySelector("#btnLoginSubmit");
      btn.disabled = true;
      btn.textContent = "登入中…";
      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        setState({ uid: cred.user.uid });
        gotoRoute("#/trips", null);
      } catch (err) {
        console.error("[登入失敗]", err);
        showError("信箱或密碼不對，請再確認一次。");
        btn.disabled = false;
        btn.textContent = "登入";
      }
    });
  }
}


// 開團 Wizard：主揪建立新行程的入口。4 步驟：
//   1. 主題（含封面 emoji）
//   2. 日期
//   3. 成員（主揪自己的名字/頭像 + 邀請的旅伴）
//   4. 機票（選填，可略過 —— 目前先手動輸入，之後才接真的航班查詢 API）
// 完成後才一次寫入 Firestore（createTrip + 逐一 createMember + 選填 createFlight）。


const COVER_OPTIONS = TRIP_COVER_EMOJI_LIBRARY;
const WIZARD_AVATAR_LIBRARY = AVATAR_EMOJI_LIBRARY;

let wizardState = {
  step: 1,
  name: "",
  cover: COVER_OPTIONS[0],
  startDate: "",
  endDate: "",
  hostName: "",
  hostAvatar: WIZARD_AVATAR_LIBRARY[0],
  otherMembers: [], // { name, avatar }
  flights: { outbound: null, return: null },
};

export function renderTripWizardView() {
  wizardState = {
    step: 1,
    name: "",
    cover: COVER_OPTIONS[0],
    startDate: "",
    endDate: "",
    hostName: "",
    hostAvatar: WIZARD_AVATAR_LIBRARY[0],
    otherMembers: [],
    flights: { outbound: null, return: null },
  };

  return `
    <div class="wizard-view">
      <div class="wiz-header">
        <div class="progress-row" id="wizProgress"></div>
        <div class="step-label" id="wizStepLabel"></div>
      </div>
      <div class="wiz-body" id="wizBody"></div>
      <div class="wiz-footer" id="wizFooter">
        <button class="btn btn-outline" id="wizBack">上一步</button>
        <button class="btn btn-primary primary-weight" id="wizNext">下一步</button>
      </div>
    </div>
  `;
}

export function mountTripWizardView(container) {
  const body = container.querySelector("#wizBody");
  const progress = container.querySelector("#wizProgress");
  const stepLabel = container.querySelector("#wizStepLabel");
  const btnBack = container.querySelector("#wizBack");
  const btnNext = container.querySelector("#wizNext");

  const TOTAL = 4;

  function renderStep() {
    progress.innerHTML = Array.from({ length: TOTAL })
      .map((_, i) => `<div class="progress-seg ${i < wizardState.step ? "done" : ""}"></div>`)
      .join("");
    stepLabel.textContent = `步驟 ${wizardState.step} / ${TOTAL}`;
    btnBack.style.visibility = wizardState.step === 1 ? "hidden" : "visible";
    btnNext.textContent = wizardState.step === TOTAL ? "完成建立" : "下一步";

    if (wizardState.step === 1) body.innerHTML = renderStep1();
    if (wizardState.step === 2) body.innerHTML = renderStep2();
    if (wizardState.step === 3) body.innerHTML = renderStep3();
    if (wizardState.step === 4) body.innerHTML = renderStep4();

    bindStepEvents();
  }

  function renderStep1() {
    return `
      <h2 class="step-title">這趟旅程叫什麼？</h2>
      <label class="field-label">行程主題</label>
      <input type="text" class="text-input" id="fName" value="${wizardState.name}" placeholder="例如：北海道五日雪國之旅">
      <label class="field-label">選個封面感覺 <span style="font-weight:400;color:var(--ink-soft);">· 選填</span></label>
      <div class="cover-grid">
        ${COVER_OPTIONS.map(
          (e) => `<div class="cover-opt ${e === wizardState.cover ? "selected" : ""}" data-cover="${e}">${e}</div>`
        ).join("")}
      </div>
    `;
  }

  function renderStep2() {
    return `
      <h2 class="step-title">出發跟回來是什麼時候？</h2>
      <div class="date-row">
        <div><label class="field-label">出發日</label><input type="date" class="text-input" id="fStart" value="${wizardState.startDate}"></div>
        <div><label class="field-label">回程日</label><input type="date" class="text-input" id="fEnd" value="${wizardState.endDate}"></div>
      </div>
      <p class="field-hint" id="dayCountHint" style="margin-top:-4px;"></p>
    `;
  }

  function renderStep3() {
    return `
      <h2 class="step-title">你自己跟旅伴</h2>
      <label class="field-label">你的名字（主揪）</label>
      <input type="text" class="text-input" id="fHostName" value="${wizardState.hostName}" placeholder="例如：Peggy">
      <label class="field-label">選一個頭像</label>
      <div class="avatar-row" id="hostAvatarPicker">
        ${WIZARD_AVATAR_LIBRARY.map(
          (e) => `<div class="avatar-opt ${e === wizardState.hostAvatar ? "selected" : ""}" data-emoji="${e}">${e}</div>`
        ).join("")}
      </div>

      <label class="field-label" style="margin-top:16px;">已加入的旅伴</label>
      <div class="member-list" id="otherMembersList">
        ${wizardState.otherMembers
          .map(
            (m, i) => `
              <div class="member-row">
                <div class="m-avatar">${m.avatar}</div>
                <div class="m-name">${m.name}</div>
                <button class="m-remove" data-remove-index="${i}"><i class="fa-solid fa-xmark"></i></button>
              </div>
            `
          )
          .join("")}
      </div>

      <div class="add-member-card">
        <label class="field-label">新增旅伴</label>
        <input type="text" class="text-input" id="fNewMemberName" placeholder="輸入名字">
        <div class="avatar-row" id="newMemberAvatarPicker">
          ${WIZARD_AVATAR_LIBRARY.map((e, i) => `<div class="avatar-opt ${i === 0 ? "selected" : ""}" data-emoji="${e}">${e}</div>`).join("")}
        </div>
        <button class="btn-dashed" id="btnAddMember"><i class="fa-solid fa-plus"></i> 加入這位旅伴</button>
      </div>
    `;
  }

  function renderStep4() {
    return `
      <h2 class="step-title">機票資訊 <span style="font-weight:400;color:var(--ink-soft);font-size:12px;">· 可略過，之後在預訂頁補上</span></h2>
      <label class="field-label">去程航班（選填）</label>
      <div class="flight-input-row">
        <input type="date" class="text-input" id="fOutDate" placeholder="日期">
        <input type="text" class="text-input" id="fOutFlight" placeholder="航班編號">
      </div>
      <label class="field-label">回程航班（選填）</label>
      <div class="flight-input-row">
        <input type="date" class="text-input" id="fRetDate" placeholder="日期">
        <input type="text" class="text-input" id="fRetFlight" placeholder="航班編號">
      </div>
    `;
  }

  function bindStepEvents() {
    if (wizardState.step === 1) {
      body.querySelector("#fName").addEventListener("input", (e) => (wizardState.name = e.target.value));
      body.querySelectorAll(".cover-opt").forEach((opt) => {
        opt.addEventListener("click", () => {
          wizardState.cover = opt.dataset.cover;
          body.querySelectorAll(".cover-opt").forEach((o) => o.classList.remove("selected"));
          opt.classList.add("selected");
        });
      });
    }

    if (wizardState.step === 2) {
      const startInput = body.querySelector("#fStart");
      const endInput = body.querySelector("#fEnd");
      const hint = body.querySelector("#dayCountHint");
      function updateHint() {
        wizardState.startDate = startInput.value;
        wizardState.endDate = endInput.value;
        if (wizardState.startDate && wizardState.endDate) {
          const days =
            (new Date(wizardState.endDate) - new Date(wizardState.startDate)) / 86400000 + 1;
          hint.textContent = days > 0 ? `共 ${days} 天 ${days - 1} 夜` : "回程日期要晚於出發日";
        } else {
          hint.textContent = "";
        }
      }
      startInput.addEventListener("change", updateHint);
      endInput.addEventListener("change", updateHint);
      updateHint();
    }

    if (wizardState.step === 3) {
      body.querySelector("#fHostName").addEventListener("input", (e) => (wizardState.hostName = e.target.value));
      const hostPicker = body.querySelector("#hostAvatarPicker");
      hostPicker.querySelectorAll(".avatar-opt").forEach((opt) => {
        opt.addEventListener("click", () => {
          wizardState.hostAvatar = opt.dataset.emoji;
          hostPicker.querySelectorAll(".avatar-opt").forEach((o) => o.classList.remove("selected"));
          opt.classList.add("selected");
        });
      });

      let newMemberAvatar = WIZARD_AVATAR_LIBRARY[0];
      const newPicker = body.querySelector("#newMemberAvatarPicker");
      newPicker.querySelectorAll(".avatar-opt").forEach((opt) => {
        opt.addEventListener("click", () => {
          newMemberAvatar = opt.dataset.emoji;
          newPicker.querySelectorAll(".avatar-opt").forEach((o) => o.classList.remove("selected"));
          opt.classList.add("selected");
        });
      });

      body.querySelector("#btnAddMember").addEventListener("click", () => {
        const nameInput = body.querySelector("#fNewMemberName");
        const name = nameInput.value.trim();
        if (!name) return;
        wizardState.otherMembers.push({ name, avatar: newMemberAvatar });
        renderStep();
      });

      body.querySelectorAll("[data-remove-index]").forEach((btn) => {
        btn.addEventListener("click", () => {
          wizardState.otherMembers.splice(Number(btn.dataset.removeIndex), 1);
          renderStep();
        });
      });
    }

    if (wizardState.step === 4) {
      body.querySelector("#fOutDate").addEventListener("input", (e) => {
        wizardState.flights.outbound = { ...(wizardState.flights.outbound || {}), date: e.target.value };
      });
      body.querySelector("#fOutFlight").addEventListener("input", (e) => {
        wizardState.flights.outbound = { ...(wizardState.flights.outbound || {}), flightNumber: e.target.value };
      });
      body.querySelector("#fRetDate").addEventListener("input", (e) => {
        wizardState.flights.return = { ...(wizardState.flights.return || {}), date: e.target.value };
      });
      body.querySelector("#fRetFlight").addEventListener("input", (e) => {
        wizardState.flights.return = { ...(wizardState.flights.return || {}), flightNumber: e.target.value };
      });
    }
  }

  async function finish() {
    btnNext.disabled = true;
    btnNext.textContent = "建立中...";

    const { uid } = getState();
    const { tripId, hostMemberId } = await createTrip({
      name: wizardState.name || "未命名旅程",
      coverEmojiOrUrl: wizardState.cover,
      isPhotoUrl: false,
      startDate: wizardState.startDate,
      endDate: wizardState.endDate,
      hostUid: uid,
      hostName: wizardState.hostName || "主揪",
      hostAvatarValue: wizardState.hostAvatar,
    });

    for (const m of wizardState.otherMembers) {
      await createMember(tripId, { name: m.name, avatarValue: m.avatar, isHost: false, boundUids: [] });
    }

    if (wizardState.flights.outbound?.flightNumber) {
      await createFlight(tripId, {
        direction: "outbound",
        flightNumber: wizardState.flights.outbound.flightNumber,
        date: wizardState.flights.outbound.date || wizardState.startDate,
        airline: "",
        departure: {},
        arrival: {},
      });
    }
    if (wizardState.flights.return?.flightNumber) {
      await createFlight(tripId, {
        direction: "return",
        flightNumber: wizardState.flights.return.flightNumber,
        date: wizardState.flights.return.date || wizardState.endDate,
        airline: "",
        departure: {},
        arrival: {},
      });
    }

    setBoundMemberId(tripId, hostMemberId);
    setState({ currentTripId: tripId, currentMemberId: hostMemberId });
    gotoRoute("#/app/schedule", tripId);
  }

  btnNext.addEventListener("click", () => {
    if (wizardState.step < TOTAL) {
      wizardState.step += 1;
      renderStep();
    } else {
      finish();
    }
  });
  btnBack.addEventListener("click", () => {
    if (wizardState.step > 1) {
      wizardState.step -= 1;
      renderStep();
    }
  });

  renderStep();
}

export async function mountTripSettingsView(container) {
  const { currentTripId, currentMemberId, uid } = getState();
  const body = container.querySelector("#settingsBody");

  if (!currentTripId) {
    body.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px 20px;">找不到目前的旅程。</p>`;
    return;
  }

  const trip = await getTrip(currentTripId);
  const members = await getMembersOnce(currentTripId);
  const me = members.find((m) => m.id === currentMemberId);
  const isHost = !!me?.isHost;

  container.querySelector("#btnSettingsBack").addEventListener("click", () => {
    gotoRoute("#/app/schedule", currentTripId);
  });

  if (!trip) {
    body.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px 20px;">找不到這趟旅程。</p>`;
    return;
  }
  if (!isHost) {
    body.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:40px 20px;">只有主揪可以查看旅程設定。</p>`;
    return;
  }

  const inviteLink = `${window.location.origin}${window.location.pathname}?trip=${currentTripId}`;
  const dayCount =
    trip.startDate && trip.endDate ? Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000) + 1 : null;

  function renderBody() {
    body.innerHTML = `
      <div class="settings-section">
        <div class="sec-label">行程資訊</div>
        <div class="settings-card">
          <div class="settings-row" id="rowTheme">
            <i class="fa-solid fa-signature leading"></i>
            <div class="row-text"><div class="row-title">行程主題</div></div>
            <span class="row-value">${trip.name}</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-row" id="rowDates">
            <i class="fa-solid fa-calendar leading"></i>
            <div class="row-text"><div class="row-title">行程日期</div></div>
            <span class="row-value">${trip.startDate} - ${trip.endDate}${dayCount ? ` · ${dayCount}天${dayCount - 1}夜` : ""}</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-row" id="rowCover">
            <i class="fa-solid fa-image leading"></i>
            <div class="row-text"><div class="row-title">封面圖示</div></div>
            <span class="row-value" style="font-size:18px;">${trip.coverType === "photo" ? "📷" : trip.coverValue}</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-row" id="rowDestination">
            <i class="fa-solid fa-location-dot leading"></i>
            <div class="row-text"><div class="row-title">目的地城市</div><div class="row-sub">用來抓行程頁的即時天氣</div></div>
            <span class="row-value">${trip.destination?.name || "尚未設定"}</span>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
        </div>
      </div>

      <div class="settings-section">
        <div class="sec-label">安全性</div>
        <div class="settings-card">
          <div class="settings-row" id="rowPin">
            <i class="fa-solid fa-lock leading"></i>
            <div class="row-text">
              <div class="row-title">預訂編輯 PIN 碼</div>
              <div class="row-sub">保護機票與住宿資訊</div>
            </div>
            <span class="row-value">${trip.security?.bookingsPinHash ? "已設定" : "尚未設定"}</span>
            <i class="fa-solid fa-chevron-right chevron" style="margin-left:6px;"></i>
          </div>
        </div>
        <div class="host-only-note"><i class="fa-solid fa-crown"></i> 僅主揪可以修改</div>
      </div>

      <div class="settings-section">
        <div class="sec-label">旅程管理</div>
        <div class="settings-card">
          <div class="settings-row" id="rowInvite">
            <i class="fa-solid fa-link leading"></i>
            <div class="row-text"><div class="row-title">邀請旅伴連結</div><div class="row-sub">分享給朋友加入這趟旅程</div></div>
            <i class="fa-solid fa-copy chevron"></i>
          </div>
          <div class="settings-row" id="rowArchive">
            <i class="fa-solid fa-box-archive leading"></i>
            <div class="row-text"><div class="row-title">${trip.status === "archived" ? "取消封存" : "封存這趟旅程"}</div><div class="row-sub">${trip.status === "archived" ? "重新設為進行中" : "結案後歸類到已封存，釋放即時資料空間（之後才會真的打包）"}</div></div>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-row" id="rowDuplicate">
            <i class="fa-solid fa-clone leading"></i>
            <div class="row-text"><div class="row-title">複製這趟旅程</div><div class="row-sub">複製行程、住宿、機票、租車、票券憑證；成員需要重新加入</div></div>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
          <div class="settings-row danger-row" id="rowDelete">
            <i class="fa-solid fa-trash leading"></i>
            <div class="row-text"><div class="row-title">刪除這趟旅程</div></div>
            <i class="fa-solid fa-chevron-right chevron"></i>
          </div>
        </div>
      </div>
    `;

    body.querySelector("#rowTheme").addEventListener("click", openThemeSheet);
    body.querySelector("#rowDates").addEventListener("click", openDatesSheet);
    body.querySelector("#rowCover").addEventListener("click", openCoverSheet);
    body.querySelector("#rowDestination").addEventListener("click", openDestinationSheet);
    body.querySelector("#rowPin").addEventListener("click", openPinSetSheet);
    body.querySelector("#rowInvite").addEventListener("click", copyInviteLink);
    body.querySelector("#rowArchive").addEventListener("click", toggleArchive);
    body.querySelector("#rowDuplicate").addEventListener("click", handleDuplicateTrip);
    body.querySelector("#rowDelete").addEventListener("click", confirmDelete);
  }

  /* ---------- 主題 ---------- */
  const themeSheet = container.querySelector("#themeSheetOverlay");
  function openThemeSheet() {
    container.querySelector("#fTripName").value = trip.name;
    themeSheet.classList.add("show");
  }
  container.querySelector("#btnCancelTheme").addEventListener("click", () => themeSheet.classList.remove("show"));
  themeSheet.addEventListener("click", (e) => { if (e.target === themeSheet) themeSheet.classList.remove("show"); });
  container.querySelector("#btnSaveTheme").addEventListener("click", async () => {
    const name = container.querySelector("#fTripName").value.trim();
    if (!name) return;
    await updateTrip(currentTripId, { name });
    trip.name = name;
    themeSheet.classList.remove("show");
    renderBody();
  });

  /* ---------- 日期 ---------- */
  const datesSheet = container.querySelector("#datesSheetOverlay");
  function openDatesSheet() {
    container.querySelector("#fTripStart").value = trip.startDate || "";
    container.querySelector("#fTripEnd").value = trip.endDate || "";
    datesSheet.classList.add("show");
  }
  container.querySelector("#btnCancelDates").addEventListener("click", () => datesSheet.classList.remove("show"));
  datesSheet.addEventListener("click", (e) => { if (e.target === datesSheet) datesSheet.classList.remove("show"); });
  container.querySelector("#btnSaveDates").addEventListener("click", async () => {
    const startDate = container.querySelector("#fTripStart").value;
    const endDate = container.querySelector("#fTripEnd").value;
    if (!startDate || !endDate || endDate < startDate) {
      alert("請確認日期區間正確（回程日不能早於出發日）");
      return;
    }
    await updateTrip(currentTripId, { startDate, endDate });
    trip.startDate = startDate;
    trip.endDate = endDate;
    datesSheet.classList.remove("show");
    renderBody();
  });

  /* ---------- 封面 ---------- */
  const coverSheet = container.querySelector("#coverSheetOverlay");
  let selectedCover = trip.coverValue;
  function openCoverSheet() {
    selectedCover = trip.coverType === "emoji" ? trip.coverValue : SETTINGS_COVER_OPTIONS[0];
    container.querySelectorAll("#settingsCoverGrid .cover-opt").forEach((o) => o.classList.toggle("selected", o.dataset.cover === selectedCover));
    coverSheet.classList.add("show");
  }
  container.querySelectorAll("#settingsCoverGrid .cover-opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      selectedCover = opt.dataset.cover;
      container.querySelectorAll("#settingsCoverGrid .cover-opt").forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
    });
  });
  container.querySelector("#btnCancelCover").addEventListener("click", () => coverSheet.classList.remove("show"));
  coverSheet.addEventListener("click", (e) => { if (e.target === coverSheet) coverSheet.classList.remove("show"); });
  container.querySelector("#btnSaveCover").addEventListener("click", async () => {
    await updateTrip(currentTripId, { coverType: "emoji", coverValue: selectedCover });
    trip.coverType = "emoji";
    trip.coverValue = selectedCover;
    coverSheet.classList.remove("show");
    renderBody();
  });

  /* ---------- 目的地城市 ---------- */
  const destinationSheet = container.querySelector("#destinationSheetOverlay");
  const destCityInput = container.querySelector("#fDestinationCity");
  const destStatus = container.querySelector("#destinationStatus");
  const destSaveBtn = container.querySelector("#btnSaveDestination");
  let geocodedDestination = null;

  function openDestinationSheet() {
    destCityInput.value = trip.destination?.name || "";
    geocodedDestination = trip.destination || null;
    destStatus.innerHTML = "";
    destStatus.className = "verify-status";
    destSaveBtn.disabled = !geocodedDestination;
    destSaveBtn.textContent = geocodedDestination ? "儲存" : "先定位城市";
    destinationSheet.classList.add("show");
  }
  destCityInput.addEventListener("input", () => {
    geocodedDestination = null;
    destStatus.innerHTML = "";
    destStatus.className = "verify-status";
    destSaveBtn.disabled = true;
    destSaveBtn.textContent = "先定位城市";
  });
  container.querySelector("#btnGeocodeDestination").addEventListener("click", async () => {
    const cityName = destCityInput.value.trim();
    if (!cityName) {
      destStatus.className = "verify-status fail";
      destStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 請先輸入城市名稱`;
      return;
    }
    destStatus.className = "verify-status loading";
    destStatus.innerHTML = `<div class="spinner"></div> 正在定位城市…`;
    try {
      const result = await geocodeCity(cityName);
      if (!result) {
        destStatus.className = "verify-status fail";
        destStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 找不到這個城市，請換個名稱試試`;
        return;
      }
      geocodedDestination = result;
      destStatus.className = "verify-status ok";
      destStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 已定位：${result.name}${result.country ? "，" + result.country : ""}`;
      destSaveBtn.disabled = false;
      destSaveBtn.textContent = "儲存";
    } catch (err) {
      console.error("[定位城市失敗]", err);
      destStatus.className = "verify-status fail";
      destStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 定位失敗，請檢查網路連線`;
    }
  });
  container.querySelector("#btnCancelDestination").addEventListener("click", () => destinationSheet.classList.remove("show"));
  destinationSheet.addEventListener("click", (e) => { if (e.target === destinationSheet) destinationSheet.classList.remove("show"); });
  destSaveBtn.addEventListener("click", async () => {
    if (!geocodedDestination) return;
    await updateTrip(currentTripId, {
      destination: { name: geocodedDestination.name, lat: geocodedDestination.lat, lon: geocodedDestination.lon },
    });
    trip.destination = { name: geocodedDestination.name, lat: geocodedDestination.lat, lon: geocodedDestination.lon };
    destinationSheet.classList.remove("show");
    renderBody();
  });

  /* ---------- PIN 設定 ---------- */
  const pinSheet = container.querySelector("#pinSetSheetOverlay");
  const pinDigits = [0, 1, 2, 3].map((i) => container.querySelector(`#pinDigit${i}`));
  pinDigits.forEach((input, i) => {
    input.addEventListener("input", () => {
      input.value = input.value.replace(/\D/g, "").slice(0, 1);
      if (input.value && i < 3) pinDigits[i + 1].focus();
    });
    input.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !input.value && i > 0) pinDigits[i - 1].focus();
    });
  });
  function openPinSetSheet() {
    pinDigits.forEach((d) => (d.value = ""));
    pinSheet.classList.add("show");
    pinDigits[0].focus();
  }
  container.querySelector("#btnCancelPinSet").addEventListener("click", () => pinSheet.classList.remove("show"));
  pinSheet.addEventListener("click", (e) => { if (e.target === pinSheet) pinSheet.classList.remove("show"); });
  container.querySelector("#btnSavePinSet").addEventListener("click", async () => {
    const pin = pinDigits.map((d) => d.value).join("");
    if (pin.length !== 4) {
      alert("請輸入完整 4 位數字");
      return;
    }
    const pinHash = await hashPin(pin);
    await updateTrip(currentTripId, { "security.bookingsPinHash": pinHash, "security.pinUpdatedAt": new Date() });
    trip.security = { ...(trip.security || {}), bookingsPinHash: pinHash };
    pinSheet.classList.remove("show");
    renderBody();
  });

  /* ---------- 邀請連結 ---------- */
  async function copyInviteLink() {
    try {
      await navigator.clipboard.writeText(inviteLink);
      alert("邀請連結已複製！貼給旅伴即可。\n\n" + inviteLink);
    } catch {
      prompt("複製這個連結貼給旅伴：", inviteLink);
    }
  }

  /* ---------- 封存 ---------- */
  async function toggleArchive() {
    const newStatus = trip.status === "archived" ? "active" : "archived";
    const msg = newStatus === "archived" ? "確定要封存這趟旅程嗎？" : "確定要把這趟旅程恢復成進行中嗎？";
    if (!confirm(msg)) return;
    await updateTrip(currentTripId, { status: newStatus });
    trip.status = newStatus;
    renderBody();
    if (newStatus === "archived") {
      alert("已封存，回到「我的旅程」可以在已封存分頁看到它。");
      gotoRoute("#/trips", null);
    }
  }

  /* ---------- 複製旅程 ----------
   * 現在的成員身份是裝置本地綁定，帳號系統上線前，舊旅程的成員沒辦法平滑「搬家」。
   * 這裡先提供一個簡單版本：複製行程、住宿、機票、租車、票券憑證到一趟全新的旅程，
   * 你自己會是新旅程唯一的成員（主揪），其他旅伴要用新的邀請連結重新加入。
   * 記帳、日誌、準備清單這些綁著「誰是誰」的資料，這個版本先不複製。
   */
  async function handleDuplicateTrip() {
    if (!confirm(`確定要複製「${trip.name}」嗎？\n\n會複製：行程、住宿、機票、租車、票券憑證\n不會複製：記帳、日誌、準備清單、成員（你會是新旅程唯一的成員，其他人要重新加入）`)) return;
    const row = body.querySelector("#rowDuplicate");
    const originalHtml = row.innerHTML;
    row.innerHTML = `<div class="spinner"></div><div class="row-text"><div class="row-title">複製中，請稍候…</div></div>`;
    try {
      const newTripId = await duplicateTripCore(currentTripId, uid, me?.name || "主揪", me?.avatarValue || "🐰");
      alert("複製完成！已經幫你切換到新旅程，記得去邀請旅伴重新加入。");
      setState({ currentTripId: newTripId, currentMemberId: getBoundMemberId(newTripId) });
      gotoRoute("#/settings", newTripId);
    } catch (err) {
      console.error("[複製旅程失敗]", err);
      alert("複製失敗，請檢查網路連線後再試一次。");
      row.innerHTML = originalHtml;
    }
  }

  /* ---------- 刪除 ---------- */
  async function confirmDelete() {
    const typed = prompt(`這個動作無法復原，會刪除這趟旅程的所有資料（行程、預訂、記帳、日誌、準備、成員）。\n\n請輸入行程名稱「${trip.name}」確認刪除：`);
    if (typed !== trip.name) {
      if (typed !== null) alert("輸入的名稱不符，已取消刪除。");
      return;
    }
    try {
      await deleteTripCompletely(currentTripId, uid);
      alert("已刪除這趟旅程。");
      gotoRoute("#/trips", null);
    } catch (err) {
      console.error("[刪除旅程失敗]", err);
      alert("刪除失敗：" + (err.message || err.code || "未知錯誤"));
    }
  }

  renderBody();
}

// 時間軸（可拖曳排序）、新增/編輯行程面板（含地點驗證模擬、住宿快選、待辦清單）。


const CATEGORY_META = {
  transit: { label: "交通", icon: "fa-bus", cssVar: "--cat-transit" },
  spot: { label: "景點", icon: "fa-mountain-sun", cssVar: "--cat-spot" },
  food: { label: "美食", icon: "fa-utensils", cssVar: "--cat-food" },
  stay: { label: "住宿", icon: "fa-bed", cssVar: "--cat-stay" },
};
const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"];

function isoDateRange(start, end) {
  if (!start || !end) return [];
  const dates = [];
  let cur = new Date(start + "T00:00:00");
  const last = new Date(end + "T00:00:00");
  while (cur <= last) {
    dates.push(localISODate(cur));
    cur.setDate(cur.getDate() + 1);
  }
  return dates;
}
function formatMD(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return `${d.getMonth() + 1}/${d.getDate()}`;
}
function weekdayLabel(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  return WEEKDAY_LABELS[d.getDay()];
}
function truncate(text, len) {
  if (!text) return "";
  return text.length > len ? text.slice(0, len) + "..." : text;
}
