<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Send Trip Pay</title>
<meta name="theme-color" content="#F7F4EB">

<!-- PWA：加到主畫面用 -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Send Trip Pay">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
/*
  design tokens
  這份檔案只放「設計語言」的變數，不寫任何元件樣式。
  之後要調整整體配色/字體，只需要改這裡。
*/
:root{
  /* 大地色系 */
  --cream: #F7F4EB;
  --cream-dark: #EFE9D8;
  --sage-light: #E0E5D5;
  --sage: #A8B89A;
  --sage-dark: #7A8B6C;
  --earth-light: #D4C4A8;
  --earth: #B8956A;
  --earth-dark: #8B6F4E;
  --ink: #4A4438;
  --ink-soft: #8A8272;
  --white: #FFFDF8;
  --danger: #C97B63;
  --warn: #D98A5F;
  --warn-bg: #FBEADD;
  --ok: #5F9A6F;

  /* 行程分類色 */
  --cat-transit: #7B9EAD;
  --cat-spot: #7FA98B;
  --cat-food: #E0A458;
  --cat-stay: #B08BBB;
  --cat-shop: #C97B63;

  /* 天氣卡專屬例外色 */
  --sky: #5FA8D3;
  --sky-dark: #3D7DA6;

  /* 字體 */
  --font-heading: 'Zen Maru Gothic', sans-serif;
  --font-body: 'M PLUS Rounded 1c', sans-serif;

  /* 陰影（貼紙感：偏移實色陰影，不用模糊） */
  --shadow-sm: 2px 2px 0 var(--sage-light);
  --shadow-md: 3px 3px 0 var(--sage-light);
  --shadow-lg: 4px 4px 0 var(--sage-light);

  /* 圓角 */
  --radius-card: 20px;
  --radius-chip: 14px;
  --radius-sheet: 26px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(var(--sage-light) 1px, transparent 1px) 0 0/16px 16px,
    var(--cream);
  /* 手機 PWA 常見：避免橡皮筋回彈露出白底 */
  overscroll-behavior-y: none;
}

h1, h2, h3, .font-heading {
  font-family: var(--font-heading);
  margin: 0;
}

button, input, textarea {
  font-family: inherit;
}
/*
  components.css
  跨分頁共用的元件樣式：TripHeader、BottomNav、Card、BottomSheet、PinModal、Button。
  單一分頁專屬的樣式放 views.css，不要混在這裡。
*/

/* ===== App 外殼 ===== */
#app-root{
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  max-width: 480px;      /* 手機優先；桌機瀏覽時置中並限制寬度，不做響應式跑版設計 */
  margin: 0 auto;
  position: relative;
}

/* ===== Trip Header（sticky，六大分頁共用） ===== */
.trip-header{
  padding: 14px 18px 12px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: var(--cream-dark);
  border-bottom: 2px dashed var(--sage-light);
  position: sticky;
  top: 0;
  z-index: 3;
}
.trip-header .trip-cover{
  width: 42px; height: 42px; border-radius: 50%;
  background: var(--sage-light);
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-size: 19px;
  box-shadow: var(--shadow-sm);
  border: 2px solid var(--white);
  overflow: hidden;
}
.trip-header .trip-cover img{ width:100%; height:100%; object-fit:cover; }
.trip-header .trip-meta{ flex: 1; min-width: 0; }
.trip-header .trip-title{
  font-size: 14px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.trip-header .trip-dates{ font-size: 10.5px; color: var(--ink-soft); margin-top: 2px; }
.trip-header .header-right{ display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.trip-header .icon-btn{
  width: 28px; height: 28px; border-radius: 50%;
  color: var(--white); display: flex; align-items: center; justify-content: center;
  font-size: 12px; border: none; cursor: pointer;
}
.trip-header .icon-btn.switch-trip{ background: var(--earth); box-shadow: 2px 2px 0 var(--earth-dark); }
.trip-header .icon-btn.settings{ background: var(--sage-dark); box-shadow: 2px 2px 0 var(--sage); }
.trip-header .icon-btn.host-only[hidden]{ display: none; }
.avatar-stack{ display: flex; cursor: pointer; }
.avatar-stack .as{
  width: 24px; height: 24px; border-radius: 50%;
  border: 2px solid var(--white); margin-left: -7px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; background: var(--sage-light); overflow: hidden;
}
.avatar-stack .as:first-child{ margin-left: 0; }
.avatar-stack .as img{ width:100%; height:100%; object-fit:cover; }

/* ===== Bottom Nav（六大分頁共用） ===== */
.bottom-nav{
  position: sticky;
  bottom: 0; left: 0; right: 0;
  height: 76px;
  background: var(--white);
  border-top: 2px dashed var(--sage-light);
  display: flex; justify-content: space-around; align-items: center;
  padding-bottom: 8px;
  z-index: 5;
}
.bottom-nav .nav-item{
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  color: var(--ink-soft); font-size: 10px; flex: 1;
  background: none; border: none; font-family: var(--font-body); cursor: pointer;
}
.bottom-nav .nav-item i{ font-size: 19px; }
.bottom-nav .nav-item.active{ color: var(--earth-dark); font-weight: 500; }
.bottom-nav .nav-item.active i{ background: var(--sage-light); padding: 6px 14px; border-radius: 14px; }

/* ===== 頁面主體容器 ===== */
.view-body{
  flex: 1;
  overflow-y: auto;
  padding: 0 20px 24px;
}

/* ===== Card（貼紙感白卡，各分頁列表項目共用基底） ===== */
.card{
  background: var(--white);
  border-radius: var(--radius-card);
  padding: 14px 16px;
  box-shadow: var(--shadow-md);
}

/* ===== 按鈕 ===== */
.btn{
  font-family: var(--font-heading);
  font-size: 14px; font-weight: 500;
  border-radius: 16px;
  cursor: pointer;
  padding: 13px;
  border: none;
}
.btn:active{ transform: scale(0.97); }
.btn-primary{ background: var(--earth); color: var(--white); box-shadow: 3px 3px 0 var(--earth-dark); }
.btn-primary:disabled{ opacity: 0.45; box-shadow: none; cursor: not-allowed; }
.btn-outline{ background: transparent; color: var(--sage-dark); border: 2px solid var(--sage-dark); }
.btn-danger-outline{ background: transparent; color: var(--danger); border: 2px solid var(--danger); }
.btn-dashed{
  width: 100%; padding: 14px; border-radius: 18px;
  border: 2px dashed var(--sage-dark); background: transparent;
  color: var(--sage-dark); font-family: var(--font-heading); font-size: 14px; font-weight: 500;
  cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
}
.btn-row{ display: flex; gap: 10px; }
.btn-row .btn{ flex: 1; }
.btn-row .btn.primary-weight{ flex: 2; }

/* ===== Bottom Sheet（新增/編輯表單、詳情面板共用外殼） ===== */
.sheet-overlay{
  position: fixed; inset: 0;
  background: rgba(74,68,56,0.4);
  display: none; align-items: flex-end; justify-content: center;
  z-index: 50;
}
.sheet-overlay.show{ display: flex; }
.sheet{
  width: 100%; max-width: 480px;
  background: var(--cream);
  border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
  padding: 10px 22px 28px;
  max-height: 90vh;
  overflow-y: auto;
}
.sheet-handle{ width: 40px; height: 4px; background: var(--sage-light); border-radius: 4px; margin: 0 auto 14px; }
.sheet-title{ font-size: 16px; margin: 0 0 16px; text-align: center; }
.field-label{ font-size: 12px; color: var(--ink-soft); display: block; margin: 0 0 8px; font-weight: 500; }
.field-hint{ font-size: 10.5px; color: var(--ink-soft); margin: -10px 0 16px; }
.text-input, .textarea-input{
  width: 100%; padding: 11px 14px; border-radius: 14px;
  border: 2px solid var(--sage-light); background: var(--white);
  font-family: var(--font-body); font-size: 13.5px; color: var(--ink);
  margin-bottom: 16px;
}
.text-input:focus, .textarea-input:focus{ outline: none; border-color: var(--earth); }
.textarea-input{ resize: none; min-height: 70px; }

/* ===== PIN Modal（機票/住宿編輯、個人花費共用） ===== */
.pin-overlay{
  position: fixed; inset: 0;
  background: rgba(74,68,56,0.4);
  display: none; align-items: center; justify-content: center;
  z-index: 60;
}
.pin-overlay.show{ display: flex; }
.pin-modal{
  width: 280px; background: var(--cream); border-radius: 24px;
  padding: 24px 20px; text-align: center; box-shadow: var(--shadow-lg);
}
.pin-modal .pin-icon{
  width: 52px; height: 52px; margin: 0 auto 12px;
  background: var(--white); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; color: var(--earth-dark); box-shadow: var(--shadow-sm);
}
.pin-modal h3{ font-size: 15px; margin: 0 0 4px; }
.pin-modal p{ font-size: 12px; color: var(--ink-soft); margin: 0 0 16px; }
.pin-dots{ display: flex; justify-content: center; gap: 10px; margin-bottom: 18px; }
.pin-dots .dot{ width: 12px; height: 12px; border-radius: 50%; background: var(--sage-light); border: 2px solid var(--sage); }
.pin-dots .dot.filled{ background: var(--earth); border-color: var(--earth-dark); }
.pin-pad{ display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; }
.pin-key{
  padding: 13px 0; border-radius: 14px; background: var(--white); border: none;
  font-size: 16px; font-family: var(--font-heading); color: var(--ink); cursor: pointer;
  box-shadow: var(--shadow-sm);
}
.pin-key:active{ transform: scale(0.95); }
.pin-error{ color: var(--danger); font-size: 11.5px; margin-top: 12px; }
.pin-forgot{ display: block; width: 100%; margin-top: 14px; background: none; border: none; color: var(--sage-dark); font-size: 11.5px; cursor: pointer; text-decoration: underline; }
.pin-cancel{ margin-top: 10px; background: none; border: none; color: var(--ink-soft); font-size: 12px; cursor: pointer; }

/* ===== 共用燈箱（圖片全螢幕瀏覽） ===== */
.lightbox-overlay{
  position: fixed; inset: 0; background: rgba(0,0,0,0.92);
  display: none; align-items: center; justify-content: center;
  z-index: 100;
}
.lightbox-overlay.show{ display: flex; }
.lightbox-img{ max-width: 92vw; max-height: 85vh; object-fit: contain; border-radius: 8px; }
.lightbox-close{
  position: absolute; top: 16px; right: 16px; width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.15); color: var(--white); border: none; font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.lightbox-prev, .lightbox-next{
  position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.15); color: var(--white); border: none; font-size: 18px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.lightbox-prev{ left: 12px; }
.lightbox-next{ right: 12px; }
.lightbox-counter{
  position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
  color: var(--white); font-size: 12px; background: rgba(0,0,0,0.4);
  padding: 4px 12px; border-radius: 10px;
}
/*
  views.css
  單一分頁專屬的樣式放這裡，依分頁用註解區隔。
  目前是骨架階段，先放一個通用的「待實作」佔位樣式；
  後續每完成一個分頁，就在這份檔案裡新增對應區塊
  （例如 /* ===== 行程頁 ===== 、/* ===== 記帳頁 ===== ）。
*/

.placeholder-view{
  padding: 60px 30px;
  text-align: center;
  color: var(--ink-soft);
}
.placeholder-view i{
  font-size: 40px;
  color: var(--sage-light);
  margin-bottom: 12px;
  display: block;
}
.placeholder-view p{
  font-size: 14px;
  line-height: 1.7;
}

/* ===== 身份綁定畫面 ===== */
.identity-view{ padding: 40px 24px 24px; text-align: center; }
.identity-view .id-badge{
  width: 88px; height: 88px; margin: 0 auto 12px;
  background: var(--white); border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; box-shadow: var(--shadow-md);
  border: 3px dashed var(--earth-light);
}
.identity-view h1{ font-size: 20px; margin: 0 0 4px; color: var(--earth-dark); }
.identity-view .sub{ color: var(--ink-soft); font-size: 14px; margin: 0 0 28px; }
.member-grid{ display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-bottom: 20px; }
.member-pick{
  background: var(--white); border-radius: 20px; padding: 14px 8px;
  box-shadow: var(--shadow-sm); cursor: pointer; border: none;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.member-pick:active{ transform: scale(0.95); }
.member-pick .avatar{
  width: 52px; height: 52px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; font-size: 24px;
}
.member-pick span{ font-size: 13px; font-weight: 500; color: var(--ink); }
.divider-line{ display: flex; align-items: center; gap: 10px; color: var(--ink-soft); font-size: 12px; margin: 8px 0 20px; }
.divider-line::before, .divider-line::after{ content: ''; flex: 1; border-top: 2px dashed var(--sage-light); }
.new-member-card{ background: var(--white); border-radius: 20px; padding: 18px; box-shadow: var(--shadow-lg); text-align: left; }
.avatar-row{ display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.avatar-opt{
  width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 20px; border: 2px solid transparent; cursor: pointer; background: var(--cream);
}
.avatar-opt.selected{ border-color: var(--earth); background: var(--earth-light); }

/* ===== 成員頁 ===== */
.member-card{
  display: flex; align-items: center; gap: 12px; background: var(--white); border-radius: 20px;
  padding: 12px 14px; margin-bottom: 12px; box-shadow: var(--shadow-md); cursor: pointer;
}
.member-card:active{ transform: scale(0.98); }
.m-avatar{
  width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 24px; flex: 0 0 auto; position: relative; background: var(--sage-light);
}
.m-avatar .host-star{
  position: absolute; bottom: -2px; right: -2px; width: 20px; height: 20px; border-radius: 50%;
  background: var(--earth); color: var(--white); font-size: 10px; display: flex; align-items: center; justify-content: center;
  border: 2px solid var(--white);
}
.m-info{ flex: 1; }
.m-name{ font-size: 15px; font-weight: 500; }
.m-role{ font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.m-role.host{ color: var(--earth-dark); font-weight: 500; }
.m-edit-icon{ color: var(--sage-dark); font-size: 16px; }

.section-note{ font-size: 11px; color: var(--ink-soft); text-align: center; margin: 16px 0 6px; line-height: 1.6; }

.edit-avatar-preview{
  width: 120px; height: 120px; border-radius: 50%; margin: 0 auto 18px; background: var(--sage-light);
  display: flex; align-items: center; justify-content: center; font-size: 48px;
  box-shadow: var(--shadow-md); border: 3px solid var(--white); position: relative;
  background-size: cover; background-repeat: no-repeat; user-select: none;
}
.edit-avatar-preview.draggable{ cursor: grab; }
.edit-avatar-preview.draggable.dragging{ cursor: grabbing; }
.preview-emoji{ pointer-events: none; }
.avatar-drag-hint{
  position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.6); color: var(--white); font-size: 9px; padding: 2px 8px;
  border-radius: 8px; white-space: nowrap; pointer-events: none;
}

.avatar-source-tabs{ display: flex; gap: 8px; margin-bottom: 14px; }
.as-tab{
  flex: 1; text-align: center; padding: 9px; border-radius: 14px; font-size: 12px; font-weight: 500;
  background: var(--white); color: var(--ink-soft); cursor: pointer; box-shadow: var(--shadow-sm);
}
.as-tab.active{ background: var(--sage); color: var(--white); box-shadow: 2px 2px 0 var(--sage-dark); }

.avatar-library-panel{ display: block; }
.avatar-library-panel.hidden{ display: none; }
.lib-grid{ display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; margin-bottom: 16px; }
.lib-grid .a-opt{
  aspect-ratio: 1; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-size: 17px; cursor: pointer; border: 2px solid transparent; background: var(--white);
}
.lib-grid .a-opt.selected{ border-color: var(--earth); background: var(--earth-light); }

.upload-panel{ display: none; text-align: left; }
.upload-panel.show{ display: block; }

.sheet-btn-row{ display: flex; gap: 10px; margin-top: 6px; }
.btn-danger-text{
  width: 100%; text-align: center; padding: 10px; background: none; border: none; color: var(--danger);
  font-size: 13px; margin-top: 14px; cursor: pointer; font-family: var(--font-body);
}

/* ===== 旅程設定頁 ===== */
.settings-view{ display: flex; flex-direction: column; min-height: 100vh; }
.settings-topbar{ padding: 20px 20px 6px; display: flex; align-items: center; gap: 12px; }
.back-btn{
  width: 32px; height: 32px; border-radius: 50%; background: var(--white); box-shadow: var(--shadow-sm);
  border: none; display: flex; align-items: center; justify-content: center; color: var(--ink-soft); cursor: pointer;
}
.settings-topbar h2{ font-size: 18px; margin: 0; color: var(--earth-dark); }
.settings-body{ flex: 1; padding: 14px 20px 40px; }

.settings-section{ margin-bottom: 22px; }
.settings-section .sec-label{ font-size: 12px; color: var(--ink-soft); font-weight: 500; margin-bottom: 8px; padding-left: 4px; }
.settings-card{ background: var(--white); border-radius: 18px; box-shadow: var(--shadow-md); overflow: hidden; }
.settings-row{ display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; }
.settings-row + .settings-row{ border-top: 1px solid var(--cream-dark); }
.settings-row i.leading{ width: 20px; text-align: center; color: var(--sage-dark); font-size: 15px; }
.settings-row .row-text{ flex: 1; min-width: 0; }
.row-title{ font-size: 13.5px; font-weight: 500; }
.row-sub{ font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
.row-value{ font-size: 12.5px; color: var(--ink-soft); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chevron{ color: var(--sage-dark); font-size: 13px; flex: 0 0 auto; }
.host-only-note{
  display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--earth-dark);
  background: var(--earth-light); padding: 6px 10px; border-radius: 10px; margin-top: 8px; width: fit-content;
}
.danger-row .row-title{ color: var(--danger); }
.danger-row i.leading{ color: var(--danger); }

.pin-input-row{ display: flex; gap: 10px; justify-content: center; margin-bottom: 22px; }
.pin-digit{
  width: 44px; height: 52px; text-align: center; font-size: 20px; border-radius: 14px; border: 2px solid var(--sage-light);
  background: var(--white); font-family: var(--font-heading); color: var(--ink);
}
.pin-digit:focus{ outline: none; border-color: var(--earth); }

/* ===== 我的旅程列表 ===== */
.trip-list-view{ padding: 24px 22px 100px; }
.tl-header h1{ font-size: 20px; }
.tl-header .sub{ display: block; font-size: 12px; color: var(--ink-soft); font-weight: 400; margin-top: 2px; font-family: var(--font-body); }
.seg-tabs{ display: flex; gap: 8px; margin: 16px 0 14px; }
.seg-tab{ padding: 8px 18px; border-radius: 14px; font-size: 13px; font-weight: 500; cursor: pointer; background: var(--white); color: var(--ink-soft); box-shadow: var(--shadow-sm); }
.seg-tab.active{ background: var(--sage); color: var(--white); box-shadow: 2px 2px 0 var(--sage-dark); }
.trip-card{ background: var(--white); border-radius: 22px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-lg); cursor: pointer; }
.trip-card:active{ transform: scale(0.98); }
.trip-top{ display: flex; gap: 14px; align-items: center; margin-bottom: 12px; }
.trip-cover-lg{ width: 54px; height: 54px; border-radius: 50%; background: var(--sage-light); display: flex; align-items: center; justify-content: center; font-size: 24px; flex: 0 0 auto; overflow: hidden; }
.trip-cover-lg img{ width: 100%; height: 100%; object-fit: cover; }
.trip-name{ font-size: 16px; font-weight: 500; }
.trip-date{ font-size: 12px; color: var(--ink-soft); margin-top: 3px; }

/* ===== 開團 Wizard ===== */
.wizard-view{ display: flex; flex-direction: column; min-height: calc(100vh - 0px); }
.wiz-header{ padding: 20px 20px 12px; }
.progress-row{ display: flex; gap: 6px; margin-bottom: 6px; }
.progress-seg{ flex: 1; height: 6px; border-radius: 4px; background: var(--sage-light); }

.wiz-body{ flex: 1; padding: 8px 20px 20px; }
.step-title{ font-size: 19px; margin: 6px 0 16px; }
.cover-grid{ display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; margin-bottom: 18px; }
.cover-opt{ aspect-ratio: 1; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 22px; cursor: pointer; border: 3px solid transparent; background: var(--white); box-shadow: var(--shadow-sm); }

.date-row{ display: flex; gap: 12px; }

.member-list{ display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }

.member-row .m-avatar{ width: 40px; height: 40px; border-radius: 50%; background: var(--sage-light); display: flex; align-items: center; justify-content: center; font-size: 19px; flex: 0 0 auto; }

.member-row .m-remove{ width: 26px; height: 26px; border-radius: 50%; background: var(--cream-dark); border: none; color: var(--danger); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 auto; }
.add-member-card{ background: var(--white); border-radius: 18px; padding: 16px; box-shadow: var(--shadow-md); }
.flight-input-row{ display: flex; gap: 10px; }
.flight-input-row .text-input{ flex: 1; }
.wiz-footer{ padding: 14px 20px 20px; display: flex; gap: 10px; border-top: 2px dashed var(--sage-light); background: var(--cream); }

/* ===== 行程頁 ===== */
.schedule-view{ padding-top: 4px; }

.date-scroll{ display: flex; gap: 10px; padding: 12px 0 16px; overflow-x: auto; cursor: grab; user-select: none; }

.date-scroll::-webkit-scrollbar{ display: none; }
.date-card{ flex: 0 0 auto; width: 68px; background: var(--white); border-radius: 16px; padding: 8px 0 10px; text-align: center; box-shadow: var(--shadow-sm); cursor: pointer; border: 2px solid transparent; }

.date-card .day-badge{ display: inline-block; font-size: 9px; font-weight: 700; color: var(--white); background: var(--sage-dark); padding: 2px 8px; border-radius: 8px; margin-bottom: 6px; font-family: var(--font-heading); letter-spacing: 0.5px; }

.weather-card{ background: var(--sky); border-radius: 22px; padding: 16px 18px; color: var(--white); box-shadow: 4px 4px 0 var(--sky-dark); margin-bottom: 18px; }
.wc-top{ display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2px; }
.wc-loc{ font-size: 11px; opacity: 0.9; display: flex; align-items: center; gap: 5px; margin-bottom: 6px; }

.wc-temp-block{ text-align: right; }
.wc-temp{ font-family: var(--font-heading); font-size: 30px; font-weight: 700; line-height: 1; }

.wc-stats{ display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin: 14px 0; }

.section-label{ padding: 0 0 10px; font-size: 13px; color: var(--ink-soft); font-weight: 500; display: flex; align-items: center; gap: 6px; }

.timeline{ padding-bottom: 4px; }
.t-item{ display: flex; gap: 10px; margin-bottom: 12px; align-items: stretch; }
.t-item.dragging{ opacity: 0.4; }
.t-drag{ display: flex; align-items: center; color: var(--sage-light); cursor: grab; padding-top: 2px; font-size: 16px; }
.t-time{ width: 40px; flex: 0 0 auto; font-size: 12px; color: var(--ink-soft); padding-top: 14px; font-weight: 500; }
.t-card{ flex: 1; background: var(--white); border-radius: 18px; padding: 12px 14px; box-shadow: var(--shadow-sm); cursor: pointer; min-width: 0; }
.t-cat{ display: inline-block; font-size: 10px; padding: 2px 9px; border-radius: 8px; color: var(--white); font-family: var(--font-heading); margin-bottom: 6px; }
.t-card .t-title{ font-size: 14px; font-weight: 500; }

.t-note{ margin-top: 7px; font-size: 11px; color: var(--warn); background: var(--warn-bg); padding: 4px 9px; border-radius: 8px; display: flex; align-items: center; gap: 5px; }

/* 新增/編輯行程面板 */
.cat-picker{ display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 16px; }
.cat-opt{ padding: 10px 4px; border-radius: 14px; text-align: center; cursor: pointer; border: 2px solid transparent; background: var(--white); color: var(--ink-soft); font-size: 11.5px; font-weight: 500; }

.hotel-quickpick{ display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
.hq-chip{ padding: 8px 12px; border-radius: 12px; background: var(--white); border: 2px solid var(--cat-stay); color: var(--cat-stay); font-size: 11.5px; cursor: pointer; display: flex; align-items: center; gap: 6px; }

.time-row{ display: flex; gap: 12px; }

.loc-input-row{ display: flex; gap: 8px; }

.todo-row{ display: flex; align-items: center; gap: 10px; background: var(--white); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; }
.todo-check{ width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--sage); flex: 0 0 auto; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 11px; }

.todo-check i{ display: none; }
.todo-check.checked i{ display: inline; }
.todo-text-input{ border: none; background: none; flex: 1; font-size: 13px; padding: 0; margin: 0; font-family: var(--font-body); color: var(--ink); }
.todo-remove{ color: var(--ink-soft); font-size: 12px; cursor: pointer; }

/* ===== 預訂頁 ===== */
.subtabs{ display: flex; gap: 6px; padding: 4px 0 14px; overflow-x: auto; }
.subtabs::-webkit-scrollbar{ display: none; }
.subtab{ flex: 0 0 auto; padding: 7px 15px; border-radius: 14px; font-size: 12.5px; font-weight: 500; background: var(--white); color: var(--ink-soft); box-shadow: var(--shadow-sm); cursor: pointer; display: flex; align-items: center; gap: 6px; }

.flight-countdown{ background: var(--earth); border-radius: 20px; padding: 14px 18px; color: var(--white); margin: 4px 0 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 4px 4px 0 var(--earth-light); }

.lock-badge{ font-size: 10px; background: rgba(255,255,255,0.25); padding: 3px 8px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; }

.flight-section-label{ font-size: 12px; color: var(--ink-soft); font-weight: 500; margin: 0 0 8px; }

/* 機票卡片 v2 — 參照登機證風格 */
.boarding-pass-v2{ background: var(--white); border-radius: 20px; padding: 22px 20px; margin-bottom: 16px; box-shadow: var(--shadow-lg); cursor: pointer; }
.bp2-head{ display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.bp2-airline{ font-size: 13px; color: var(--ink-soft); }
.bp2-editbadge{ font-size: 10px; background: var(--cream-dark); color: var(--ink-soft); padding: 3px 9px; border-radius: 8px; display: inline-flex; align-items: center; gap: 4px; }
.bp2-flightnum{ font-family: var(--font-heading); font-size: 34px; font-weight: 700; letter-spacing: 3px; text-align: center; color: var(--ink); margin-bottom: 18px; }

.bp2-side{ text-align: center; min-width: 0; }
.bp2-code{ font-family: var(--font-heading); font-size: 24px; font-weight: 700; color: var(--ink); line-height: 1.2; }
.bp2-time{ font-size: 14px; color: var(--ink-soft); margin: 4px 0 10px; font-weight: 500; }

.bp2-mid{ text-align: center; padding: 0 8px; min-width: 64px; }
.bp2-duration{ font-size: 10px; color: var(--ink-soft); margin-bottom: 8px; white-space: nowrap; }
.bp2-line-row{ display: flex; align-items: center; gap: 4px; margin: 8px 0; }
.bp2-dash-seg{ width: 16px; height: 0; border-top: 2px dashed var(--sage-dark); display: inline-block; }
.bp2-plane-badge{
  width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
  background: var(--white); color: var(--sky-dark); font-size: 13px;
  display: flex; align-items: center; justify-content: center;
  box-shadow: var(--shadow-sm);
}
.bp2-date{ font-size: 10px; color: var(--ink-soft); margin-top: 4px; white-space: nowrap; }
.bp2-info-row{ display: flex; align-items: center; border-top: 1px dashed var(--sage-light); padding-top: 12px; }
.bp2-info{ flex: 1; text-align: center; font-size: 13px; font-weight: 500; color: var(--ink); }
.bp2-info-label{ display: block; font-size: 9.5px; color: var(--ink-soft); font-weight: 400; margin-bottom: 4px; letter-spacing: 0.5px; }

.hotel-card{ background: var(--white); border-radius: 20px; overflow: hidden; margin-bottom: 16px; box-shadow: var(--shadow-lg); cursor: pointer; }
.hotel-photo{ height: 150px; background: linear-gradient(135deg, var(--cat-stay), #D4B8DE); display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 32px; position: relative; background-size: cover; }
.hotel-lock{ position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.25); color: var(--white); font-size: 11px; padding: 5px 10px; border-radius: 10px; display: flex; align-items: center; gap: 4px; }

.cover-position-editor{
  position: relative; height: 190px; border-radius: 16px; overflow: hidden; margin-bottom: 16px;
  cursor: grab; background-size: cover; background-repeat: no-repeat; background-color: var(--cream-dark);
  user-select: none; touch-action: none;
}

  border-radius: 10px; pointer-events: none; white-space: nowrap;
}
.hotel-body{ padding: 14px 16px; }
.hotel-name{ font-size: 15px; font-weight: 500; margin-bottom: 8px; }
.hotel-row{ display: flex; justify-content: space-between; font-size: 12px; color: var(--ink-soft); margin-bottom: 6px; }

.hotel-address{ font-size: 12px; color: var(--cat-transit); margin-top: 8px; display: flex; align-items: center; gap: 5px; }
.split-box{ background: var(--cream-dark); border-radius: 14px; padding: 10px 14px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }

.split-section{ background: var(--white); border-radius: 14px; padding: 10px 14px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
.split-member-row{ display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.split-check{ width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--sage); flex: 0 0 auto; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--white); font-size: 11px; background: var(--sage); }

.split-check i{ display: inline; }
.split-check.unchecked i{ display: none; }

.car-card{ background: var(--white); border-radius: 20px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-lg); cursor: pointer; }

.car-point .cp-time{ font-size: 13px; font-weight: 500; }

.doc-item{ display: flex; align-items: center; gap: 12px; background: var(--white); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow-sm); cursor: pointer; }

.cat-chip-row{ display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.cat-chip{ padding: 7px 13px; border-radius: 12px; background: var(--white); border: 2px solid var(--sage-light); color: var(--ink-soft); font-size: 12px; cursor: pointer; }

/* ===== 記帳頁 ===== */
.dash-card{ background: var(--earth); border-radius: 22px; padding: 18px 20px; color: var(--white); margin-bottom: 18px; box-shadow: 4px 4px 0 var(--earth-light); }
.dash-total-label{ font-size: 11px; opacity: 0.85; }

.amount-display{ text-align: center; margin-bottom: 14px; }

<body>

  <div id="app-root"></div>

  <script type="module">
// ============================================================
// 這是「單檔測試版」——把多檔案專案合併成一個檔案方便快速測試。
// 正式部署到 GitHub Pages 請用 project.zip 裡的多檔案版本（好維護）。
// ============================================================

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore,
  enableIndexedDbPersistence,
  doc,
  getDoc,
  setDoc,
  updateDoc,
  deleteDoc,
  addDoc,
  collection,
  query,
  where,
  getDocs,
  onSnapshot,
  arrayUnion,
  arrayRemove,
  serverTimestamp,
  orderBy,
  writeBatch,
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
import {
  getStorage,
  ref,
  uploadBytes,
  getDownloadURL,
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-storage.js";
import {
  getAuth,
  signInAnonymously,
  onAuthStateChanged,
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

// state.js
// 沒有框架，所以自己寫一個最小的全域狀態 + pub-sub。
// 分兩種「記憶」：
//   1. state（記憶體內，重新整理就消失）：uid、目前正在看哪個 tripId/memberId
//   2. localStorage（裝置持久記憶）：這台裝置曾經認領過哪些 trip 的哪個 memberId
//      —— 這是跨裝置身份綁定機制的關鍵：members.boundUids 記人，
//         這裡的 localStorage 只是「這台裝置上次是誰在操作」的捷徑，
//         裝置記憶不見了也沒關係，回到身份綁定畫面重新點頭像認領即可。

const state = {
  uid: null,
  currentTripId: null,
  currentMemberId: null,
};

const listeners = new Set();

export function getState() {
  return state;
}

export function setState(partial) {
  Object.assign(state, partial);
  listeners.forEach((fn) => fn(state));
}

export function subscribe(fn) {
  listeners.add(fn);
  return () => listeners.delete(fn);
}

// ===== 裝置端「上次是誰」記憶（localStorage） =====
const BINDINGS_KEY = "tripPlanner.deviceBindings"; // { [tripId]: memberId }

function readBindings() {
  try {
    return JSON.parse(localStorage.getItem(BINDINGS_KEY) || "{}");
  } catch {
    return {};
  }
}

export function getBoundMemberId(tripId) {
  return readBindings()[tripId] || null;
}

export function setBoundMemberId(tripId, memberId) {
  const bindings = readBindings();
  bindings[tripId] = memberId;
  localStorage.setItem(BINDINGS_KEY, JSON.stringify(bindings));
}

export function getAllBoundTripIds() {
  return Object.keys(readBindings());
}
// firebase-config.js
// 用 CDN 上的 ES module 版本載入 Firebase v9+ 模組化 SDK，
// 完全不需要 npm install 或任何 build 工具，瀏覽器原生支援 <script type="module">。

const firebaseConfig = {
  apiKey: "AIzaSyDg75LPfTgY0_aZW1JEZj5y0SS5Mgfie5I",
  authDomain: "trip-planner-1b90d.firebaseapp.com",
  projectId: "trip-planner-1b90d",
  storageBucket: "trip-planner-1b90d.firebasestorage.app",
  messagingSenderId: "884074831600",
  appId: "1:884074831600:web:f44a520f915a1ff068ec35",
};

const app = initializeApp(firebaseConfig);

export const db = getFirestore(app);
export const storage = getStorage(app);
export const auth = getAuth(app);

// 離線持久化：手機網路不穩時，Firestore 讀寫先落地在本機，恢復連線後自動同步
enableIndexedDbPersistence(db).catch((err) => {
  if (err.code === "failed-precondition") {
    console.warn("離線持久化只能在單一分頁啟用，目前有多個分頁開著這個網站");
  } else if (err.code === "unimplemented") {
    console.warn("這個瀏覽器不支援離線持久化");
  }
});

/**
 * 確保有一個匿名登入的 uid，用來之後跟 members.boundUids 綁定。
 * 回傳一個 Promise<string>，resolve 出目前的 uid。
 */
export function ensureAnonymousAuth() {
  return new Promise((resolve, reject) => {
    const unsubscribe = onAuthStateChanged(auth, async (user) => {
      unsubscribe();
      if (user) {
        resolve(user.uid);
        return;
      }
      try {
        const result = await signInAnonymously(auth);
        resolve(result.user.uid);
      } catch (e) {
        reject(e);
      }
    });
  });
}

/**
 * 上傳一個檔案到 Storage，回傳可以直接用的下載網址。
 * @param {string} path - 例如 `trips/${tripId}/hotels/${hotelId}-cover.jpg`
 * @param {File} file
 * @returns {Promise<string>} downloadURL
 */
export async function uploadFile(path, file) {
  const storageRef = ref(storage, path);
  await uploadBytes(storageRef, file);
  return getDownloadURL(storageRef);
}
// firestore-service.js
// 把所有 Firestore 讀寫包成有意義的函式名稱，view 檔案不要直接 import firestore SDK，
// 一律透過這一層 —— 之後資料結構調整，只要改這裡，views 不用動。


/* ---------- users/{uid}：記錄這個 uid 是哪些 trip 的主揪 ---------- */

export async function getOwnedTripIds(uid) {
  const snap = await getDoc(doc(db, "users", uid));
  return snap.exists() ? snap.data().ownedTrips || [] : [];
}

export async function addOwnedTrip(uid, tripId) {
  const ref = doc(db, "users", uid);
  const snap = await getDoc(ref);
  if (snap.exists()) {
    await updateDoc(ref, { ownedTrips: arrayUnion(tripId) });
  } else {
    await setDoc(ref, { ownedTrips: [tripId] });
  }
}

/* ---------- trips/{tripId} ---------- */

export async function getTrip(tripId) {
  const snap = await getDoc(doc(db, "trips", tripId));
  return snap.exists() ? { id: snap.id, ...snap.data() } : null;
}

export async function getTripsByIds(tripIds) {
  const results = await Promise.all(tripIds.map((id) => getTrip(id)));
  return results.filter(Boolean);
}

/**
 * 建立一趟新旅程：trip 主文件 + 主揪的 member 文件。
 * @returns {Promise<{tripId:string, hostMemberId:string}>}
 */
export async function createTrip({
  name,
  coverEmojiOrUrl,
  isPhotoUrl,
  startDate,
  endDate,
  hostUid,
  hostName,
  hostAvatarValue,
}) {
  const tripRef = doc(collection(db, "trips"));
  await setDoc(tripRef, {
    name,
    coverType: isPhotoUrl ? "photo" : "emoji",
    coverValue: coverEmojiOrUrl,
    startDate,
    endDate,
    status: "active",
    createdAt: serverTimestamp(),
    hostUid: [hostUid],
    memberUids: [hostUid], // 給 Security Rules 判斷「這個 uid 是不是這趟旅程的人」用
    security: {
      bookingsPinHash: "", // 尚未設定 PIN 時是空字串；旅程設定頁會寫入真正的 SHA-256 雜湊
      pinUpdatedAt: serverTimestamp(),
    },
    currencies: { base: "TWD", enabled: [] },
    inviteLink: {
      token: cryptoRandomToken(),
      createdAt: serverTimestamp(),
    },
  });

  const hostMemberRef = await addDoc(collection(db, "trips", tripRef.id, "members"), {
    name: hostName,
    avatarType: "library",
    avatarValue: hostAvatarValue,
    isHost: true,
    boundUids: [hostUid],
    removed: false,
    joinedAt: serverTimestamp(),
  });

  await addOwnedTrip(hostUid, tripRef.id);

  return { tripId: tripRef.id, hostMemberId: hostMemberRef.id };
}

function cryptoRandomToken() {
  return Array.from(crypto.getRandomValues(new Uint8Array(12)))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

/* ---------- trips/{tripId}/members ---------- */

export async function getMembersOnce(tripId) {
  const q = query(
    collection(db, "trips", tripId, "members"),
    where("removed", "==", false),
    orderBy("joinedAt", "asc")
  );
  const snap = await getDocs(q);
  return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
}

/** @returns {Function} unsubscribe */
export function listenMembers(tripId, callback, onError) {
  const q = query(
    collection(db, "trips", tripId, "members"),
    where("removed", "==", false),
    orderBy("joinedAt", "asc")
  );
  return onSnapshot(
    q,
    (snap) => {
      callback(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    },
    (error) => {
      console.error("[listenMembers] 讀取成員失敗：", error);
      onError?.(error);
    }
  );
}

export async function createMember(tripId, { name, avatarType = "library", avatarValue, avatarPosition = null, isHost = false, boundUids = [] }) {
  const ref = await addDoc(collection(db, "trips", tripId, "members"), {
    name,
    avatarType,
    avatarValue,
    ...(avatarPosition ? { avatarPosition } : {}),
    isHost,
    boundUids,
    removed: false,
    joinedAt: serverTimestamp(),
  });
  if (boundUids.length) {
    await updateDoc(doc(db, "trips", tripId), { memberUids: arrayUnion(...boundUids) });
  }
  return ref.id;
}

/** 把目前 uid 加進某個 member 的 boundUids（認領身份） */
export async function claimMember(tripId, memberId, uid) {
  await updateDoc(doc(db, "trips", tripId, "members", memberId), {
    boundUids: arrayUnion(uid),
  });
  await updateDoc(doc(db, "trips", tripId), {
    memberUids: arrayUnion(uid),
  });
}

export async function updateMember(tripId, memberId, payload) {
  await updateDoc(doc(db, "trips", tripId, "members", memberId), payload);
}

export async function removeMember(tripId, memberId) {
  await updateDoc(doc(db, "trips", tripId, "members", memberId), {
    removed: true,
    removedAt: serverTimestamp(),
  });
}

/* ---------- 旅程刪除（遞迴清掉所有子集合） ---------- */

const TRIP_SUBCOLLECTIONS = [
  "schedule", "flights", "hotels", "carRentals", "documents",
  "expenses", "journalPosts", "planningItems", "members",
];

async function deleteSubcollection(tripId, name) {
  const snap = await getDocs(collection(db, "trips", tripId, name));
  if (snap.empty) return;
  // Firestore 一次 batch 最多 500 個操作，這裡的資料量不會超過，但保守起見還是分批。
  const docs = snap.docs;
  for (let i = 0; i < docs.length; i += 450) {
    const batch = writeBatch(db);
    docs.slice(i, i + 450).forEach((d) => batch.delete(d.ref));
    await batch.commit();
  }
}

/**
 * 完整刪除一趟旅程：先清掉所有子集合，再刪主文件，最後從主揪的 ownedTrips 移除。
 * @param {string} tripId
 * @param {string} hostUid
 */
export async function deleteTripCompletely(tripId, hostUid) {
  for (const name of TRIP_SUBCOLLECTIONS) {
    await deleteSubcollection(tripId, name);
  }
  await deleteDoc(doc(db, "trips", tripId));

  const userRef = doc(db, "users", hostUid);
  const userSnap = await getDoc(userRef);
  if (userSnap.exists()) {
    const remaining = (userSnap.data().ownedTrips || []).filter((id) => id !== tripId);
    await updateDoc(userRef, { ownedTrips: remaining });
  }
}

/* ---------- trips/{tripId}/flights（Wizard 步驟4，選填） ---------- */

export async function createFlight(tripId, payload) {
  await addDoc(collection(db, "trips", tripId, "flights"), {
    ...payload,
    createdAt: serverTimestamp(),
  });
}

/* ---------- trips/{tripId}/schedule ---------- */

/** @returns {Function} unsubscribe */
export function listenScheduleEvents(tripId, callback, onError) {
  const q = query(
    collection(db, "trips", tripId, "schedule"),
    orderBy("date", "asc"),
    orderBy("order", "asc")
  );

/**
 * 讓一個橫向捲動的容器可以用滑鼠「按住拖曳」捲動——
 * 瀏覽器原生只支援觸控滑動/捲軸拖曳，桌機滑鼠點擊拖曳內容不會捲動，
 * 這個函式補上這個手勢。
 * @param {HTMLElement} el
 */
export function enableDragScroll(el) {
  let isDown = false;
  let startX = 0;
  let scrollLeftStart = 0;
  let moved = false;

  el.addEventListener("mousedown", (e) => {
    isDown = true;
    moved = false;
    el.classList.add("dragging-scroll");
    startX = e.pageX;
    scrollLeftStart = el.scrollLeft;
  });

  window.addEventListener("mouseup", () => {
    isDown = false;
    el.classList.remove("dragging-scroll");
  });

  el.addEventListener("mousemove", (e) => {
    if (!isDown) return;
    e.preventDefault();
    const delta = e.pageX - startX;
    if (Math.abs(delta) > 4) moved = true;
    el.scrollLeft = scrollLeftStart - delta;
  });

  // 拖曳結束後如果確實有位移，攔截一次 click，避免被誤判成「點擊選日期」
  el.addEventListener(
    "click",
    (e) => {
      if (moved) {
        e.stopPropagation();
        e.preventDefault();
        moved = false;
      }
    },
    true
  );
}

/* ==================== 共用燈箱（圖片全螢幕瀏覽，左右可切換） ==================== */

let lightboxEl = null;
let lightboxPhotos = [];
let lightboxIndex = 0;
let lightboxTouchStartX = 0;

function ensureLightbox() {
  if (lightboxEl) return lightboxEl;
  lightboxEl = document.createElement("div");
  lightboxEl.id = "sharedLightbox";
  lightboxEl.className = "lightbox-overlay";
  lightboxEl.innerHTML = `
    <button class="lightbox-close" aria-label="關閉"><i class="fa-solid fa-xmark"></i></button>
    <button class="lightbox-prev" aria-label="上一張"><i class="fa-solid fa-chevron-left"></i></button>
    <img class="lightbox-img" src="" alt="">
    <button class="lightbox-next" aria-label="下一張"><i class="fa-solid fa-chevron-right"></i></button>
    <div class="lightbox-counter"></div>
  `;
  document.body.appendChild(lightboxEl);

  lightboxEl.querySelector(".lightbox-close").addEventListener("click", closeLightbox);
  lightboxEl.addEventListener("click", (e) => {
    if (e.target === lightboxEl) closeLightbox();
  });
  lightboxEl.querySelector(".lightbox-prev").addEventListener("click", () => stepLightbox(-1));
  lightboxEl.querySelector(".lightbox-next").addEventListener("click", () => stepLightbox(1));

  window.addEventListener("keydown", (e) => {
    if (!lightboxEl.classList.contains("show")) return;
    if (e.key === "Escape") closeLightbox();
    if (e.key === "ArrowLeft") stepLightbox(-1);
    if (e.key === "ArrowRight") stepLightbox(1);
  });

  lightboxEl.addEventListener("touchstart", (e) => {
    lightboxTouchStartX = e.touches[0].clientX;
  });
  lightboxEl.addEventListener("touchend", (e) => {
    const dx = e.changedTouches[0].clientX - lightboxTouchStartX;
    if (dx > 50) stepLightbox(-1);
    else if (dx < -50) stepLightbox(1);
  });

  return lightboxEl;
}

function renderLightboxImage() {
  lightboxEl.querySelector(".lightbox-img").src = lightboxPhotos[lightboxIndex];
  const multi = lightboxPhotos.length > 1;
  const counter = lightboxEl.querySelector(".lightbox-counter");
  counter.textContent = multi ? `${lightboxIndex + 1} / ${lightboxPhotos.length}` : "";
  counter.style.display = multi ? "block" : "none";
  lightboxEl.querySelector(".lightbox-prev").style.display = multi ? "flex" : "none";
  lightboxEl.querySelector(".lightbox-next").style.display = multi ? "flex" : "none";
}

function stepLightbox(delta) {
  lightboxIndex = (lightboxIndex + delta + lightboxPhotos.length) % lightboxPhotos.length;
  renderLightboxImage();
}

/**
 * 開啟燈箱瀏覽一組照片，支援左右切換（按鈕/鍵盤方向鍵/觸控滑動皆可）。
 * @param {string[]} photoUrls
 * @param {number} [startIndex]
 */
export function openLightbox(photoUrls, startIndex = 0) {
  if (!photoUrls?.length) return;
  ensureLightbox();
  lightboxPhotos = photoUrls;
  lightboxIndex = startIndex;
  renderLightboxImage();
  lightboxEl.classList.add("show");
}

export function closeLightbox() {
  lightboxEl?.classList.remove("show");
}

/* ==================== PIN 雜湊（瀏覽器內建 Web Crypto，不需要額外套件） ==================== */

/**
 * 把 PIN 碼字串雜湊成 SHA-256 十六進位字串，用來存進 Firestore，
 * 避免明碼存放。這不是完整的密碼學等級保護（沒有加 salt），
 * 但比明碼安全很多，符合這個 App 的信任等級（朋友揪團用）。
 * @param {string} pin
 * @returns {Promise<string>}
 */
export async function hashPin(pin) {
  const enc = new TextEncoder().encode(pin);
  const digest = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(digest))
    .map((b) => b.toString(16).padStart(2, "0"))
    .join("");
}

/* ==================== 即時匯率（Frankfurter，開源、免金鑰） ==================== */

let ratesCache = null; // { fetchedAt, rates: {JPY: 4.98, ...} }
// 2026-09 手動更新過一次的保底值，只在即時 API 抓不到時墊著用，不會是計算的主要來源。
const STATIC_FALLBACK_RATES = { JPY: 4.98, USD: 0.0314, KRW: 42.9, CNY: 0.211, THB: 1.05, EUR: 0.0276, HKD: 0.247 };
const RATES_CACHE_MS = 60 * 60 * 1000; // 快取 1 小時，避免每次打開面板都打 API

/**
 * 取得「1 台幣 = 多少外幣」的即時匯率表（跟舊的靜態表格式一致，方便直接替換）。
 * 抓失敗（離線、額度用完、TWD 剛好不在資料源裡）時會退回內建的估算值，不會讓功能整個壞掉。
 *
 * 注意：Frankfurter v2 的 /v2/rates 回傳的是「一維陣列」
 *   [{date, base, quote, rate}, ...]，不是舊版那種 {rates:{JPY:...}} 物件，
 *   這裡要手動轉成查詢表，不能直接把整包物件當 lookup 用（之前的版本就是踩到這個）。
 * @returns {Promise<Record<string, number>>}
 */
export async function fetchExchangeRates() {
  if (ratesCache && Date.now() - ratesCache.fetchedAt < RATES_CACHE_MS) {
    return ratesCache.rates;
  }
  try {
    const codes = Object.keys(STATIC_FALLBACK_RATES).join(",");
    const res = await fetch(`https://api.frankfurter.dev/v2/rates?base=twd&quotes=${codes}`);
    if (!res.ok) throw new Error("frankfurter response not ok");
    const rows = await res.json();
    if (!Array.isArray(rows)) throw new Error("frankfurter response format unexpected");
    const rates = Object.fromEntries(rows.map((row) => [row.quote, row.rate]));
    // 至少要有一個我們認識的幣別才採信，避免拿到空陣列或格式不對的回應
    const hasAny = Object.keys(STATIC_FALLBACK_RATES).some((c) => typeof rates[c] === "number");
    if (!hasAny) throw new Error("frankfurter response missing known currencies");
    const merged = { ...STATIC_FALLBACK_RATES, ...rates };
    ratesCache = { fetchedAt: Date.now(), rates: merged };
    return merged;
  } catch (err) {
    console.warn("[fetchExchangeRates] 即時匯率抓取失敗，改用內建估算值：", err);
    return STATIC_FALLBACK_RATES;
  }
}

/**
 * 用地名查經緯度（Open-Meteo 的免費 geocoding，不需要金鑰）。
 * @param {string} cityName
 * @returns {Promise<{name:string, lat:number, lon:number, country:string}|null>}
 */
export async function geocodeCity(cityName) {
  const res = await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cityName)}&count=1&language=zh&format=json`
  );
  if (!res.ok) throw new Error("geocoding request failed");
  const data = await res.json();
  const first = data.results?.[0];
  if (!first) return null;
  return { name: first.name, lat: first.latitude, lon: first.longitude, country: first.country };
}

/**
 * 查某個經緯度、某一天的天氣預報（Open-Meteo forecast API，不需要金鑰）。
 * 只支援大約未來 16 天內的日期，太遠的日期會回傳 null（前端要處理這種「還沒到預報範圍」的狀態）。
 * @param {number} lat
 * @param {number} lon
 * @param {string} dateStr - "YYYY-MM-DD"
 */
export async function fetchWeatherForDate(lat, lon, dateStr) {
  const res = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
      `&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,windspeed_10m_max,sunrise` +
      `&timezone=auto&start_date=${dateStr}&end_date=${dateStr}`
  );
  if (!res.ok) {
    // Open-Meteo 對「超出預報範圍的日期」不是回空結果，而是回 400 + {error:true, reason:"...out of allowed range..."}，
    // 這種情況要當成「還沒有預報資料」處理（回傳 outOfRange 標記），不能直接當成真的請求失敗去丟例外，
    // 不然畫面只會顯示 generic 的「讀取失敗」，蓋掉原本設計好的「此日期還不在預報範圍內」提示。
    let reason = "";
    try {
      const errBody = await res.json();
      reason = errBody?.reason || "";
    } catch {
      // 錯誤內容不是 JSON 就算了，reason 保持空字串
    }
    if (res.status === 400 && /out of allowed range/i.test(reason)) {
      return { outOfRange: true };
    }
    throw new Error(`weather request failed${reason ? `: ${reason}` : ` (HTTP ${res.status})`}`);
  }
  const data = await res.json();
  if (!data.daily || !data.daily.time || !data.daily.time.length) return null;
  return {
    weatherCode: data.daily.weathercode[0],
    tempMax: data.daily.temperature_2m_max[0],
    tempMin: data.daily.temperature_2m_min[0],
    rainChance: data.daily.precipitation_probability_max?.[0],
    windSpeed: data.daily.windspeed_10m_max?.[0],
    sunrise: data.daily.sunrise?.[0]?.split("T")[1],
  };
}

/* ==================== 地址驗證（OpenStreetMap Nominatim，免金鑰、免費） ==================== */

/**
 * 用地址/地點名稱查詢座標與正式地址，取代原本模擬用的 setTimeout。
 * 免金鑰、免綁信用卡，跟本專案其他即時資料（天氣、匯率、城市定位）走同一套「免費開源服務」哲學。
 *
 * 使用限制：Nominatim 官方 demo instance 的公平使用政策要求呼叫頻率不超過 1 次/秒，
 * 這裡是使用者手動按「驗證」才觸發一次，一般使用情境下不會踩到這個限制。
 * 準確度上，地標／飯店名稱通常沒問題，純門牌號碼在日本偶爾會抓不準，這是免費方案的已知取捨。
 * @param {string} query
 * @returns {Promise<{formattedAddress:string, lat:number, lon:number}|null>}
 */
export async function verifyLocation(query) {
  const res = await fetch(
    `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`,
    { headers: { "Accept-Language": "zh-TW,zh;q=0.9,ja;q=0.8,en;q=0.7" } }
  );
  if (!res.ok) throw new Error("nominatim request failed");
  const data = await res.json();
  const first = data?.[0];
  if (!first) return null;
  return { formattedAddress: first.display_name, lat: Number(first.lat), lon: Number(first.lon) };
}

/**
 * 把一個 Date 物件轉成「當地時區」的 YYYY-MM-DD 字串。
 *
 * 全站原本很多地方用 `date.toISOString().slice(0, 10)` 來取得日期字串，但
 * toISOString() 回傳的是 UTC 時間，台灣是 UTC+8，本地半夜 00:00~07:59 這段時間
 * 換算成 UTC 還停留在前一天，會導致「今天」判斷錯一天；同樣的手法拿來把
 * 旅程的日期範圍展開成每一天的陣列時，也會讓整段日期範圍集體往前錯移一天
 * （例如 12/1-12/9 的行程，展開後變成 11/30-12/8）。這裡統一改用本地時間的
 * 年/月/日組字串，不會有這個問題。
 * @param {Date} d
 * @returns {string}
 */
function localISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

/**

export function renderTripHeader({

// 通用 PIN 驗證/設定面板（大按鍵鍵盤版本）。
// 用在：預訂頁機票/住宿編輯鎖、旅程設定改 PIN、記帳結算頁個人 PIN。
//
// 用法：
//   mountPinModal(document.getElementById('app-root'));
//   openPinVerify({
//     title: '輸入 PIN 碼',
//     subtitle: '編輯機票／住宿資訊需要驗證',
//     checkPin: (value) => value === currentTripPin,   // 回傳 true/false
//     onSuccess: () => { ...解鎖編輯... },
//     onForgot: null, // 若不需要「忘記密碼」流程就不傳
//   });

const OVERLAY_ID = "sharedPinOverlay";
let pinState = { value: "", options: null };

export function mountPinModal(rootEl) {
  if (document.getElementById(OVERLAY_ID)) return; // 避免重複掛載
  const wrapper = document.createElement("div");
  wrapper.innerHTML = `
    <div class="pin-overlay" id="${OVERLAY_ID}">
      <div class="pin-modal">
        <div class="pin-icon"><i class="fa-solid fa-lock"></i></div>
        <h3 id="pinModalTitle">輸入 PIN 碼</h3>
        <p id="pinModalSubtitle"></p>
        <div class="pin-dots" id="pinModalDots">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>
        <div class="pin-pad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button class="pin-key" data-key="${n}">${n}</button>`).join("")}
          <div></div>
          <button class="pin-key" data-key="0">0</button>
          <button class="pin-key" data-key="del"><i class="fa-solid fa-delete-left"></i></button>
        </div>
        <div class="pin-error" id="pinModalError" style="display:none;"></div>
        <button class="pin-forgot" id="pinModalForgot" style="display:none;"></button>
        <button class="pin-cancel" id="pinModalCancel">取消</button>
      </div>
    </div>
  `;
  rootEl.appendChild(wrapper.firstElementChild);

  document.getElementById(OVERLAY_ID).addEventListener("click", (e) => {
    if (e.target.classList.contains("pin-key") || e.target.closest(".pin-key")) {
      const btn = e.target.closest(".pin-key");
      handleKey(btn.dataset.key);
    }
  });
  document.getElementById("pinModalCancel").addEventListener("click", closePinModal);
  document.getElementById("pinModalForgot").addEventListener("click", () => {
    pinState.options?.onForgot?.();
  });
}

function renderDots() {
  document.querySelectorAll(`#${OVERLAY_ID} .dot`).forEach((d, i) => {
    d.classList.toggle("filled", i < pinState.value.length);
  });
}

function handleKey(key) {
  if (key === "del") {
    pinState.value = pinState.value.slice(0, -1);
  } else if (pinState.value.length < 4) {
    pinState.value += key;
  }
  renderDots();
  if (pinState.value.length === 4) {
    setTimeout(submitPin, 150);
  }
}

async function submitPin() {
  const ok = pinState.options?.checkPin ? await pinState.options.checkPin(pinState.value) : true;
  if (ok) {
    closePinModal();
    pinState.options?.onSuccess?.(pinState.value);
  } else {
    const err = document.getElementById("pinModalError");
    err.textContent = pinState.options?.errorText || "PIN 碼不正確，請再試一次";
    err.style.display = "block";
    pinState.value = "";
    renderDots();
  }
}

/**
 * @param {Object} options
 * @param {string} options.title
 * @param {string} options.subtitle
 * @param {(value:string)=>(boolean|Promise<boolean>)} options.checkPin
 * @param {(value:string)=>void} options.onSuccess
 * @param {Function} [options.onForgot] - 有傳才顯示「忘記密碼」連結
 * @param {string} [options.forgotLabel]
 */
export function openPinVerify(options) {
  pinState = { value: "", options };
  document.getElementById("pinModalTitle").textContent = options.title || "輸入 PIN 碼";
  document.getElementById("pinModalSubtitle").textContent = options.subtitle || "";
  document.getElementById("pinModalError").style.display = "none";
  const forgotBtn = document.getElementById("pinModalForgot");
  if (options.onForgot) {
    forgotBtn.style.display = "block";
    forgotBtn.textContent = options.forgotLabel || "忘記密碼？用旅程共用 PIN 重置";
  } else {
    forgotBtn.style.display = "none";
  }
  renderDots();
  document.getElementById(OVERLAY_ID).classList.add("show");
}

export function closePinModal() {
  document.getElementById(OVERLAY_ID)?.classList.remove("show");
}
// components/avatar.js
// 全站共用的頭像顯示邏輯，取代之前各分頁各自處理 `member.avatarValue` 的寫法。
// 一個成員的頭像有兩種可能：avatarType === 'library'（emoji 字元）或
// 'upload'（Firebase Storage 圖片網址 + avatarPosition 顯示位置）。

/**
 * 給「圓形頭像方塊」用：回傳 inline style 字串（設定背景圖與位置），
 * 是照片就回傳有內容的 style，是 emoji 就回傳空字串。
 * @param {{avatarType?:string, avatarValue?:string, avatarPosition?:string}} member
 */
export function avatarBoxStyle(member) {
  if (member?.avatarType === "upload" && member.avatarValue) {
    return `background-image:url('${member.avatarValue}');background-size:cover;background-position:${member.avatarPosition || "center"};`;
  }
  return "";
}

/**
 * 給「圓形頭像方塊」用：回傳裡面要放的文字內容（emoji 或空字串——
 * 是照片的話內容留空，靠上面的 background-image 顯示）。
 * @param {{avatarType?:string, avatarValue?:string}} member
 */
export function avatarBoxContent(member) {
  if (member?.avatarType === "upload" && member.avatarValue) return "";
  return member?.avatarValue || "?";
}

/**
 * 給「一行文字裡面塞一個小 emoji 當前綴」這種場合用（例如「🐰 Peggy」）。
 * 上傳照片沒辦法塞進純文字裡，所以這種場合遇到照片頭像就不顯示前綴，只留名字。
 * @param {{avatarType?:string, avatarValue?:string}} member
 */
export function avatarInlinePrefix(member) {
  if (member?.avatarType === "upload" && member.avatarValue) return "";
  return member?.avatarValue ? member.avatarValue + " " : "";
}

function formatBytes(bytes) {

}
