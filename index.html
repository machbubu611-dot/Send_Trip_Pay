        <label class="field-label">大分類</label>
        <div class="cat-picker" id="catPicker">
          ${Object.entries(CATEGORY_META)
            .map(([key, meta]) => `<div class="cat-opt" data-cat="${key}"><i class="fa-solid ${meta.icon}"></i>${meta.label}</div>`)
            .join("")}
        </div>

        <div class="hotel-quickpick" id="hotelQuickpick"></div>

        <div class="time-row">
          <div><label class="field-label">時間</label><input type="time" class="text-input" id="fieldTime" value="10:00"></div>
          <div><label class="field-label">行程名稱</label><input type="text" class="text-input" id="fieldTitle" placeholder="例如：白色戀人公園"></div>
        </div>

        <label class="field-label">地點</label>
        <div class="loc-input-row">
          <input type="text" class="text-input" id="fieldLoc" placeholder="輸入地址或地標名稱">
          <button class="btn verify-btn" id="btnVerifyLoc">驗證</button>
        </div>
        <div class="verify-status" id="verifyStatus"></div>

        <label class="field-label">待辦事項 <span style="font-weight:400;color:var(--ink-soft);">· 純備忘</span></label>
        <div class="todo-list" id="todoList"></div>
        <button class="btn-dashed" id="btnAddTodo" style="margin-bottom:16px;"><i class="fa-solid fa-plus"></i> 新增待辦</button>

        <label class="field-label">重要備註 <span style="font-weight:400;color:var(--ink-soft);">· 外層只顯示前一小段</span></label>
        <textarea class="textarea-input" id="fieldNote" placeholder="例如：不可遲到、需事先預約"></textarea>

        <div class="btn-row">
          <button class="btn btn-danger-outline" id="btnDeleteEvent" style="display:none;">刪除</button>
          <button class="btn btn-outline" id="btnCancelEvent">取消</button>
          <button class="btn btn-primary primary-weight" id="btnSaveEvent" disabled>先驗證地點</button>
        </div>
      </div>
    </div>
  `;
}

/**
 * @param {HTMLElement} container
 * @param {{tripId:string, memberId:string, trip:Object}} ctx
 * @returns {Function} cleanup（router 在切換分頁時會呼叫）
 */
export function mountScheduleView(container, ctx) {
  const { tripId, memberId, trip } = ctx;
  const days = isoDateRange(trip.startDate, trip.endDate);
  const todayStr = localISODate(new Date());
  let selectedDate = days.includes(todayStr) ? todayStr : days[0] || null;

  let allEvents = [];
  let hotelsCache = null; // lazy load

  let editingEventId = null;
  let sheetTodos = [];
  let selectedCategory = null;
  let locVerified = false;
  let verifiedLocation = null; // { formattedAddress, lat, lon }
  let dragEl = null;

  const dateScrollEl = container.querySelector("#dateScroll");
  enableDragScroll(dateScrollEl);
  const timelineEl = container.querySelector("#timeline");
  const sectionLabelEl = container.querySelector("#sectionLabelText");
  const sheetOverlay = container.querySelector("#eventSheetOverlay");
  const catPicker = container.querySelector("#catPicker");
  const hotelQuickpick = container.querySelector("#hotelQuickpick");
  const fieldTime = container.querySelector("#fieldTime");
  const fieldTitle = container.querySelector("#fieldTitle");
  const fieldLoc = container.querySelector("#fieldLoc");
  const verifyStatus = container.querySelector("#verifyStatus");
  const todoListEl = container.querySelector("#todoList");
  const fieldNote = container.querySelector("#fieldNote");
  const saveBtn = container.querySelector("#btnSaveEvent");
  const deleteBtn = container.querySelector("#btnDeleteEvent");

  function renderDateScroll() {
    dateScrollEl.innerHTML = days
      .map(
        (d) => `
          <div class="date-card ${d === selectedDate ? "active" : ""}" data-date="${d}">
            <span class="day-badge">DAY ${days.indexOf(d) + 1}</span>
            <div class="d-date">${formatMD(d)}</div>
            <div class="d-dow">${weekdayLabel(d)}</div>
          </div>
        `
      )
      .join("");
    dateScrollEl.querySelectorAll(".date-card").forEach((card) => {
      card.addEventListener("click", () => {
        selectedDate = card.dataset.date;
        renderDateScroll();
        renderTimeline();
        updateWeatherCard(selectedDate);
      });
    });
  }

  /* ---------- 天氣卡（Open-Meteo，免金鑰） ---------- */
  let weatherRequestToken = 0;
  async function updateWeatherCard(dateStr) {
    const thisRequest = ++weatherRequestToken; // 避免使用者快速切日期時，舊的回應蓋掉新的畫面
    const destination = trip.destination;
    if (!destination) {
      container.querySelector("#wcLocText").textContent = "尚未設定目的地";
      container.querySelector("#wcCondText").textContent = "--";
      container.querySelector("#wcTemp").textContent = "--°";
      container.querySelector("#wcHilo").textContent = "-- / --";
      container.querySelector("#wcRain").textContent = "--%";
      container.querySelector("#wcWind").textContent = "--";
      container.querySelector("#wcSunrise").textContent = "--:--";
      container.querySelector("#wcNote").textContent = "去旅程設定頁設定目的地城市，就能看到這裡的即時天氣";
      return;
    }

    container.querySelector("#wcLocText").textContent = destination.name;
    container.querySelector("#wcCondText").textContent = "讀取中...";
    container.querySelector("#wcNote").textContent = "資料來源：Open-Meteo";

    try {
      const weather = await fetchWeatherForDate(destination.lat, destination.lon, dateStr);
      if (thisRequest !== weatherRequestToken) return; // 使用者已經切到別天了，這筆結果不要用

      if (!weather || weather.outOfRange) {
        container.querySelector("#wcCondText").textContent = "此日期還不在預報範圍內";
        container.querySelector("#wcTemp").textContent = "--°";
        container.querySelector("#wcHilo").textContent = "-- / --";
        container.querySelector("#wcRain").textContent = "--%";
        container.querySelector("#wcWind").textContent = "--";
        container.querySelector("#wcSunrise").textContent = "--:--";
        container.querySelector("#wcNote").textContent = "通常要到出發前 16 天內才查得到預報";
        return;
      }

      const desc = describeWeatherCode(weather.weatherCode);
      container.querySelector("#wcCondIcon").className = `fa-solid ${desc.icon}`;
      container.querySelector("#wcCondText").textContent = desc.label;
      container.querySelector("#wcTemp").textContent = `${Math.round(weather.tempMax)}°`;
      container.querySelector("#wcHilo").textContent = `${Math.round(weather.tempMin)}° / ${Math.round(weather.tempMax)}°`;
      container.querySelector("#wcRain").textContent = weather.rainChance != null ? `${weather.rainChance}%` : "--%";
      container.querySelector("#wcWind").textContent = weather.windSpeed != null ? `${Math.round(weather.windSpeed)} km/h` : "--";
      container.querySelector("#wcSunrise").textContent = weather.sunrise || "--:--";
    } catch (err) {
      if (thisRequest !== weatherRequestToken) return;
      console.error("[天氣資料讀取失敗]", err);
      container.querySelector("#wcCondText").textContent = "讀取失敗";
      container.querySelector("#wcNote").textContent = `請檢查網路連線，或稍後再試${err?.message ? `（${err.message}）` : ""}`;
    }
  }

  function renderTimeline() {
    const dayIndex = days.indexOf(selectedDate) + 1;
    sectionLabelEl.textContent = `Day ${dayIndex} 行程`;

    const events = allEvents
      .filter((e) => e.date === selectedDate)
      .sort((a, b) => (a.order ?? 0) - (b.order ?? 0));

    if (!events.length) {
      timelineEl.innerHTML = `<p style="text-align:center;color:var(--ink-soft);padding:20px 0;font-size:13px;">這天還沒有行程</p>`;
      return;
    }

    timelineEl.innerHTML = events
      .map((e) => {
        const meta = CATEGORY_META[e.category] || CATEGORY_META.spot;
        return `
          <div class="t-item" draggable="true" data-event-id="${e.id}">
            <div class="t-drag"><i class="fa-solid fa-grip-lines"></i></div>
            <div class="t-time">${e.time || ""}</div>
            <div class="t-card">
              <span class="t-cat" style="background:var(${meta.cssVar});">${meta.label}</span>
              <div class="t-title">${e.title || "（未命名）"}</div>
              ${e.location?.formattedAddress ? `<div class="t-loc"><i class="fa-solid fa-location-dot"></i>${e.location.formattedAddress}</div>` : ""}
              ${e.note ? `<div class="t-note"><i class="fa-solid fa-triangle-exclamation"></i><span>${truncate(e.note, 20)}</span></div>` : ""}
            </div>
          </div>
        `;
      })
      .join("");

    timelineEl.querySelectorAll(".t-item").forEach((item) => {
      item.querySelector(".t-card").addEventListener("click", () => {
        const ev = events.find((e) => e.id === item.dataset.eventId);
        openEditSheet(ev);
      });
      item.addEventListener("dragstart", () => {
        dragEl = item;
        item.classList.add("dragging");
      });
      item.addEventListener("dragend", () => {
        item.classList.remove("dragging");
        commitReorder();
      });
    });

    timelineEl.addEventListener("dragover", handleDragOver);
  }

  function handleDragOver(e) {
    e.preventDefault();
    if (!dragEl) return;
    const after = getDragAfterElement(timelineEl, e.clientY);
    if (after == null) timelineEl.appendChild(dragEl);
    else timelineEl.insertBefore(dragEl, after);
  }
  function getDragAfterElement(container_, y) {
    const items = [...container_.querySelectorAll(".t-item:not(.dragging)")];
    return items.reduce(
      (closest, child) => {
        const box = child.getBoundingClientRect();
        const offset = y - box.top - box.height / 2;
        return offset < 0 && offset > closest.offset ? { offset, element: child } : closest;
      },
      { offset: -Infinity }
    ).element;
  }
  async function commitReorder() {
    const ids = [...timelineEl.querySelectorAll(".t-item")].map((el) => el.dataset.eventId);
    const updates = ids.map((id, index) => ({ id, order: index }));
    await reorderScheduleEvents(tripId, updates);
    // 不用手動 renderTimeline，onSnapshot 會自己觸發重繪
  }

  function resetSheetState() {
    editingEventId = null;
    selectedCategory = null;
    locVerified = false;
    verifiedLocation = null;
    sheetTodos = [];
    catPicker.querySelectorAll(".cat-opt").forEach((o) => o.classList.remove("selected"));
    hotelQuickpick.innerHTML = "";
    hotelQuickpick.style.display = "none";
    fieldTime.value = "10:00";
    fieldTitle.value = "";
    fieldLoc.value = "";
    fieldNote.value = "";
    verifyStatus.innerHTML = "";
    verifyStatus.className = "verify-status";
    renderTodoList();
    updateSaveButton();
  }

  function renderTodoList() {
    todoListEl.innerHTML = sheetTodos
      .map(
        (t) => `
          <div class="todo-row" data-todo-id="${t.id}">
            <div class="todo-check ${t.checked ? "checked" : ""}"><i class="fa-solid fa-check"></i></div>
            <input type="text" class="todo-text-input" value="${t.text}" placeholder="輸入待辦事項">
            <i class="fa-solid fa-xmark todo-remove"></i>
          </div>
        `
      )
      .join("");
    todoListEl.querySelectorAll(".todo-row").forEach((row) => {
      const id = row.dataset.todoId;
      row.querySelector(".todo-check").addEventListener("click", () => {
        const t = sheetTodos.find((x) => x.id === id);
        t.checked = !t.checked;
        renderTodoList();
      });
      row.querySelector(".todo-text-input").addEventListener("input", (e) => {
        const t = sheetTodos.find((x) => x.id === id);
        t.text = e.target.value;
      });
      row.querySelector(".todo-remove").addEventListener("click", () => {
        sheetTodos = sheetTodos.filter((x) => x.id !== id);
        renderTodoList();
      });
    });
  }

  function updateSaveButton() {
    saveBtn.disabled = !locVerified;
    saveBtn.textContent = locVerified ? (editingEventId ? "儲存變更" : "儲存行程") : "先驗證地點";
  }

  async function showHotelQuickpick() {
    if (hotelsCache === null) {
      hotelsCache = await getHotelsOnce(tripId);
    }
    const matching = hotelsCache.filter(
      (h) => h.checkIn?.date <= selectedDate && selectedDate <= h.checkOut?.date
    );
    if (!matching.length) {
      hotelQuickpick.style.display = "none";
      return;
    }
    hotelQuickpick.style.display = "flex";
    hotelQuickpick.innerHTML = matching
      .map((h) => `<div class="hq-chip" data-hotel-id="${h.id}"><i class="fa-solid fa-hotel"></i>${h.name}</div>`)
      .join("");
    hotelQuickpick.querySelectorAll(".hq-chip").forEach((chip) => {
      chip.addEventListener("click", () => {
        const hotel = matching.find((h) => h.id === chip.dataset.hotelId);
        fieldTitle.value = hotel.name;
        fieldLoc.value = hotel.location?.formattedAddress || "";
        fieldTime.value = "22:00";
        locVerified = true;
        verifiedLocation = hotel.location?.lat != null
          ? { formattedAddress: hotel.location.formattedAddress, lat: hotel.location.lat, lon: hotel.location.lon }
          : { formattedAddress: hotel.location?.formattedAddress || "" };
        verifyStatus.className = "verify-status ok";
        verifyStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 已從預訂資料帶入，地址視為已驗證`;
        updateSaveButton();
      });
    });
  }

  catPicker.querySelectorAll(".cat-opt").forEach((opt) => {
    opt.addEventListener("click", () => {
      selectedCategory = opt.dataset.cat;
      catPicker.querySelectorAll(".cat-opt").forEach((o) => o.classList.remove("selected"));
      opt.classList.add("selected");
      opt.style.background = `var(${CATEGORY_META[selectedCategory].cssVar})`;
      opt.style.color = "var(--white)";
      catPicker.querySelectorAll(".cat-opt").forEach((o) => {
        if (o !== opt) {
          o.style.background = "";
          o.style.color = "";
        }
      });
      if (selectedCategory === "stay") {
        fieldTime.value = "22:00";
        showHotelQuickpick();
      } else {
        hotelQuickpick.style.display = "none";
      }
    });
  });

  fieldLoc.addEventListener("input", () => {
    locVerified = false;
    verifiedLocation = null;
    verifyStatus.innerHTML = "";
    verifyStatus.className = "verify-status";
    updateSaveButton();
  });

  container.querySelector("#btnVerifyLoc").addEventListener("click", async () => {
    const loc = fieldLoc.value.trim();
    if (!loc) {
      verifyStatus.className = "verify-status fail";
      verifyStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 請先輸入地點名稱`;
      return;
    }
    verifyStatus.className = "verify-status loading";
    verifyStatus.innerHTML = `<div class="spinner"></div> 正在比對地圖位置…`;
    try {
      const result = await verifyLocation(loc);
      if (!result) {
        locVerified = false;
        verifiedLocation = null;
        verifyStatus.className = "verify-status fail";
        verifyStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 找不到這個地點，請換個寫法試試`;
        updateSaveButton();
        return;
      }
      locVerified = true;
      verifiedLocation = result;
      verifyStatus.className = "verify-status ok";
      verifyStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 已驗證：${result.formattedAddress}`;
      updateSaveButton();
    } catch (err) {
      console.error("[行程地點驗證失敗]", err);
      locVerified = false;
      verifiedLocation = null;
      verifyStatus.className = "verify-status fail";
      verifyStatus.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i> 驗證失敗，請檢查網路連線`;
      updateSaveButton();
    }
  });

  container.querySelector("#btnAddTodo").addEventListener("click", () => {
    sheetTodos.push({ id: `t${Date.now()}`, text: "", checked: false });
    renderTodoList();
  });

  function openAddSheet() {
    resetSheetState();
    container.querySelector("#eventSheetTitle").textContent = "新增行程";
    deleteBtn.style.display = "none";
    sheetOverlay.classList.add("show");
  }

  function openEditSheet(ev) {
    resetSheetState();
    editingEventId = ev.id;
    container.querySelector("#eventSheetTitle").textContent = "編輯行程";
    deleteBtn.style.display = "block";

    selectedCategory = ev.category;
    const optEl = catPicker.querySelector(`[data-cat="${ev.category}"]`);
    if (optEl) {
      optEl.classList.add("selected");
      optEl.style.background = `var(${CATEGORY_META[ev.category].cssVar})`;
      optEl.style.color = "var(--white)";
    }
    fieldTime.value = ev.time || "10:00";
    fieldTitle.value = ev.title || "";
    fieldLoc.value = ev.location?.formattedAddress || "";
    fieldNote.value = ev.note || "";
    sheetTodos = (ev.todos || []).map((t, i) => ({ ...t, id: t.id || `t${i}` }));
    renderTodoList();

    locVerified = true;
    // 舊資料可能沒有 lat/lon；沿用既有 formattedAddress 當底，使用者沒改地點欄位就不會被清空
    verifiedLocation = ev.location?.lat != null
      ? { formattedAddress: ev.location.formattedAddress, lat: ev.location.lat, lon: ev.location.lon }
      : { formattedAddress: ev.location?.formattedAddress || "" };
    verifyStatus.className = "verify-status ok";
    verifyStatus.innerHTML = `<i class="fa-solid fa-circle-check"></i> 地點已驗證`;
    updateSaveButton();

    if (ev.category === "stay") showHotelQuickpick();

    sheetOverlay.classList.add("show");
  }

  function closeSheet() {
    sheetOverlay.classList.remove("show");
  }

  container.querySelector("#btnCancelEvent").addEventListener("click", closeSheet);
  container.querySelector("#btnAddEvent").addEventListener("click", openAddSheet);
  sheetOverlay.addEventListener("click", (e) => {
    if (e.target === sheetOverlay) closeSheet();
  });

  deleteBtn.addEventListener("click", async () => {
    if (!editingEventId) return;
    if (!confirm("確定要刪除這則行程嗎？")) return;
    await deleteScheduleEvent(tripId, editingEventId);
    closeSheet();
  });

  saveBtn.addEventListener("click", async () => {
    if (!selectedCategory) {
      alert("請選擇大分類");
      return;
    }
    if (!fieldTitle.value.trim()) {
      fieldTitle.focus();
      return;
    }
    const payload = {
      date: selectedDate,
      time: fieldTime.value,
      category: selectedCategory,
      title: fieldTitle.value.trim(),
      location: verifiedLocation || { formattedAddress: fieldLoc.value.trim() },
      note: fieldNote.value.trim(),
      todos: sheetTodos.map((t) => ({ id: t.id, text: t.text, checked: t.checked })),
      createdBy: memberId,
    };

    if (editingEventId) {
      await updateScheduleEvent(tripId, editingEventId, payload);
    } else {
      const dayEvents = allEvents.filter((e) => e.date === selectedDate);
      const maxOrder = dayEvents.reduce((m, e) => Math.max(m, e.order ?? 0), -1);
      payload.order = maxOrder + 1;
      await createScheduleEvent(tripId, payload);
    }
    closeSheet();
  });

  renderDateScroll();
  renderTimeline();
  updateWeatherCard(selectedDate);

  const unsubscribe = listenScheduleEvents(
    tripId,
    (events) => {
      allEvents = events;
      renderTimeline();
    },
    (error) => {
      timelineEl.innerHTML = `
        <div style="background:var(--warn-bg); border:2px solid var(--warn); border-radius:16px; padding:14px; font-size:12.5px; color:var(--ink);">
          <b>行程讀取失敗</b><br>
          最常見原因：Firestore 這個查詢需要建立索引。請按 F12 打開瀏覽器 Console，
          找到紅色錯誤訊息裡的連結，點下去建立索引（約 1-2 分鐘生效），再重新整理頁面。<br>
          <span style="color:var(--ink-soft);">錯誤代碼：${error.code || "unknown"}</span>
        </div>
      `;
    }
  );

  return unsubscribe;
}
// router.js
// hash-based 路由：
//   #/identity   身份綁定畫面（無殼，guest 第一次進來）
//   #/trips      我的旅程列表（無殼，僅主揪看得到）
//   #/wizard     開團 Wizard（無殼）
//   #/app/xxx    主要 App 殼（TripHeader + 分頁內容 + BottomNav）
//
// 每個 view 模組可以只 export render()（回傳 HTML 字串），
// 也可以額外 export mount(container)（插入 DOM 後才跑的非同步邏輯，例如打 Firestore）。



const TAB_RENDERERS = {
  schedule: renderScheduleView,
  bookings: renderBookingsView,
  expense: renderExpenseView,
  journal: renderJournalView,
  planning: renderPlanningView,
  members: renderMembersView,
};

const TAB_MOUNTERS = {
  schedule: mountScheduleView,
  bookings: mountBookingsView,
  expense: mountExpenseView,
  journal: mountJournalView,
  planning: mountPlanningView,
  members: mountMembersView,
};

const root = document.getElementById("app-root");
let membersUnsubscribe = null;
let activeTabCleanup = null;

function stopListeners() {
  if (membersUnsubscribe) {
    membersUnsubscribe();
    membersUnsubscribe = null;
  }
  if (activeTabCleanup) {
    activeTabCleanup();
    activeTabCleanup = null;
  }
}

async function renderAppShell(tabKey) {
  const { currentTripId } = getState();

  if (!currentTripId) {
    // 沒有目前的旅程可看，導回旅程列表（主揪）或提示錯誤（旅伴不該走到這裡）
    window.location.hash = "#/trips";
    return;
  }

  const trip = await getTrip(currentTripId);
  if (!trip) {
    root.innerHTML = `<div class="placeholder-view"><p>找不到這趟旅程。</p></div>`;
    return;
  }

  const tabRenderer = TAB_RENDERERS[tabKey] || renderScheduleView;
  const dayCount =
    trip.startDate && trip.endDate
      ? Math.round((new Date(trip.endDate) - new Date(trip.startDate)) / 86400000) + 1
      : null;
  const datesLabel =
    trip.startDate && trip.endDate
      ? `${trip.startDate} - ${trip.endDate}${dayCount ? ` · ${dayCount}天${dayCount - 1}夜` : ""}`
      : "";

  function paint(members) {
    const { currentMemberId } = getState();
    const me = members.find((m) => m.id === currentMemberId);
    const isHost = !!me?.isHost;

    root.innerHTML = `
      ${renderTripHeader({
        coverEmojiOrUrl: trip.coverValue,
        isPhotoUrl: trip.coverType === "photo",
        title: trip.name,
        datesLabel,
        isHost,
        members: members.map((m) => ({ avatarEmojiOrUrl: m.avatarValue, isPhotoUrl: m.avatarType === "upload", avatarPosition: m.avatarPosition, bg: "var(--sage-light)" })),
      })}
      <div class="view-body">${tabRenderer()}</div>
      ${renderBottomNav(tabKey)}
    `;

    bindTripHeaderEvents(root, {
      onSwitchTrip: () => { window.location.hash = "#/trips"; },
      onOpenSettings: () => { window.location.hash = "#/settings"; },
      onOpenMembers: () => { window.location.hash = "#/app/members"; },
    });
    bindBottomNavEvents(root, (key) => { window.location.hash = `#/app/${key}`; });
    mountPinModal(root);

    activeTabCleanup?.();
    activeTabCleanup = TAB_MOUNTERS[tabKey]?.(root, {
      tripId: currentTripId,
      memberId: getState().currentMemberId,
      isHost,
      trip,
      members,
    }) || null;
  }

  stopListeners();
  membersUnsubscribe = listenMembers(currentTripId, paint, (error) => {
    root.innerHTML = `
      <div class="placeholder-view">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <p><b>讀取成員資料失敗</b><br>
        請按 F12 打開瀏覽器 Console，找到紅色錯誤訊息裡的索引建立連結，點下去建立後重新整理。<br>
        <span style="font-size:11px;color:var(--ink-soft);">錯誤代碼：${error.code || "unknown"}</span></p>
      </div>
    `;
  });
}

async function renderStandalone(view) {
  root.innerHTML = view.render();
  await view.mount?.(root);
}

export async function handleRouteChange() {
  const hash = window.location.hash || "#/trips";
  stopListeners();

  if (hash === "#/identity") {
    await renderStandalone({ render: renderIdentityView, mount: mountIdentityView });
    return;
  }
  if (hash === "#/trips") {
    await renderStandalone({ render: renderTripListView, mount: mountTripListView });
    return;
  }
  if (hash === "#/wizard") {
    await renderStandalone({ render: renderTripWizardView, mount: mountTripWizardView });
    return;
  }
  if (hash === "#/settings") {
    await renderStandalone({ render: renderTripSettingsView, mount: mountTripSettingsView });
    return;
  }
  const appMatch = hash.match(/^#\/app\/(\w+)/);
  if (appMatch) {
    await renderAppShell(appMatch[1]);
    return;
  }

  window.location.hash = "#/trips";
}

window.addEventListener("hashchange", handleRouteChange);
// app.js
// 開站流程：
//   1. 匿名登入拿到 uid
//   2. 網址帶 ?trip=xxx 的話，代表是「旅伴透過邀請連結進來」：
//        - 這台裝置之前認領過 → 直接進 App 殼
//        - 沒認領過 → 導去身份綁定畫面
//   3. 沒有帶 ?trip= 的話，代表是「主揪自己開站」→ 導去我的旅程列表
//      （除非網址已經有 hash，例如重新整理時停在某個分頁，就維持原本的 hash）


async function boot() {
  const uid = await ensureAnonymousAuth();
  setState({ uid });

  const params = new URLSearchParams(window.location.search);
  const inviteTripId = params.get("trip");

  if (inviteTripId) {
    const boundMemberId = getBoundMemberId(inviteTripId);
    setState({ currentTripId: inviteTripId, currentMemberId: boundMemberId });
    window.location.hash = boundMemberId ? "#/app/schedule" : "#/identity";
  } else if (!window.location.hash || window.location.hash === "#/") {
    window.location.hash = "#/trips";
  }

  handleRouteChange();
}

boot();
